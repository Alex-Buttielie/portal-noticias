# CI (ARCHITECTURE.md — nova arquitetura de infra, 2026-09-03). Roda a
# suíte de testes do backend (195 testes) e o build de produção do
# frontend a cada push/PR — fecha a lacuna descrita na memória do projeto
# ("project-portal-noticias-tool-outage": boa parte do código foi escrita
# sem poder executar/testar de verdade). Nenhum deploy automático aqui de
# propósito: a VPS não tem runner nem segredo de SSH configurado ainda —
# ver infra/DEPLOY.md para o passo de deploy manual/documentado.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: brd_portal_noticias
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "true"
      DJANGO_DB_ENGINE: postgresql
      DJANGO_DB_NAME: brd_portal_noticias
      DJANGO_DB_USER: postgres
      DJANGO_DB_PASSWORD: postgres
      DJANGO_DB_HOST: localhost
      DJANGO_DB_PORT: "5432"
      DJANGO_CACHE_BACKEND: locmem
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: python manage.py check
      - run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
