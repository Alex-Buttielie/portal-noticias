# CI (ARCHITECTURE.md — nova arquitetura de infra, 2026-09-03). Roda a
# suíte de testes do backend (com gate de cobertura: --cov-fail-under=80)
# e o build de produção do
# frontend a cada push/PR — fecha a lacuna descrita na memória do projeto
# ("project-portal-noticias-tool-outage": boa parte do código foi escrita
# sem poder executar/testar de verdade). Também é chamado pelos workflows
# de deploy como o job `verify`; nesse caso é o gate do mesmo run, antes
# de qualquer conexão SSH. Só valida, não faz deploy: o provisionamento é
# papel dos workflows deploy-dev/homolog/prod (PM2 + Nginx na VPS).
name: CI

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Ref/commit exato a verificar; vazio usa o SHA do evento chamador"
        required: false
        type: string
        default: ""
    # Secrets OPCIONAIS e só do Sentry (C2.4). Precisam estar declarados aqui
    # porque o chamador tem que repassá-los um a um; `required: false` é o que
    # mantém o CI verde em fork, em clone local e antes de a conta existir. O
    # passo de upload é fail-open justamente por isso (ver `frontend-build`).
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false
      SENTRY_ORG:
        required: false
      SENTRY_PROJECT:
        required: false
      SENTRY_URL:
        required: false
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: brd_portal_noticias
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "true"
      DJANGO_DB_ENGINE: postgresql
      DJANGO_DB_NAME: brd_portal_noticias
      DJANGO_DB_USER: postgres
      DJANGO_DB_PASSWORD: postgres
      DJANGO_DB_HOST: localhost
      DJANGO_DB_PORT: "5432"
      # SEM DJANGO_CACHE_BACKEND=locmem de propósito: a suíte foi desenhada
      # para throttle inerte sem Redis (o teste dedicado de throttling isola
      # o próprio cache); locmem compartilhado causa 429 espúrios entre testes.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # No workflow reutilizável, o caller envia o mesmo commit/ref que
          # será implantado. No trigger direto, mantém o comportamento padrão.
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock.txt
            backend/requirements-dev.txt
      # O lock é runtime; as ferramentas de teste são instaladas só no runner.
      - run: pip install -r requirements-lock.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python -m pytest -q --cov=. --cov-report=term-missing --cov-fail-under=80

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          # No workflow reutilizável, o caller envia o mesmo commit/ref que
          # será implantado. No trigger direto, mantém o comportamento padrão.
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Verificar datas civis e instantes em TZ UTC/Tokyo
        run: |
          TZ=UTC node scripts/verificar-datas-tz.mjs
          TZ=Asia/Tokyo node scripts/verificar-datas-tz.mjs
      # Política conservadora do cache de cliente (P1-6): valida staleTimes
      # (público 60s/privado 15s), ausência de persistência e chaves sem
      # token/PII. Node puro, sem dependências; fail fast antes do tsc/build.
      - name: Verificar política de cache do query client (TanStack Query)
        run: node scripts/verificar-query-client.mjs
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # --- Source maps no Sentry (C2.4) -------------------------------------
      # FAIL-OPEN de propósito, em duas camadas:
      #   1) sem `SENTRY_AUTH_TOKEN` o passo nem roda (PR de fork, clone local,
      #      repositório sem conta ainda). Um CI que exige segredo para
      #      buildar trava o projeto inteiro — inclusive quem só quer abrir PR;
      #   2) mesmo configurado, uma falha de upload NÃO reprova o build
      #      (`continue-on-error`): source map é insumo de diagnóstico, e
      #      transformar indisponibilidade do Sentry em indisponibilidade de
      #      deploy é trocar um problema pequeno por um grande.
      # `if:` não pode referenciar `secrets` (o GitHub recusa a expressão), por
      # isso a decisão sai de um passo anterior que publica um output.
      - name: Verificar configuração do Sentry
        id: sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set -eu
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "habilitado=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sentry sem SENTRY_AUTH_TOKEN: upload de source maps PULADO (fail-open)."
            exit 0
          fi
          if [ -z "${SENTRY_ORG:-}" ] || [ -z "${SENTRY_PROJECT:-}" ]; then
            echo "habilitado=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SENTRY_AUTH_TOKEN existe, mas SENTRY_ORG/SENTRY_PROJECT não: upload PULADO. Preencha os três secrets (ver CI-CD.md, seção de secrets)."
            exit 0
          fi
          echo "habilitado=true" >> "$GITHUB_OUTPUT"
      - name: Enviar source maps ao Sentry
        if: steps.sentry.outputs.habilitado == 'true'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
        run: |
          set -eu
          # Release = o commit REALMENTE verificado, e não `github.sha`: no
          # `workflow_call` o checkout é `inputs.checkout_ref`, e em PR o
          # `github.sha` é o merge commit. Sem source map do mesmo release que
          # o deploy promovou, a correlação de stack trace não fecha.
          RELEASE="$(git rev-parse HEAD)"
          TOTAL="$(find .next -type f -name '*.map' 2>/dev/null | wc -l | tr -d ' ')"
          if [ "$TOTAL" = "0" ]; then
            echo "::notice::Nenhum .map em .next: upload PULADO. Se o next.config.js voltar ao default do SDK (apagar os mapas após o upload) ou se nenhum plugin os gerar, nada é enviado — com aviso, não com erro."
            exit 0
          fi
          echo "source maps encontrados: $TOTAL (release $RELEASE)"
          # O CLI vem como dependência TRANSITIVA do @sentry/nextjs (via
          # @sentry/bundler-plugin-core) e a versão é a do lockfile — que é a
          # versão que o próprio `withSentryConfig` usa no build. Instalar
          # "a versão do @sentry/nextjs" aqui estaria errado: o CLI tem linha
          # de versionamento própria (2.x), e um `npx @sentry/cli@10.x` pediria
          # um pacote que não existe.
          if [ ! -x node_modules/.bin/sentry-cli ]; then
            echo "::warning::node_modules/.bin/sentry-cli ausente: upload PULADO. O @sentry/nextjs traz o CLI como transitiva; se isso mudar, fixe a versão aqui em vez de adivinhar."
            exit 0
          fi
          node_modules/.bin/sentry-cli sourcemaps upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            --release "$RELEASE" \
            --strip-prefix "$PWD" \
            --ignore '.next/cache' \
            --ignore 'node_modules' \
            --max-src-map-size 20000000 \
            .next
          if [ -n "${SENTRY_URL:-}" ]; then
            echo "::notice::SENTRY_URL configurado (instância self-hosted): o sentry-cli usa SENTRY_URL do ambiente."
          fi

  # Gate de configuração de infra (C2.5). Configuração de Nginx, systemd,
  # Compose, JSON e regras de alerta só quebra quando alguém INSTALA, e a
  # instalação é na VPS em produção. Este job roda a mesma verificação
  # localmente, antes disso, e é o mesmo script executável fora do CI.
  #
  # `--estrito` com pendência DECLARADA em scripts/observability/pendencias-ci.txt:
  # a pendência real conhecida (runbook_url com domínio reservado) sai como
  # [PENDENTE] e não reprova; qualquer pendência NOVA reprova na hora. Sem a
  # lista, o estrito puniria o CI para sempre por algo que só se resolve com
  # acesso ao serviço externo, e gate vermelho permanente é gate ignorado.
  infra-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      # PyYAML é requisito do validador (regras de alerta e extração de expr).
      # Sem ele o script acusa FALHA — corretamente: item que não pôde ser
      # validado não é item validado.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet --disable-pip-version-check pyyaml
      - name: Validar configuração de infra
        run: scripts/observability/validar-infra.sh --estrito
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: validar-infra-relatorio
          path: |
            infra/observability/alerts/*.yaml
            infra/nginx/*.conf
            infra/systemd/*
          retention-days: 7
          if-no-files-found: ignore
