# CI (ARCHITECTURE.md — nova arquitetura de infra, 2026-09-03). Roda a
# suíte de testes do backend (com gate de cobertura: --cov-fail-under=80)
# e o build de produção do
# frontend a cada push/PR — fecha a lacuna descrita na memória do projeto
# ("project-portal-noticias-tool-outage": boa parte do código foi escrita
# sem poder executar/testar de verdade). No job do frontend o gate também
# roda lint (ESLint), typecheck (tsc --noEmit, DEPOIS do build, porque antes
# dele o Next ainda não gerou os tipos) e npm audit sobre as dependências.
# Também é chamado pelos workflows
# de deploy como o job `verify`; nesse caso é o gate do mesmo run, antes
# de qualquer conexão SSH. Só valida, não faz deploy: o provisionamento é
# papel dos workflows deploy-dev/homolog/prod (PM2 + Nginx na VPS).
name: CI

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Ref/commit exato a verificar; vazio usa o SHA do evento chamador"
        required: false
        type: string
        default: ""
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: brd_portal_noticias
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "true"
      DJANGO_DB_ENGINE: postgresql
      DJANGO_DB_NAME: brd_portal_noticias
      DJANGO_DB_USER: postgres
      DJANGO_DB_PASSWORD: postgres
      DJANGO_DB_HOST: localhost
      DJANGO_DB_PORT: "5432"
      # SEM DJANGO_CACHE_BACKEND=locmem de propósito: a suíte foi desenhada
      # para throttle inerte sem Redis (o teste dedicado de throttling isola
      # o próprio cache); locmem compartilhado causa 429 espúrios entre testes.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # No workflow reutilizável, o caller envia o mesmo commit/ref que
          # será implantado. No trigger direto, mantém o comportamento padrão.
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock.txt
            backend/requirements-dev.txt
      # O lock é runtime; as ferramentas de teste são instaladas só no runner.
      - run: pip install -r requirements-lock.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python -m pytest -q --cov=. --cov-report=term-missing --cov-fail-under=80

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          # No workflow reutilizável, o caller envia o mesmo commit/ref que
          # será implantado. No trigger direto, mantém o comportamento padrão.
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # ÚNICO install do job. Lint, build, typecheck e audit abaixo rodam
      # todos contra este mesmo node_modules — nenhum passo reinstala.
      - run: npm ci
      - name: Verificar datas civis e instantes em TZ UTC/Tokyo
        run: |
          TZ=UTC node scripts/verificar-datas-tz.mjs
          TZ=Asia/Tokyo node scripts/verificar-datas-tz.mjs
      # Política conservadora do cache de cliente (P1-6): valida staleTimes
      # (público 60s/privado 15s), ausência de persistência e chaves sem
      # token/PII. Node puro, sem dependências; fail fast antes do tsc/build.
      - name: Verificar política de cache do query client (TanStack Query)
        run: node scripts/verificar-query-client.mjs
      - name: Lint (ESLint)
        run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # typecheck DEPOIS do build, não antes: antes dele o Next ainda não
      # gerou os tipos de rota (.next/types, next-env.d.ts) e o tsc falha por
      # arquivo ausente — reprovação falsa. Depois do build os tipos existem
      # e o gate passa a medir o código realmente gerado.
      - name: Typecheck (tsc --noEmit, após o build)
        run: npm run typecheck
      # O gate de audit é `frontend/scripts/verificar-audit.mjs`, que chama
      # `npm audit --json` por dentro e classifica cada advisory RAIZ.
      #
      # Por que não `npm audit --audit-level=high` direto: existia 1 advisory
      # raiz sem NENHUMA versão corrigida (`braces`, CVE-2026-93687,
      # first_patched_version: null). Um gate que exige o impossível não é um
      # gate — é uma porta trancada sem chave, que só ensina a pessoa a parar
      # de olhar. Em 2026-10-08 esse gate reprovava com 9 high e travava TODO o
      # pipeline, inclusive o `verify` dos deploys.
      #
      # Por que não `--omit=dev`, que era a alternativa óbvia e menor: NÃO
      # FUNCIONA aqui. `tailwindcss` está em `dependencies`, e é por ele que
      # `braces` entra na árvore, então `--omit=dev` continua listando `braces`.
      # E se alguém mover um dia uma dependência de runtime para
      # `devDependencies`, ele passaria a esconder exatamente o que este gate
      # existe para enxergar. Omitir não é auditar o que importa.
      #
      # O que o script faz: reprova por QUALQUER advisory raiz fora da lista
      # documentada no próprio script — advisory novo, dependência nova, bump
      # de versão, tudo reprova. Só o que está na lista, com a justificativa
      # escrita e a verificação que a sustenta, passa; e a saída do log imprime
      # o tolerado com o motivo, para o verde nunca ser silencioso.
      #
      # A classificação não veio de ler o audit: `braces` está AUSENTE de
      # .next/standalone (output tracing do next build). Os dois advisories de
      # runtime que existiam — `sharp` CVE-2026-96889 e `source-map-js`
      # CVE-2026-93749 — estão PRESENTES, e por isso foram corrigidos, não
      # tolerados.
      - name: Auditoria de dependências (classificada por risco real)
        run: node scripts/verificar-audit.mjs
