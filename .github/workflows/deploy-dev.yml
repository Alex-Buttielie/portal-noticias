name: Deploy DEV

# Thin caller — toda a lógica vive em deploy.yml (reutilizável). Push em
# develop implanta /home/apps/portal-dev (3101/5101).
on:
  push:
    branches: [develop]

jobs:
  deploy-dev:
    uses: ./.github/workflows/deploy.yml
    with:
      env_label: DEV
      environment_name: development
      app_dir: /home/apps/portal-dev
      git_mode: branch
      git_ref: develop
      # SHA do push: o gate e o checkout da VPS não podem testar/implantar
      # commits diferentes se outro push entrar enquanto o run está na fila.
      verify_ref: ${{ github.sha }}
      pm_suffix: dev
      web_port: "3101"
      api_port: "5101"
      host: dev.portal-noticias.com.br
      # TLS só é ativado depois da emissão do certificado neste ambiente.
      tls_enabled: false
      db_name: brd_portal_dev
      db_user: portal_dev
      strict_validate: false
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      # Autenticação por chave dedicada e impressão digital do host (C2.6).
      # Ambos OPCIONAIS: sem eles, o caminho por senha é idêntico ao anterior.
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
      # Sentry (C2.4): opcionais, usados só para o upload de source map do
      # `verify`. Sem eles, o passo é pulado (fail-open) e o CI segue verde —
      # comportamento CORRETO em dev (D1: só PROD exige credencial).
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_URL: ${{ secrets.SENTRY_URL }}
