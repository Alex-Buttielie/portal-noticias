name: Deploy DEV
on:
  push: { branches: [develop] }
jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Install web
        working-directory: apps/web
        run: npm install
      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit || echo "typecheck warn"
      - name: Install api
        working-directory: apps/api
        run: pip install -r requirements.txt
      - name: Ruff
        working-directory: apps/api
        run: ruff check . || echo "ruff warn"
      - name: Deploy to VPS (DEV) PM2 3101/5101
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set +e
            export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"; nvm use 20
            set +e
            APP_DIR="/home/apps/portal-dev"; BRANCH="develop"
            echo "=== Deploy DEV portal-noticias ==="
            mkdir -p /home/apps; [ -d "$APP_DIR/.git" ] || git clone -b $BRANCH https://github.com/Alex-Buttielie/portal-noticias.git "$APP_DIR"
            cd "$APP_DIR"; git fetch origin && git reset --hard origin/$BRANCH
            echo "-> web build"
            cd apps/web; npm install --production 2>&1 | tail -5; npm run build 2>&1 | tail -30; cd ../..
            echo "-> api venv"
            cd apps/api; python3 -m venv .venv 2>&1 | head -3; .venv/bin/pip install --upgrade pip 2>&1 | tail -5; .venv/bin/pip install -q -r requirements.txt 2>&1 | tail -10; cd ../..
            echo "-> PM2 restart web + api gunicorn"
            pm2 delete portal-web-dev 2>/dev/null || echo "no web to delete"
            pkill -f "gunicorn.*5101" 2>/dev/null || echo "no gunicorn to kill"; sleep 2
            cd "$APP_DIR/apps/web"; PORT=3101 pm2 start node_modules/next/dist/bin/next --name portal-web-dev -- start -p 3101 2>&1 | tail -30 || echo "pm2 web start warn"
            cd "$APP_DIR/apps/api"; DJANGO_SETTINGS_MODULE=config.settings /home/apps/portal-dev/apps/api/.venv/bin/gunicorn config.wsgi:application --bind 0.0.0.0:5101 --workers 2 --daemon --access-logfile /tmp/gunicorn_5101_access.log --error-logfile /tmp/gunicorn_5101_error.log 2>&1; echo "gunicorn daemon:$?"
            sleep 4; ps aux | grep gunicorn | grep 5101 | grep -v grep | head -5 || echo "no gunicorn ps"
            pm2 list 2>&1 | head -80 || true; pm2 save 2>&1 | tail -5 || true
            echo "=== DEV deployed 3101(web) 5101(api) ==="; exit 0
      - name: Validate DEV
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set +e
            export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"; nvm use 20
            sleep 3
            echo "--- API health ---"
            curl -sf http://localhost:5101/api/health/ && echo "DEV api ok" || (echo "DEV api warn"; curl -i http://localhost:5101/api/health/ 2>&1 | head -20; ps aux | grep gunicorn | grep 5101 | head -10; cat /tmp/gunicorn_5101_error.log 2>&1 | tail -40)
            echo "--- WEB ---"
            curl -sf http://localhost:3101/ 2>&1 | head -c 200; echo ""; echo "WEB check done"
            pm2 status 2>&1 | head -60; ps aux | grep -E "next|gunicorn" | grep -v grep | head -20; exit 0
