name: Deploy DEV

# Thin caller — toda a lógica vive em deploy.yml (reutilizável). Push em
# develop implanta /home/apps/portal-dev (3101/5101).
on:
  push:
    branches: [develop]

jobs:
  deploy-dev:
    uses: ./.github/workflows/deploy.yml
    with:
      env_label: DEV
      environment_name: development
      app_dir: /home/apps/portal-dev
      git_mode: branch
      git_ref: develop
      guard_ref: ${{ github.sha }}
      pm_suffix: dev
      web_port: "3101"
      api_port: "5101"
      host: dev.portal-noticias.com.br
      db_name: brd_portal_dev
      db_user: portal_dev
      strict_validate: false
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
