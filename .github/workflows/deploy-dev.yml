name: Deploy DEV
on: { push: { branches: [develop] } }
jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/apps/portal-noticias-dev || git clone -b develop https://github.com/Alex-Buttielie/portal-noticias.git /home/apps/portal-noticias-dev; cd /home/apps/portal-noticias-dev
            git fetch origin && git reset --hard origin/develop
            docker compose -f docker-compose.yml up -d --build
            sleep 8; curl -sf http://localhost:5000/api/health/ && echo "DEV ok" || docker logs portal-noticias-dev-backend-1 --tail 50
