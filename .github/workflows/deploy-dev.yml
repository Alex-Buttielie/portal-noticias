name: Deploy DEV

# Thin caller — toda a lógica vive em deploy.yml (reutilizável). Push em
# develop implanta /home/apps/portal-dev (3101/5101).
on:
  push:
    branches: [develop]

jobs:
  deploy-dev:
    uses: ./.github/workflows/deploy.yml
    with:
      env_label: DEV
      environment_name: development
      app_dir: /home/apps/portal-dev
      git_mode: branch
      git_ref: develop
      # SHA do push: o gate e o checkout da VPS não podem testar/implantar
      # commits diferentes se outro push entrar enquanto o run está na fila.
      verify_ref: ${{ github.sha }}
      pm_suffix: dev
      web_port: "3101"
      api_port: "5101"
      host: dev.portal-noticias.com
      # TLS só é ativado depois da emissão do certificado neste ambiente.
      tls_enabled: false
      db_name: brd_portal_dev
      db_user: portal_dev
      strict_validate: true
      usuarios_teste: true
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      # Autenticacao do SSH por CHAVE. Sem este secret o `deploy.yml` RECUSA o
      # run inteiro: `VPS_SSH_KEY` e `required: true` la, e nao ha fallback para a
      # senha por proposito. Passe-o aqui, nos tres chamadores, e o pipeline
      # funciona por chave.
      #
      # Medido em 2026-10-08: enquanto esta linha faltava, os quatro `Deploy DEV`
      # seguintes terminaram em 0s com "This run likely failed because of a
      # workflow file issue" — o workflow reutilizavel exige o secret e o
      # chamador nao o fornecia. Um secret obrigatorio que ninguem passa falha
      # cedo e sem mensagem util; por isso o comentario.
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
