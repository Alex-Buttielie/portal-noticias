name: Rollback manual do portal

# Recuperação explícita para a topologia PM2 de VPS única. Este workflow
# não promete zero downtime: ele reutiliza o mesmo verify → build/install →
# PM2 restart/sanity → smoke do deploy reutilizável, mas só após um dispatch
# humano e com um SHA completo. A promoção do marker `.deployed-sha` continua
# condicionada ao smoke verde.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment e diretório da VPS a recuperar"
        required: true
        type: choice
        options:
          - development
          - homolog
          - production
      target_sha:
        description: "SHA completo do commit conhecido como bom (normalmente o valor de .deployed-sha antes da falha)"
        required: true
        type: string
      tls_enabled:
        description: "Deve corresponder ao edge atual; não habilita certificado por si só"
        required: false
        default: false
        type: boolean
      web_runtime:
        description: "Runtime do web. standalone = release atômica (igual ao deploy normal); npm = o npm start anterior. Use npm se a suspeita recair sobre o runtime standalone e não sobre o código (C2.2)"
        required: false
        default: standalone
        type: choice
        options:
          - standalone
          - npm
      celery_systemd:
        description: "Reaplica as units do Celery neste rollback (o padrão do deploy é true)"
        required: false
        default: true
        type: boolean
      confirm:
        description: "Confirmo que este rollback foi autorizado e que o SHA é o último bom"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      env_label: ${{ steps.config.outputs.env_label }}
      environment_name: ${{ steps.config.outputs.environment_name }}
      app_dir: ${{ steps.config.outputs.app_dir }}
      git_ref: ${{ steps.config.outputs.git_ref }}
      pm_suffix: ${{ steps.config.outputs.pm_suffix }}
      web_port: ${{ steps.config.outputs.web_port }}
      api_port: ${{ steps.config.outputs.api_port }}
      host: ${{ steps.config.outputs.host }}
      db_name: ${{ steps.config.outputs.db_name }}
      db_user: ${{ steps.config.outputs.db_user }}
      allowed_hosts_extra: ${{ steps.config.outputs.allowed_hosts_extra }}
    steps:
      - name: Validar alvo e mapear ambiente
        id: config
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TARGET_SHA: ${{ inputs.target_sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -eu
          if [ "$CONFIRM" != "true" ]; then
            echo "ERRO: confirme a operação no dispatch; nenhum comando foi executado na VPS." >&2
            exit 1
          fi
          if [ "${#TARGET_SHA}" -ne 40 ] || [ -n "$(printf '%s' "$TARGET_SHA" | tr -d '0-9a-fA-F')" ]; then
            echo "ERRO: target_sha deve conter exatamente 40 caracteres hexadecimais." >&2
            exit 1
          fi
          TARGET_SHA="$(printf '%s' "$TARGET_SHA" | tr '[:upper:]' '[:lower:]')"
          case "$ENVIRONMENT" in
            development)
              ENV_LABEL=DEV
              ENVIRONMENT_NAME=development
              APP_DIR=/home/apps/portal-dev
              PM_SUFFIX=dev
              WEB_PORT=3101
              API_PORT=5101
              HOST=dev.portal-noticias.com.br
              DB_NAME=brd_portal_dev
              DB_USER=portal_dev
              ALLOWED_HOSTS_EXTRA=""
              ;;
            homolog)
              ENV_LABEL=HOMOLOG
              ENVIRONMENT_NAME=homolog
              APP_DIR=/home/apps/portal-homolog
              PM_SUFFIX=homolog
              WEB_PORT=3102
              API_PORT=5102
              HOST=homolog.portal-noticias.com.br
              DB_NAME=brd_portal_homolog
              DB_USER=portal_homolog
              ALLOWED_HOSTS_EXTRA=""
              ;;
            production)
              ENV_LABEL=PROD
              ENVIRONMENT_NAME=production
              APP_DIR=/home/apps/portal-prod
              PM_SUFFIX=prod
              WEB_PORT=3103
              API_PORT=5103
              HOST=portal-noticias.com.br
              DB_NAME=brd_portal_prod
              DB_USER=portal_prod
              ALLOWED_HOSTS_EXTRA=",www.portal-noticias.com.br"
              ;;
            *)
              echo "ERRO: ambiente de rollback inválido: $ENVIRONMENT" >&2
              exit 1
              ;;
          esac
          {
            printf 'env_label=%s\n' "$ENV_LABEL"
            printf 'environment_name=%s\n' "$ENVIRONMENT_NAME"
            printf 'app_dir=%s\n' "$APP_DIR"
            printf 'git_ref=%s\n' "$TARGET_SHA"
            printf 'pm_suffix=%s\n' "$PM_SUFFIX"
            printf 'web_port=%s\n' "$WEB_PORT"
            printf 'api_port=%s\n' "$API_PORT"
            printf 'host=%s\n' "$HOST"
            printf 'db_name=%s\n' "$DB_NAME"
            printf 'db_user=%s\n' "$DB_USER"
            printf 'allowed_hosts_extra=%s\n' "$ALLOWED_HOSTS_EXTRA"
          } >> "$GITHUB_OUTPUT"

  rollback:
    needs: prepare
    if: ${{ needs.prepare.result == 'success' }}
    uses: ./.github/workflows/deploy.yml
    with:
      env_label: ${{ needs.prepare.outputs.env_label }}
      environment_name: ${{ needs.prepare.outputs.environment_name }}
      app_dir: ${{ needs.prepare.outputs.app_dir }}
      # rollback faz fetch do SHA, reset, rebuild e restart pelo mesmo caminho
      # gated do deploy; não existe um segundo script de provisionamento.
      git_mode: rollback
      git_ref: ${{ needs.prepare.outputs.git_ref }}
      verify_ref: ${{ needs.prepare.outputs.git_ref }}
      pm_suffix: ${{ needs.prepare.outputs.pm_suffix }}
      web_port: ${{ needs.prepare.outputs.web_port }}
      api_port: ${{ needs.prepare.outputs.api_port }}
      host: ${{ needs.prepare.outputs.host }}
      tls_enabled: ${{ inputs.tls_enabled }}
      allowed_hosts_extra: ${{ needs.prepare.outputs.allowed_hosts_extra }}
      db_name: ${{ needs.prepare.outputs.db_name }}
      db_user: ${{ needs.prepare.outputs.db_user }}
      # Um rollback deve falhar se a recuperação não ficar saudável, mesmo em
      # DEV/HOMOLOG; o operador pode repetir o dispatch depois de corrigir a VPS.
      strict_validate: true
      # O rollback percorre o MESMO caminho do deploy (build na VPS, release
      # nova a partir do SHA alvo, smoke, promoção do symlink). Não existe
      # caminho de provisionamento separado: por isso `web_runtime` aparece
      # aqui também — se o diagnóstico apontar o RUNTIME e não o código, `npm`
      # volta ao `npm start` sem precisar editar workflow.
      web_runtime: ${{ inputs.web_runtime }}
      celery_systemd: ${{ inputs.celery_systemd }}
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      # Opcionais (C2.6): vazio = caminho por senha, como antes.
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
      # Sentry (C2.4): opcionais, usados só para o upload de source map do
      # `verify`. Sem eles, o passo é pulado (fail-open) e o CI segue verde.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_URL: ${{ secrets.SENTRY_URL }}
