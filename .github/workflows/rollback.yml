name: Rollback manual do portal

# Recuperação explícita (cutover Docker). Diferença-chave da topologia PM2
# anterior: o rollback NÃO rebuilda nada — reusa a imagem já publicada no
# GHCR para o SHA alvo (tag `<ambiente>-<sha40>`), a mesma que rodou de
# verdade quando aquele SHA foi implantado pela última vez. `verify` ainda
# roda (nunca confiar num estado histórico sem reconferir); só o
# `build-and-push` é pulado (`skip_build: true` no deploy.yml reutilizável).
#
# Pré-requisito: a tag daquele SHA ainda precisa existir no GHCR — se a
# política de retenção de pacotes já a removeu, o `docker compose pull` na
# VPS falha com erro claro (imagem não encontrada), não com um rollback
# silenciosamente incompleto. Mantenha pelo menos as últimas N tags por
# ambiente, e nunca a que `.deployed-sha` aponta.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment e diretório da VPS a recuperar"
        required: true
        type: choice
        options:
          - development
          - homolog
          - production
      target_sha:
        description: "SHA completo do commit conhecido como bom (normalmente o valor de .deployed-sha antes da falha) — a imagem desse SHA precisa já estar publicada no GHCR"
        required: true
        type: string
      confirm:
        description: "Confirmo que este rollback foi autorizado e que o SHA é o último bom"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      env_label: ${{ steps.config.outputs.env_label }}
      environment_name: ${{ steps.config.outputs.environment_name }}
      app_dir: ${{ steps.config.outputs.app_dir }}
      git_ref: ${{ steps.config.outputs.git_ref }}
      web_port: ${{ steps.config.outputs.web_port }}
      api_port: ${{ steps.config.outputs.api_port }}
      host: ${{ steps.config.outputs.host }}
      db_name: ${{ steps.config.outputs.db_name }}
      db_user: ${{ steps.config.outputs.db_user }}
      allowed_hosts_extra: ${{ steps.config.outputs.allowed_hosts_extra }}
      image_tag: ${{ steps.config.outputs.image_tag }}
    steps:
      - name: Validar alvo e mapear ambiente
        id: config
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TARGET_SHA: ${{ inputs.target_sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -eu
          if [ "$CONFIRM" != "true" ]; then
            echo "ERRO: confirme a operação no dispatch; nenhum comando foi executado na VPS." >&2
            exit 1
          fi
          if [ "${#TARGET_SHA}" -ne 40 ] || [ -n "$(printf '%s' "$TARGET_SHA" | tr -d '0-9a-fA-F')" ]; then
            echo "ERRO: target_sha deve conter exatamente 40 caracteres hexadecimais." >&2
            exit 1
          fi
          TARGET_SHA="$(printf '%s' "$TARGET_SHA" | tr '[:upper:]' '[:lower:]')"
          case "$ENVIRONMENT" in
            development)
              ENV_LABEL=DEV
              ENVIRONMENT_NAME=development
              APP_DIR=/home/apps/portal-dev
              WEB_PORT=3101
              API_PORT=5101
              HOST=dev.portal-noticias.com
              DB_NAME=brd_portal_dev
              DB_USER=portal_dev
              ALLOWED_HOSTS_EXTRA=""
              ;;
            homolog)
              ENV_LABEL=HOMOLOG
              ENVIRONMENT_NAME=homolog
              APP_DIR=/home/apps/portal-homolog
              WEB_PORT=3102
              API_PORT=5102
              HOST=homolog.portal-noticias.com
              DB_NAME=brd_portal_homolog
              DB_USER=portal_homolog
              ALLOWED_HOSTS_EXTRA=""
              ;;
            production)
              ENV_LABEL=PROD
              ENVIRONMENT_NAME=production
              APP_DIR=/home/apps/portal-prod
              WEB_PORT=3103
              API_PORT=5103
              HOST=portal-noticias.com
              DB_NAME=brd_portal_prod
              DB_USER=portal_prod
              ALLOWED_HOSTS_EXTRA=",www.portal-noticias.com"
              ;;
            *)
              echo "ERRO: ambiente de rollback inválido: $ENVIRONMENT" >&2
              exit 1
              ;;
          esac
          {
            printf 'env_label=%s\n' "$ENV_LABEL"
            printf 'environment_name=%s\n' "$ENVIRONMENT_NAME"
            printf 'app_dir=%s\n' "$APP_DIR"
            printf 'git_ref=%s\n' "$TARGET_SHA"
            printf 'web_port=%s\n' "$WEB_PORT"
            printf 'api_port=%s\n' "$API_PORT"
            printf 'host=%s\n' "$HOST"
            printf 'db_name=%s\n' "$DB_NAME"
            printf 'db_user=%s\n' "$DB_USER"
            printf 'allowed_hosts_extra=%s\n' "$ALLOWED_HOSTS_EXTRA"
            printf 'image_tag=%s-%s\n' "$ENVIRONMENT_NAME" "$TARGET_SHA"
          } >> "$GITHUB_OUTPUT"

  rollback:
    needs: prepare
    if: ${{ needs.prepare.result == 'success' }}
    uses: ./.github/workflows/deploy.yml
    with:
      env_label: ${{ needs.prepare.outputs.env_label }}
      environment_name: ${{ needs.prepare.outputs.environment_name }}
      app_dir: ${{ needs.prepare.outputs.app_dir }}
      # rollback faz fetch do SHA + reset (config only — a imagem não é
      # rebuildada) pelo mesmo caminho gated do deploy; não existe um
      # segundo script de provisionamento.
      git_mode: rollback
      git_ref: ${{ needs.prepare.outputs.git_ref }}
      verify_ref: ${{ needs.prepare.outputs.git_ref }}
      web_port: ${{ needs.prepare.outputs.web_port }}
      api_port: ${{ needs.prepare.outputs.api_port }}
      host: ${{ needs.prepare.outputs.host }}
      allowed_hosts_extra: ${{ needs.prepare.outputs.allowed_hosts_extra }}
      db_name: ${{ needs.prepare.outputs.db_name }}
      db_user: ${{ needs.prepare.outputs.db_user }}
      # Um rollback deve falhar se a recuperação não ficar saudável, mesmo em
      # DEV/HOMOLOG; o operador pode repetir o dispatch depois de corrigir a VPS.
      strict_validate: true
      skip_build: true
      image_tag_override: ${{ needs.prepare.outputs.image_tag }}
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      # Autenticacao do SSH por CHAVE, igual aos outros tres chamadores.
      # `VPS_SSH_KEY` e `required: true` no deploy.yml: um chamador que nao o
      # passa e INVALIDADO pelo GitHub, e o rollback — que existe justamente para
      # ser acionado quando algo deu errado — ficaria indisponivel. Foi o que
      # aconteceu com deploy-dev/homolog/prod em 2026-10-02: quatro runs
      # seguidos terminaram em 0s, sem job nenhum.
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
      # Resend (P1-04): opcional. Ausente mantém DJANGO_EMAIL_BACKEND=console.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # Sentry (C2.4): opcionais, usados só para o upload de source map do
      # `verify`. Sem eles, o passo é pulado (fail-open) e o CI segue verde.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_URL: ${{ secrets.SENTRY_URL }}
