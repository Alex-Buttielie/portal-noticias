name: Deploy PROD

# Thin caller — toda a lógica vive em deploy-pm2.yml (reutilizável, PM2+Nginx).
# Tag v* implanta /home/apps/portal-prod (3103/5103) + GitHub Release.
#
# 2026-10-10: restaurado para PM2 depois de um incidente — o cutover Docker
# do dev (PR #31/#32) reescreveu o `deploy.yml` reutilizável inteiro para
# Docker/GHCR e os TRÊS callers continuaram apontando pra ele, então PROD
# (que nunca passou pelo cutover de verdade — sem inventário, sem backup,
# sem migração de dados) ficou uma tag `v*` de distância de tentar um
# `docker compose up` não preparado contra o banco de produção de verdade.
# `deploy-pm2.yml` é o `deploy.yml` de antes do cutover (script_path:
# infra/deploy/deploy.sh, mantido/atualizado desde então — ver D-24 em
# infra/deploy/deploy.sh) — a Fase E do plano ainda não chegou em PROD.
on:
  push:
    tags:
      - 'v*'

jobs:
  # Apenas calcula o nome da tag. A publicação é um job separado, depois
  # de verify + deploy + validate do reusable workflow.
  pre:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

  deploy-prod:
    needs: pre
    uses: ./.github/workflows/deploy-pm2.yml
    with:
      env_label: PROD
      environment_name: production
      app_dir: /home/apps/portal-prod
      git_mode: tag
      git_ref: ${{ needs.pre.outputs.version }}
      # A tag pode ser movida depois do evento; o gate fixa o commit original.
      verify_ref: ${{ github.sha }}
      pm_suffix: prod
      web_port: "3103"
      api_port: "5103"
      host: portal-noticias.com
      # Manter false até o certbot emitir, o nginx -t passar e o reload HTTPS
      # ser verificado. Depois, altere para true e siga o runbook de TLS.
      tls_enabled: false
      allowed_hosts_extra: ",www.portal-noticias.com"
      db_name: brd_portal_prod
      db_user: portal_prod
      strict_validate: true
      # Usuários de teste: EXPLICITAMENTE desligado, e o valor explícito é o
      # ponto. O default do `deploy-pm2.yml` já é `false` — mas o default é
      # uma propriedade do arquivo, e esta linha é uma afirmação sobre PROD.
      usuarios_teste: false
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      # Resend (P1-04): opcional. Ausente mantém DJANGO_EMAIL_BACKEND=console.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

  # A release só é criada depois que o reusable deploy terminou. Se verify,
  # SSH, migrate, PM2 ou validate falhar, este job fica skipped e nenhum
  # release/tag é publicado.
  release:
    needs: [pre, deploy-prod]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout verified tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.pre.outputs.version }}

      - name: Ensure tag still points to gated commit
        env:
          TAG_NAME: ${{ needs.pre.outputs.version }}
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          TAG_COMMIT="$(git rev-parse "$TAG_NAME^{commit}")"
          GATED_COMMIT="$(git rev-parse "$VERIFIED_SHA^{commit}")"
          if [ "$TAG_COMMIT" != "$GATED_COMMIT" ]; then
            echo "ERRO: a tag $TAG_NAME foi movida após o gate ($TAG_COMMIT != $GATED_COMMIT)"
            exit 1
          fi

      - name: Create GitHub Release after verified deploy
        run: >-
          gh release create "${{ needs.pre.outputs.version }}" --verify-tag
          --title "Release ${{ needs.pre.outputs.version }}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
