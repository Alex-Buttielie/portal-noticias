name: Deploy PROD

# Thin caller — toda a lógica vive em deploy.yml (reutilizável). Tag v*
# implanta /home/apps/portal-prod (3103/5103) + GitHub Release.
# Mesma infra do deploy antigo (backup/remote-*-20260904): PM2 + Nginx na
# VPS. Muda só o software: frontend/ + backend/ (Django real).
on:
  push:
    tags:
      - 'v*'

jobs:
  # Apenas calcula o nome da tag. A publicação é um job separado, depois
  # de verify + deploy + validate do reusable workflow.
  pre:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

  deploy-prod:
    needs: pre
    uses: ./.github/workflows/deploy.yml
    with:
      env_label: PROD
      environment_name: production
      app_dir: /home/apps/portal-prod
      git_mode: tag
      git_ref: ${{ needs.pre.outputs.version }}
      # A tag pode ser movida depois do evento; o gate fixa o commit original.
      verify_ref: ${{ github.sha }}
      pm_suffix: prod
      web_port: "3103"
      api_port: "5103"
      host: portal-noticias.com
      # Manter false até o certbot emitir, o nginx -t passar e o reload HTTPS
      # ser verificado. Depois, altere para true e siga o runbook de TLS.
      tls_enabled: false
      allowed_hosts_extra: ",www.portal-noticias.com"
      db_name: brd_portal_prod
      db_user: portal_prod
      strict_validate: true
      # Usuários de teste: EXPLICITAMENTE desligado, e o valor explícito é o
      # ponto. O default do `deploy.yml` já é `false` — mas o default é uma
      # propriedade do arquivo, e esta linha é uma afirmação sobre o PROD, que
      # não depende de ninguém abrir o reusable para ser conferida.
      # `rollback.yml` não declara o input e fica em `false` pelo mesmo motivo.
      usuarios_teste: false
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      # Autenticacao do SSH por CHAVE. Sem este secret o `deploy.yml` RECUSA o
      # run inteiro: `VPS_SSH_KEY` e `required: true` la, e nao ha fallback para a
      # senha por proposito. Passe-o aqui, nos tres chamadores, e o pipeline
      # funciona por chave.
      #
      # Medido em 2026-10-08: enquanto esta linha faltava, os quatro `Deploy DEV`
      # seguintes terminaram em 0s com "This run likely failed because of a
      # workflow file issue" — o workflow reutilizavel exige o secret e o
      # chamador nao o fornecia. Um secret obrigatorio que ninguem passa falha
      # cedo e sem mensagem util; por isso o comentario.
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

  # A release só é criada depois que o reusable deploy terminou. Se verify,
  # SSH, migrate, PM2 ou validate falhar, este job fica skipped e nenhum
  # release/tag é publicado.
  release:
    needs: [pre, deploy-prod]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout verified tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.pre.outputs.version }}

      - name: Ensure tag still points to gated commit
        env:
          TAG_NAME: ${{ needs.pre.outputs.version }}
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          TAG_COMMIT="$(git rev-parse "$TAG_NAME^{commit}")"
          GATED_COMMIT="$(git rev-parse "$VERIFIED_SHA^{commit}")"
          if [ "$TAG_COMMIT" != "$GATED_COMMIT" ]; then
            echo "ERRO: a tag $TAG_NAME foi movida após o gate ($TAG_COMMIT != $GATED_COMMIT)"
            exit 1
          fi

      - name: Create GitHub Release after verified deploy
        run: >-
          gh release create "${{ needs.pre.outputs.version }}" --verify-tag
          --title "Release ${{ needs.pre.outputs.version }}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
