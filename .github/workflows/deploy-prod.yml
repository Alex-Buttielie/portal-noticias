name: Deploy PROD
on:
  push: { tags: ["v*"] }
jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Install web
        working-directory: apps/web
        run: npm install
      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit || echo "typecheck warn"
      - name: Install api
        working-directory: apps/api
        run: pip install -r requirements.txt
      - name: Ruff
        working-directory: apps/api
        run: ruff check . || echo "ruff warn"
      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Create Release
        run: gh release create ${{ steps.version.outputs.VERSION }} --title "Release ${{ steps.version.outputs.VERSION }}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to VPS (PROD) PM2 3103/5103
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set +e
            set +e
            export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"; nvm use 20
            APP_DIR="/home/apps/portal-prod"; BRANCH="main"; VERSION="${{ steps.version.outputs.VERSION }}"
            echo "=== Deploy PROD portal-noticias $VERSION ==="
            mkdir -p /home/apps; [ -d "$APP_DIR/.git" ] || git clone -b $BRANCH https://github.com/Alex-Buttielie/portal-noticias.git "$APP_DIR"
            cd "$APP_DIR"; git fetch --all --tags; git reset --hard origin/$BRANCH; git checkout $VERSION 2>&1 | head -5
            echo "-> web build"
            cd apps/web; npm install --production 2>&1 | tail -5; npm run build 2>&1 | tail -30; cd ../..
            echo "-> api venv"
            cd apps/api; python3 -m venv .venv 2>&1 | head -3; .venv/bin/pip install --upgrade pip 2>&1 | tail -5; .venv/bin/pip install -q -r requirements.txt 2>&1 | tail -10; cd ../..
            echo "-> PM2 restart web + api gunicorn"
            pm2 delete portal-web-prod 2>/dev/null || echo "no web to delete"
            pkill -f "gunicorn.*5103" 2>/dev/null || echo "no gunicorn to kill"; sleep 1
            cd "$APP_DIR/apps/web"; PORT=3103 pm2 start node_modules/next/dist/bin/next --name portal-web-prod -- start -p 3103 2>&1 | tail -20
            cd "$APP_DIR/apps/api"; DJANGO_SETTINGS_MODULE=config.settings /home/apps/portal-prod/apps/api/.venv/bin/gunicorn config.wsgi:application --bind 0.0.0.0:5103 --workers 2 --daemon --access-logfile /tmp/gunicorn_5103_access.log --error-logfile /tmp/gunicorn_5103_error.log 2>&1; echo "gunicorn daemon:$?"
            sleep 3; ps aux | grep gunicorn | grep 5103 | grep -v grep | head -5; pm2 list 2>&1 | head -80; pm2 save 2>&1 | tail -3
            echo "=== PROD $VERSION deployed 3103(web) 5103(api) ==="; exit 0; exit 0
      - name: Validate PROD
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set +e
            set +e
            export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"; nvm use 20
            sleep 4
            echo "--- API PROD health ---"
            curl -sf http://localhost:5103/api/health/ && echo "PROD api ok" || (echo "PROD api warn"; curl -i http://localhost:5103/api/health/ 2>&1 | head -20; ps aux | grep gunicorn | grep 5103 | head -10; cat /tmp/gunicorn_5103_error.log 2>&1 | tail -40)
            echo "--- WEB PROD ---"
            curl -sf http://localhost:3103/ 2>&1 | head -c 200; echo ""; echo "WEB check done"
            pm2 status 2>&1 | head -60; ps aux | grep -E "next|gunicorn" | grep -v grep | head -20; exit 0
