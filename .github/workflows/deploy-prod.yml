name: Deploy PROD

# Mesma infra do deploy antigo (backup/remote-*-20260904): PM2 + Nginx na VPS,
# /home/apps/portal-prod, portas 3103/5103, secrets VPS_HOST/USER/PASSWORD/PORT.
# Muda só o software: frontend/ + backend/ (Django real) no lugar de apps/*.
on:
  push:
    tags:
      - 'v*'

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: pip install -r requirements.txt
        working-directory: backend
        env:
          DJANGO_DEBUG: "true"
          DJANGO_DB_ENGINE: sqlite3
          DJANGO_CACHE_BACKEND: locmem
      - run: python manage.py check
        working-directory: backend
        env:
          DJANGO_DEBUG: "true"
          DJANGO_DB_ENGINE: sqlite3
          DJANGO_CACHE_BACKEND: locmem

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        run: gh release create ${{ steps.version.outputs.VERSION }} --title "Release ${{ steps.version.outputs.VERSION }}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to VPS (PROD)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"; nvm use 20
            APP_DIR="/home/apps/portal-prod"; BRANCH="main"; VERSION="${{ steps.version.outputs.VERSION }}"
            API_PORT=5103; WEB_PORT=3103
            HOST="portal-noticias.com.br"
            echo "=== Deploy PROD portal-noticias $VERSION ==="
            mkdir -p /home/apps
            [ -d "$APP_DIR/.git" ] || git clone -b "$BRANCH" https://github.com/Alex-Buttielie/portal-noticias.git "$APP_DIR"
            cd "$APP_DIR"; git fetch --all --tags; git reset --hard "origin/$BRANCH"; git checkout "$VERSION"
            if [ ! -f backend/.env ]; then
              SECRET=$(python3 -c "import secrets;print(secrets.token_urlsafe(50))")
              printf 'DJANGO_SECRET_KEY=%s\nDJANGO_DEBUG=false\nDJANGO_ALLOWED_HOSTS=%s,www.%s,localhost,127.0.0.1\nDJANGO_DB_ENGINE=postgresql\nDJANGO_DB_NAME=brd_portal_noticias\nDJANGO_DB_USER=portal_app\nDJANGO_DB_PASSWORD=troque-aqui\nDJANGO_DB_HOST=localhost\nDJANGO_DB_PORT=5432\nFRONTEND_BASE_URL=https://%s\n' "$SECRET" "$HOST" "$HOST" "$HOST" > backend/.env
              chmod 600 backend/.env
            fi
            cd "$APP_DIR/frontend"
            npm ci
            NEXT_PUBLIC_API_BASE_URL="https://$HOST/api" NEXT_PUBLIC_SITE_URL="https://$HOST" npm run build
            cd "$APP_DIR/backend"
            python3 -m venv .venv 2>/dev/null || true
            . .venv/bin/activate
            pip install -r requirements.txt
            set -a; . ./.env; set +a
            if [ "${DJANGO_DB_PASSWORD:-troque-aqui}" = "troque-aqui" ]; then echo "ERRO: preencha DJANGO_DB_PASSWORD em $APP_DIR/backend/.env (Postgres da VPS — ver CI-CD.md)"; exit 1; fi
            python manage.py check
            python manage.py migrate
            python manage.py collectstatic --noinput
            pm2 delete portal-web-prod 2>/dev/null || true
            pm2 delete portal-api-prod 2>/dev/null || true
            cd "$APP_DIR/frontend"
            PORT=$WEB_PORT pm2 start npm --name "portal-web-prod" -- start
            cd "$APP_DIR/backend"
            PORT=$API_PORT DJANGO_SETTINGS_MODULE=config.settings pm2 start "$APP_DIR/backend/.venv/bin/gunicorn config.wsgi:application --bind 0.0.0.0:$API_PORT --workers 2" --name "portal-api-prod"
            pm2 save
            echo "=== PROD $VERSION deployed $WEB_PORT/$API_PORT ==="

      - name: Validate PROD
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            sleep 8
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5103/healthz || echo "000")
            echo "PROD api: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then echo "PROD ok"; else echo "PROD FAIL"; pm2 logs portal-api-prod --lines 30 --nostream 2>/dev/null || pm2 logs --lines 30 --nostream; exit 1; fi
            curl -sf http://localhost:3103/ && echo "PROD web ok" || { echo "PROD web FAIL"; exit 1; }
            pm2 status | grep portal || pm2 status

      - name: Notify deployment success
        run: |
          echo "Production deployment successful!"
          echo "Version: ${{ steps.version.outputs.VERSION }}"
          echo "URL: https://portal-noticias.com.br"
