name: Deploy PROD

# Thin caller — toda a lógica vive em deploy.yml (reutilizável, Docker/GHCR).
# Tag v* implanta /home/apps/portal-prod (3103/5103) + GitHub Release.
#
# 2026-10-11: repontado para Docker depois do cutover real de PROD (Fase E
# do plano) — inventário, backup manual fresco, stack Docker validado em
# paralelo nas portas de teste, migração de dados com gate de confirmação
# explícita do solicitante antes de repontar o tráfego real. Antes desta
# mudança, PROD rodava em `deploy-pm2.yml` (ver histórico abaixo) — restaurado
# em 2026-10-10 (#39) justamente porque, àquela altura, PROD não tinha passado
# pelo inventário/backup/migração que a Fase E exige; agora passou.
#
# Histórico: 2026-10-10 — `deploy-pm2.yml` (o `deploy.yml` de antes do
# cutover Docker) foi restaurado depois de um incidente evitado a tempo — o
# cutover Docker do dev (PR #31/#32) reescreveu o `deploy.yml` reutilizável
# inteiro para Docker/GHCR e os TRÊS callers continuaram apontando pra ele,
# então PROD (que ainda não tinha passado pelo inventário/backup/migração de
# dados da Fase E) ficou uma tag `v*` de distância de tentar um
# `docker compose up` não preparado contra o banco de produção de verdade.
# `infra/deploy/deploy.sh`/`deploy-pm2.yml` seguiram recebendo fixes nesse
# meio tempo (D-24 em diante) — histórico, não mais o caminho ativo.
on:
  push:
    tags:
      - 'v*'

jobs:
  # Apenas calcula o nome da tag. A publicação é um job separado, depois
  # de verify + deploy + validate do reusable workflow.
  pre:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

  deploy-prod:
    needs: pre
    uses: ./.github/workflows/deploy.yml
    with:
      env_label: PROD
      environment_name: production
      app_dir: /home/apps/portal-prod
      git_mode: tag
      git_ref: ${{ needs.pre.outputs.version }}
      # A tag pode ser movida depois do evento; o gate fixa o commit original.
      verify_ref: ${{ github.sha }}
      web_port: "3103"
      api_port: "5103"
      host: portal-noticias.com
      # TLS automático (Caddy compartilhado, infra/docker-edge/) — sem o
      # antigo flag `tls_enabled` da topologia PM2/Nginx+Certbot.
      allowed_hosts_extra: ",www.portal-noticias.com"
      db_name: brd_portal_prod
      db_user: portal_prod
      strict_validate: true
      # D1: só PROD exige credencial do Sentry no verify (fail-closed).
      sentry_exigido: true
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
      # GHCR (cutover Docker): token de PULL para a VPS, escopo read:packages
      # — distinto do GITHUB_TOKEN automático que o build-and-push usa pra
      # PUSH. Obrigatório (sem ele a VPS não faz `docker compose pull`).
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
      # Resend (P1-04): opcional. Ausente mantém DJANGO_EMAIL_BACKEND=console.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # Sentry (C2.4): credencial exigida pelo verify porque sentry_exigido
      # é true acima — sem estes secrets configurados, o deploy de PROD
      # reprova no gate em vez de publicar sem source map.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_URL: ${{ secrets.SENTRY_URL }}
      # AdSense (P1-09 + PROD_DECISOES.md item 3): CLIENT_ID é secret de
      # REPOSITÓRIO (não de Environment) — ver deploy-dev.yml/deploy-homolog.yml
      # para o porquê (job com `uses:` não pode ter `environment:`, logo nunca
      # enxerga secret de Environment). Slots opcionais; vazios mantém
      # AdsScript/AdsSlot inertes.
      NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
      NEXT_PUBLIC_ADSENSE_SLOT_HORIZONTAL: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_HORIZONTAL }}
      NEXT_PUBLIC_ADSENSE_SLOT_RETANGULO: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_RETANGULO }}
      NEXT_PUBLIC_ADSENSE_SLOT_VERTICAL: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_VERTICAL }}
      NEXT_PUBLIC_ADSENSE_SLOT_INFEED: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_INFEED }}

  # A release só é criada depois que o reusable deploy terminou. Se verify,
  # SSH, migrate, Docker ou validate falhar, este job fica skipped e nenhum
  # release/tag é publicado.
  release:
    needs: [pre, deploy-prod]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout verified tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.pre.outputs.version }}

      - name: Ensure tag still points to gated commit
        env:
          TAG_NAME: ${{ needs.pre.outputs.version }}
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          TAG_COMMIT="$(git rev-parse "$TAG_NAME^{commit}")"
          GATED_COMMIT="$(git rev-parse "$VERIFIED_SHA^{commit}")"
          if [ "$TAG_COMMIT" != "$GATED_COMMIT" ]; then
            echo "ERRO: a tag $TAG_NAME foi movida após o gate ($TAG_COMMIT != $GATED_COMMIT)"
            exit 1
          fi

      - name: Create GitHub Release after verified deploy
        run: >-
          gh release create "${{ needs.pre.outputs.version }}" --verify-tag
          --title "Release ${{ needs.pre.outputs.version }}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
