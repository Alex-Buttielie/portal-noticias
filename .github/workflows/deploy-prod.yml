name: Deploy PROD
on: { push: { tags: ["v*"] } }
jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        working-directory: apps/web
      - run: npx tsc --noEmit
        working-directory: apps/web
      - id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - run: gh release create ${{ steps.version.outputs.VERSION }} --title "Release ${{ steps.version.outputs.VERSION }}" --generate-notes
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/apps/portal-noticias-prod || git clone -b main https://github.com/Alex-Buttielie/portal-noticias.git /home/apps/portal-noticias-prod; cd /home/apps/portal-noticias-prod
            git fetch --all --tags; git reset --hard origin/main; git checkout ${{ steps.version.outputs.VERSION }}
            docker compose up -d --build
            sleep 10; curl -sf http://localhost:5002/api/health/ && echo "PROD ok" || (docker logs portal-noticias-prod-backend-1 --tail 80; exit 1)
