name: Deploy PROD

# Thin caller — toda a lógica vive em deploy.yml (reutilizável). Tag v*
# implanta /home/apps/portal-prod (3103/5103) + GitHub Release.
# Mesma infra do deploy antigo (backup/remote-*-20260904): PM2 + Nginx na
# VPS. Muda só o software: frontend/ + backend/ (Django real).
on:
  push:
    tags:
      - 'v*'

jobs:
  pre:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        run: gh release create ${{ steps.version.outputs.VERSION }} --title "Release ${{ steps.version.outputs.VERSION }}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-prod:
    needs: pre
    uses: ./.github/workflows/deploy.yml
    with:
      env_label: PROD
      environment_name: production
      app_dir: /home/apps/portal-prod
      git_mode: tag
      git_ref: ${{ needs.pre.outputs.version }}
      guard_ref: main
      pm_suffix: prod
      web_port: "3103"
      api_port: "5103"
      host: portal-noticias.com.br
      allowed_hosts_extra: ",www.portal-noticias.com.br"
      db_name: brd_portal_prod
      db_user: portal_prod
      strict_validate: true
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
