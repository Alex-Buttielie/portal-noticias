name: Deploy HOMOLOG

# Thin caller — toda a lógica vive em deploy.yml (reutilizável). PR para
# main implanta o código do PR em /home/apps/portal-homolog (3102/5102).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  deploy-homolog:
    uses: ./.github/workflows/deploy.yml
    with:
      env_label: HOMOLOG
      environment_name: homolog
      app_dir: /home/apps/portal-homolog
      git_mode: pr
      pr_number: ${{ github.event.pull_request.number }}
      # O deploy busca o head do PR; o mesmo SHA é passado ao CI.
      verify_ref: ${{ github.event.pull_request.head.sha }}
      pm_suffix: homolog
      web_port: "3102"
      api_port: "5102"
      host: homolog.portal-noticias.com
      # TLS só é ativado depois da emissão do certificado neste ambiente.
      tls_enabled: false
      db_name: brd_portal_homolog
      db_user: portal_homolog
      strict_validate: true
      # Gate de usuários de teste — idêntico ao de DEV, pelo mesmo motivo: em
      # homologação a conta precisa existir para o teste do PR, e não pode
      # nascer com senha conhecida (esta, ao contrário do localhost, não é
      # ambiente de uma pessoa só).
      usuarios_teste: true
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      # Autenticacao do SSH por CHAVE. Sem este secret o `deploy.yml` RECUSA o
      # run inteiro: `VPS_SSH_KEY` e `required: true` la, e nao ha fallback para a
      # senha por proposito. Passe-o aqui, nos tres chamadores, e o pipeline
      # funciona por chave.
      #
      # Medido em 2026-10-08: enquanto esta linha faltava, os quatro `Deploy DEV`
      # seguintes terminaram em 0s com "This run likely failed because of a
      # workflow file issue" — o workflow reutilizavel exige o secret e o
      # chamador nao o fornecia. Um secret obrigatorio que ninguem passa falha
      # cedo e sem mensagem util; por isso o comentario.
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
