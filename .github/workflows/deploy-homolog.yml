name: Deploy HOMOLOG

# Thin caller — toda a lógica vive em deploy.yml (reutilizável). PR para
# main implanta o código do PR em /home/apps/portal-homolog (3102/5102).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  deploy-homolog:
    uses: ./.github/workflows/deploy.yml
    with:
      env_label: HOMOLOG
      environment_name: homolog
      app_dir: /home/apps/portal-homolog
      git_mode: pr
      pr_number: ${{ github.event.pull_request.number }}
      # O deploy busca o head do PR; o mesmo SHA é passado ao CI.
      verify_ref: ${{ github.event.pull_request.head.sha }}
      pm_suffix: homolog
      web_port: "3102"
      api_port: "5102"
      host: homolog.portal-noticias.com.br
      # TLS só é ativado depois da emissão do certificado neste ambiente.
      tls_enabled: false
      db_name: brd_portal_homolog
      db_user: portal_homolog
      strict_validate: false
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      # Autenticação por chave dedicada e impressão digital do host (C2.6).
      # Ambos OPCIONAIS: sem eles, o caminho por senha é idêntico ao anterior.
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
      # Sentry (C2.4): opcionais, usados só para o upload de source map do
      # `verify`. Sem eles, o passo é pulado (fail-open) e o CI segue verde —
      # comportamento CORRETO em homolog (D1: só PROD exige credencial).
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_URL: ${{ secrets.SENTRY_URL }}
