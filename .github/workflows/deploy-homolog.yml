name: Deploy HOMOLOG

# Thin caller — toda a lógica vive em deploy.yml (reutilizável). PR para
# main implanta o código do PR em /home/apps/portal-homolog (3102/5102).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  deploy-homolog:
    uses: ./.github/workflows/deploy.yml
    with:
      env_label: HOMOLOG
      environment_name: homolog
      app_dir: /home/apps/portal-homolog
      git_mode: pr
      pr_number: ${{ github.event.pull_request.number }}
      # O deploy busca o head do PR; o mesmo SHA é passado ao CI.
      verify_ref: ${{ github.event.pull_request.head.sha }}
      web_port: "3102"
      api_port: "5102"
      host: homolog.portal-noticias.com
      db_name: brd_portal_homolog
      db_user: portal_homolog
      strict_validate: true
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      # Autenticacao do SSH por CHAVE. Sem este secret o `deploy.yml` RECUSA o
      # run inteiro: `VPS_SSH_KEY` e `required: true` la, e nao ha fallback para a
      # senha por proposito. Passe-o aqui, nos tres chamadores, e o pipeline
      # funciona por chave.
      #
      # Medido em 2026-10-08: enquanto esta linha faltava, os quatro `Deploy DEV`
      # seguintes terminaram em 0s com "This run likely failed because of a
      # workflow file issue" — o workflow reutilizavel exige o secret e o
      # chamador nao o fornecia. Um secret obrigatorio que ninguem passa falha
      # cedo e sem mensagem util; por isso o comentario.
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
      # Resend (P1-04): opcional. Ausente mantém DJANGO_EMAIL_BACKEND=console.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # Sentry (C2.4): opcionais, usados só para o upload de source map do
      # `verify`. Sem eles, o passo é pulado (fail-open) e o CI segue verde —
      # comportamento CORRETO em homolog (D1: só PROD exige credencial).
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_URL: ${{ secrets.SENTRY_URL }}
      NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
      NEXT_PUBLIC_ADSENSE_SLOT_HORIZONTAL: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_HORIZONTAL }}
      NEXT_PUBLIC_ADSENSE_SLOT_RETANGULO: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_RETANGULO }}
      NEXT_PUBLIC_ADSENSE_SLOT_VERTICAL: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_VERTICAL }}
      NEXT_PUBLIC_ADSENSE_SLOT_INFEED: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_INFEED }}
