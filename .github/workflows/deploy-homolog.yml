name: Deploy HOMOLOG

# Thin caller — toda a lógica vive em deploy.yml (reutilizável, Docker/GHCR).
# Push em develop implanta /home/apps/portal-homolog (3102/5102) — fluxo
# acordado 2026-10-12: branch de implementação -> dev; develop -> homolog;
# main+tag -> prod. Homolog deixou de ser "preview do PR contra main" e
# passou a ser staging contínuo de `develop`: na prática o HEAD de develop e
# o HEAD do PR develop->main coincidem na maior parte do tempo (o fluxo deste
# repo não empurra commit direto na branch do PR, só em develop), então o
# que já era visto em homolog antes de abrir o PR continua sendo visto, só
# que um push mais cedo.
#
# [HISTÓRICO] até 2026-10-12 este caller disparava em `pull_request` contra
# `main` (`git_mode: pr`, deploy do HEAD do PR) — ver blame para o motivo
# original (cutover Docker de 2026-10-11) e CI-CD.md para o fluxo documentado
# antes da troca.
#
# Nota de paridade conhecida: `deploy.yml` não tem equivalente ao gate
# `usuarios_teste` do antigo `deploy-pm2.yml`/`infra/deploy/deploy.sh`
# (provisionava uma conta de teste a cada deploy para revisão manual em
# HOMOLOG). Quem for revisar em homolog precisa criar a conta de teste
# manualmente até que isso, se necessário, seja portado para o caminho Docker.
on:
  push:
    branches: [develop]

jobs:
  deploy-homolog:
    uses: ./.github/workflows/deploy.yml
    with:
      env_label: HOMOLOG
      environment_name: homolog
      app_dir: /home/apps/portal-homolog
      git_mode: branch
      git_ref: develop
      # SHA do push: o gate e o checkout da VPS não podem testar/implantar
      # commits diferentes se outro push entrar enquanto o run está na fila.
      verify_ref: ${{ github.sha }}
      web_port: "3102"
      api_port: "5102"
      host: homolog.portal-noticias.com
      # `tls_enabled` não existe em deploy.yml: TLS é sempre automático no
      # caminho Docker (Caddy/Nginx compartilhado), sem esse input — o
      # certificado Let's Encrypt emitido em 2026-10-11 (infra/DEPLOY.md
      # §3A) continua servindo o domínio, só não é mais um flag do workflow.
      db_name: brd_portal_homolog
      db_user: portal_homolog
      strict_validate: true
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
      # GHCR (cutover Docker): token de PULL para a VPS, escopo read:packages
      # — distinto do GITHUB_TOKEN automático que o build-and-push usa pra
      # PUSH. Obrigatório (sem ele a VPS não faz `docker compose pull`).
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
      # Resend (P1-04): opcional. Ausente mantém DJANGO_EMAIL_BACKEND=console.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BRAPI_API_KEY: ${{ secrets.BRAPI_API_KEY }}
      # AdSense (PROD_DECISOES.md item 3): CLIENT_ID é secret de
      # REPOSITÓRIO (não de Environment) de propósito — um job que chama
      # workflow reutilizável via `uses:` não pode ter `environment:` nele
      # mesmo (GitHub Actions recusa com "workflow file issue"), e sem
      # `environment:` o job nunca enxerga secret de Environment. Slots
      # vazios até a Fase 2; vazio é seguro (frontend/Dockerfile).
      NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
      NEXT_PUBLIC_ADSENSE_SLOT_HORIZONTAL: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_HORIZONTAL }}
      NEXT_PUBLIC_ADSENSE_SLOT_RETANGULO: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_RETANGULO }}
      NEXT_PUBLIC_ADSENSE_SLOT_VERTICAL: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_VERTICAL }}
      NEXT_PUBLIC_ADSENSE_SLOT_INFEED: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_INFEED }}
