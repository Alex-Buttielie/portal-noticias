name: Deploy HOMOLOG

# Thin caller — toda a lógica vive em deploy-pm2.yml (reutilizável, PM2+Nginx).
# PR para main implanta o código do PR em /home/apps/portal-homolog (3102/5102).
#
# 2026-10-10: restaurado para PM2 depois de um incidente — o cutover Docker
# do dev (PR #31/#32) reescreveu o `deploy.yml` reutilizável inteiro para
# Docker/GHCR e os TRÊS callers continuaram apontando pra ele, então HOMOLOG
# (que nunca passou pelo cutover de verdade — sem inventário, sem backup,
# sem migração de dados) ficou um `pull_request` de distância de tentar um
# `docker compose up` não preparado. `deploy-pm2.yml` é o `deploy.yml` de
# antes do cutover (script_path: infra/deploy/deploy.sh, inalterado desde
# então) — a Fase E do plano ainda não chegou em HOMOLOG.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  deploy-homolog:
    uses: ./.github/workflows/deploy-pm2.yml
    with:
      env_label: HOMOLOG
      environment_name: homolog
      app_dir: /home/apps/portal-homolog
      git_mode: pr
      pr_number: ${{ github.event.pull_request.number }}
      # O deploy busca o head do PR; o mesmo SHA é passado ao CI.
      verify_ref: ${{ github.event.pull_request.head.sha }}
      pm_suffix: homolog
      web_port: "3102"
      api_port: "5102"
      host: homolog.portal-noticias.com
      # TLS só é ativado depois da emissão do certificado neste ambiente.
      tls_enabled: false
      db_name: brd_portal_homolog
      db_user: portal_homolog
      strict_validate: true
      # Gate de usuários de teste — idêntico ao de DEV, pelo mesmo motivo: em
      # homologação a conta precisa existir para o teste do PR, e não pode
      # nascer com senha conhecida (esta, ao contrário do localhost, não é
      # ambiente de uma pessoa só).
      usuarios_teste: true
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      # Resend (P1-04): opcional. Ausente mantém DJANGO_EMAIL_BACKEND=console.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
