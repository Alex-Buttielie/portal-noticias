name: Deploy portal (reutilizável)

# Workflow ÚNICO que implanta UM ambiente (DEV/HOMOLOG/PROD) na VPS via
# PM2 + Nginx. Os callers (deploy-dev/homolog/prod.yml) só definem trigger +
# parâmetros; o caller manual de rollback reutiliza este mesmo caminho — qualquer
# correção aqui vale para os ambientes de uma vez (anti-drift por construção;
# ver PROD_DECISOES.md "homogeneidade").
#
# Invariantes preservadas dos workflows antigos (não mudar sem motivo):
# - o job verify chama o MESMO ci.yml usado no push/PR; deploy só começa
#   depois que backend-tests e frontend-build terminam com sucesso;
# - o runner de CI é o gate; o build de produção continua na VPS, sem
#   repetir npm/pip/check sem cache;
# - .env criado UMA vez (nunca sobrescrito) com SECRET aleatória;
# - migrate + collectstatic a cada deploy; PM2 restart/start + save (sem
#   janela explícita de delete);
# - cada restart tem 3 tentativas e confirma `online` no PM2 antes de seguir;
# - o SHA anterior fica em `.deployed-sha` até o smoke pós-restart promover
#   o novo SHA; um workflow manual reutiliza este mesmo caminho para rollback;
# - frontend rebuild com NEXT_PUBLIC_* do ambiente, cache npm persistente
#   no home da VPS e heap Node limitado (decisão conservadora P1-5);
# - validate: DEV/HOMOLOG avisam (warn), PROD falha (exit 1).
#
# O SHELL NÃO ESTÁ MAIS AQUI (2026-10-08)
# Os dois `script:` (450 + 112 linhas de shell) foram para
# `infra/deploy/deploy.sh` e `infra/deploy/validate.sh`, referenciados por
# `script_path`. Motivo: com o shell inline este arquivo chegou a 762 linhas /
# 40.966 bytes e o GitHub passou a RECUSÁ-lo antes de qualquer job ("Deploy DEV"
# com 0 jobs, `conclusion=failure`, 0 s — falha de validação do workflow). As
# sondas não acharam o limite exato (cortar 16 linhas resolvia, cortar 8 não, e
# as duas metades de um bloco falhavam isoladas), e a solução escolhida não
# depende do número. O ganho maior que o tamanho: cada input agora chega ao
# script por VARIÁVEL DE AMBIENTE (blocos `env:` + lista `envs:` dos jobs
# abaixo, mapa input->variável no cabeçalho de cada `.sh`), então o mesmo shell
# roda e é testado fora do GitHub — o que `${{ inputs.* }}` impedia.
# Consequência operacional: os jobs passaram a precisar de `actions/checkout`
# (é de onde a action lê o script) — ver o comentário do step.

on:
  workflow_call:
    inputs:
      env_label:
        description: "Rótulo curto para logs (DEV, HOMOLOG ou PROD)"
        required: true
        type: string
      environment_name:
        description: "Environment do GitHub (development, homolog, production)"
        required: true
        type: string
      app_dir:
        description: "Diretório na VPS, ex.: /home/apps/portal-dev"
        required: true
        type: string
      git_mode:
        description: "branch | pr | tag | rollback (rollback exige SHA verificado)"
        required: true
        type: string
      git_ref:
        description: "Branch/tag ou SHA alvo no modo rollback; ignorado no modo pr"
        required: false
        type: string
        default: ""
      verify_ref:
        description: "Ref/commit exato enviado ao CI reutilizável (SHA do evento ou alvo do rollback)"
        required: true
        type: string
      pr_number:
        description: "Número do PR (só modo pr)"
        required: false
        type: string
        default: ""
      pm_suffix:
        description: "Sufixo dos processos pm2 (dev, homolog, prod)"
        required: true
        type: string
      web_port:
        required: true
        type: string
      api_port:
        required: true
        type: string
      host:
        description: "Domínio canônico do ambiente"
        required: true
        type: string
      tls_enabled:
        description: "true somente depois de certbot, nginx -t e reload bem-sucedidos"
        required: false
        type: boolean
        default: false
        # Com true, o .env novo recebe:
        # DJANGO_SECURE_SSL_REDIRECT=true, DJANGO_SESSION_COOKIE_SECURE=true
        # e DJANGO_CSRF_COOKIE_SECURE=true.
      allowed_hosts_extra:
        description: "Sufixo extra de hosts, ex.: ',www.portal-noticias.com.br' (só PROD)"
        required: false
        type: string
        default: ""
      db_name:
        required: true
        type: string
      db_user:
        required: true
        type: string
      strict_validate:
        description: "true = falha se API/web não responderem (PROD); false = só avisa"
        required: false
        type: boolean
        default: false
      usuarios_teste:
        description: "true = cria uma conta de teste por perfil, sem senha utilizavel"
        required: false
        type: boolean
        default: false
    secrets:
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_PORT:
        required: true
      # Chave privada de deploy (formato PEM, tipo OpenSSH). O par publico
      # correspondente tem de estar em /root/.ssh/authorized_keys da VPS
      # ANTES de este secret existir, ou o deploy falha na conexao.
      #
      # OBRIGATORIA e SEM fallback para a senha: se faltar, o deploy QUEBRA.
      # E de proposito. Um fallback silencioso seria a porta que estamos
      # fechando voltando sem ninguem perceber — e o ataque de forca bruta
      # contra o root esta acontecendo hoje (47 tentativas em 24 h de um
      # unico IP, 1813 falhas acumuladas).
      #
      VPS_SSH_KEY:
        required: true
      # Chave da API do Resend (https://resend.com/api-keys), usada para
      # gravar RESEND_API_KEY no backend/.env do PRIMEIRO deploy e habilitar
      # o canal de e-mail real (P1-04). NÃO é required de propósito: os
      # callers hoje não mapeiam este secret, e exigir aqui reprovaria 100%
      # dos deploys. Ausente/vazia mantém DJANGO_EMAIL_BACKEND=console, que é
      # exatamente o comportamento de antes desta mudança — só o envio real
      # continua recusado pelo gate, sem novo erro. Nunca comitar o valor:
      # vem de secret, entra no .env da VPS e não volta para o repositório.
      RESEND_API_KEY:
        required: false

# Impede que dois deploys do mesmo ambiente alterem o PM2 ao mesmo tempo. Um
# run já em andamento nunca é cancelado; uma atualização mais nova espera sua
# vez.
concurrency:
  group: portal-deploy-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  # Reutiliza a definição única de CI. Se qualquer um dos jobs internos
  # (pytest/check ou tsc/build) falhar, este called workflow não fica verde
  # e o job de provisionamento abaixo fica skipped automaticamente.
  verify:
    name: Verify ${{ inputs.env_label }} (${{ inputs.git_mode }})
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ inputs.verify_ref }}
    permissions:
      contents: read

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    # Minimo do `actions/checkout`, que o step de SSH exige para ler o script do
    # disco (ver o comentario do proprio step).
    permissions:
      contents: read
    steps:
      # POR QUE ESTE CHECKOUT EXISTE (e nao existia antes)
      # `script_path` faz a action ler o arquivo no FILESYSTEM do runner: o
      # drone-ssh faz `os.Stat` e `os.ReadFile` nele e aborta se o caminho nao
      # existir. Este job nao tinha checkout nenhum (a logica vivia inteira no
      # `script:` inline), entao sem este passo o deploy nem chega na VPS.
      #
      # `github.sha`, e nao `inputs.verify_ref`: o script e INFRA deste run, e
      # o codigo que sera implantado e buscado pela propria action na VPS
      # (`git clone` / `git reset --hard "$VERIFY_REF"`). O tem de ser o ref que
      # DEFINIU o workflow — assim um rollback para um SHA anterior a esta
      # mudanca continua achando o script, porque o `deploy.yml` do rollback vem
      # do ref do workflow e nao do SHA alvo.
      - name: Checkout do script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Deploy to VPS (${{ inputs.env_label }})
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Secret ausente resolve para string vazia (nunca $null/erro) e o
          # passo decide o backend no script remoto — ver o fallback no
          # bloco do printf de backend/.env.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # ---- inputs do workflow virados em variavel de ambiente ----
          # `${{ inputs.* }}` e resolvido pelo GitHub e nao existe fora dele;
          # dentro de um arquivo em disco o script so pode ler o valor de uma
          # variavel. Cada input abaixo tem um par nome proprio, e a action so
          # repassa para a VPS os nomes que estiverem em `envs:` abaixo (e o
          # `env:` e o que da o valor). O mapa completo input->variavel esta
          # no cabecalho de infra/deploy/deploy.sh.
          APP_DIR: ${{ inputs.app_dir }}
          WEB_PORT: ${{ inputs.web_port }}
          API_PORT: ${{ inputs.api_port }}
          HOST: ${{ inputs.host }}
          DB_NAME: ${{ inputs.db_name }}
          DB_USER: ${{ inputs.db_user }}
          ENV_LABEL: ${{ inputs.env_label }}
          GIT_MODE: ${{ inputs.git_mode }}
          GIT_REF: ${{ inputs.git_ref }}
          VERIFY_REF: ${{ inputs.verify_ref }}
          TLS_ENABLED: ${{ inputs.tls_enabled }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ALLOWED_HOSTS_EXTRA: ${{ inputs.allowed_hosts_extra }}
          # `GATE_` nos dois que o script RELE depois do `set -a; . ./.env`:
          # com um nome comum, uma chave `USUARIOS_TESTE=true` ou `SUF=prod`
          # deixada no `.env` da VPS os sobrescreveria (Finding 1 / Finding R3).
          GATE_PM_SUFFIX: ${{ inputs.pm_suffix }}
          GATE_USUARIOS_TESTE: ${{ inputs.usuarios_teste }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          # Autenticacao por CHAVE. A senha nao e usada no SSH: e o que
          # permite desligar `passwordauthentication` sem quebrar o pipeline.
          # Sem fallback — ver o comentario de VPS_SSH_KEY acima.
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          # Exporta a variável no shell da VPS em vez de interpolar o valor
          # no texto do script: a chave não aparece no comando enviado por
          # SSH nem em log. Se a action não exportar (ou vier vazia), o
          # script cai no fallback "console" — degrada para o comportamento
          # anterior, não quebra o deploy.
          #
          # A lista acima precisa ter um nome para cada variavel do `env:`:
          # sem nome aqui, a variável morre no processo da action e o script
          # nao a ve.
          envs: RESEND_API_KEY,APP_DIR,WEB_PORT,API_PORT,HOST,DB_NAME,DB_USER,ENV_LABEL,GIT_MODE,GIT_REF,VERIFY_REF,TLS_ENABLED,PR_NUMBER,ALLOWED_HOSTS_EXTRA,GATE_PM_SUFFIX,GATE_USUARIOS_TESTE
          # O shell em si mora em infra/deploy/deploy.sh. Ver o cabecalho do
          # arquivo: alem de tirar 450 linhas de dentro do YAML, e o que
          # permite rodar e testar este script FORA do GitHub.
          script_path: infra/deploy/deploy.sh

  # Mesmo quando o deploy falha depois de um restart, o probe é executado para
  # deixar o estado da API/web explícito no run. `always` também cobre o caso
  # de verify/interrupção; em DEV/HOMOLOG o aviso é não bloqueante.
  validate:
    needs: [verify, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    # Mesmo minimo do job `deploy`: o `validate` tambem le o script do disco.
    permissions:
      contents: read
    steps:
      # Mesma razao do checkout do job `deploy`, e o mesmo `github.sha`: o
      # arquivo do probe vem do ref que definiu o workflow.
      - name: Checkout do script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate ${{ inputs.env_label }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Mapa input->variavel no cabecalho de infra/deploy/validate.sh.
          ENV_LABEL: ${{ inputs.env_label }}
          APP_DIR: ${{ inputs.app_dir }}
          WEB_PORT: ${{ inputs.web_port }}
          API_PORT: ${{ inputs.api_port }}
          HOST: ${{ inputs.host }}
          STRICT_VALIDATE: ${{ inputs.strict_validate }}
          TLS_ENABLED: ${{ inputs.tls_enabled }}
          VERIFY_REF: ${{ inputs.verify_ref }}
          PM_SUFFIX: ${{ inputs.pm_suffix }}
          # Unico valor do arquivo que nao vem de `inputs.*`: o resultado do
          # job `deploy` entra pelo mesmo caminho dos outros, nunca como
          # `${{ }}` dentro do shell.
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          # Autenticacao por CHAVE. A senha nao e usada no SSH: e o que
          # permite desligar `passwordauthentication` sem quebrar o pipeline.
          # Sem fallback — ver o comentario de VPS_SSH_KEY acima.
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: ENV_LABEL,APP_DIR,WEB_PORT,API_PORT,HOST,STRICT_VALIDATE,TLS_ENABLED,VERIFY_REF,PM_SUFFIX,DEPLOY_RESULT
          script_path: infra/deploy/validate.sh
