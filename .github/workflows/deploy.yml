name: Deploy portal (reutilizável)

# Workflow ÚNICO que implanta UM ambiente (DEV/HOMOLOG/PROD) na VPS via
# PM2 + Nginx. Os callers (deploy-dev/homolog/prod.yml) só definem trigger +
# parâmetros; o caller manual de rollback reutiliza este mesmo caminho — qualquer
# correção aqui vale para os ambientes de uma vez (anti-drift por construção;
# ver PROD_DECISOES.md "homogeneidade").
#
# Invariantes preservadas dos workflows antigos (não mudar sem motivo):
# - o job verify chama o MESMO ci.yml usado no push/PR; deploy só começa
#   depois que backend-tests, frontend-build e infra-validate terminam com
#   sucesso;
# - o runner de CI é o gate; o build de produção continua na VPS, sem
#   repetir npm/pip/check sem cache;
# - .env criado UMA vez (nunca sobrescrito) com SECRET aleatória;
# - migrate + collectstatic a cada deploy; PM2 restart/start + save (sem
#   janela explícita de delete);
# - cada restart tem 3 tentativas e confirma `online` no PM2 antes de seguir;
# - o SHA anterior fica em `.deployed-sha` até o smoke pós-restart promover
#   o novo SHA; um workflow manual reutiliza este mesmo caminho para rollback;
# - frontend rebuild com NEXT_PUBLIC_* do ambiente, cache npm persistente
#   no home da VPS e heap Node limitado (decisão conservadora P1-5);
# - validate: DEV/HOMOLOG avisam (warn), PROD falha (exit 1);
# - `git_mode: rollback` continua sendo o caminho de recuperação, com o mesmo
#   verify e o mesmo script (rollback.yml) — não existe um segundo script de
#   provisionamento.
#
# C2 (run 20260925-1020-observabilidade) — o que mudou e por quê:
# - RELEASE ATÔMICA DO TIER WEB: cada deploy copia a árvore standalone para
#   `frontend/releases/<id>/`, faz smoke NELA, e só então alterna o symlink
#   `releases/current` e reinicia o PM2. A release anterior é preservada em
#   `releases/previous` e é o alvo do retorno automático quando o PM2 não
#   sobe. O backend NÃO mudou de estratégia: continua `git reset --hard` +
#   migrate in-place, com `.deployed-sha` como fronteira de recuperação. A
#   release é do runtime web porque é o único artefato que pode ser promovido
#   e revertido sem tocar em migration.
# - `web_runtime` é o caminho de escape: `standalone` (padrão) ou `npm`
#   (o `npm start` anterior, mantido intacto). O caminho novo não substitui o
#   antigo sem ter sido validado num deploy real; o operador pode voltar ao
#   antigo com um dispatch, sem editar código.
# - Units systemd do Celery são instaladas e ativadas por ambiente (`%i`), sem
#   tocar em nenhum processo que o PM2 já gerencia. Falha de Celery NUNCA
#   derruba o deploy: o portal está no ar, e o `/health-detail` reporta.
# - SSH: chave dedicada e impressão digital do host são aceitas
#   (`VPS_SSH_KEY`/`VPS_HOST_FINGERPRINT`, ambas opcionais). Vazio = caminho
#   por senha, idêntico ao de antes. A SENHA NÃO FOI REMOVIDA: a troca é
#   operacional e depende de acesso real à VPS.

on:
  workflow_call:
    inputs:
      env_label:
        description: "Rótulo curto para logs (DEV, HOMOLOG ou PROD)"
        required: true
        type: string
      environment_name:
        description: "Environment do GitHub (development, homolog, production)"
        required: true
        type: string
      app_dir:
        description: "Diretório na VPS, ex.: /home/apps/portal-dev"
        required: true
        type: string
      git_mode:
        description: "branch | pr | tag | rollback (rollback exige SHA verificado)"
        required: true
        type: string
      git_ref:
        description: "Branch/tag ou SHA alvo no modo rollback; ignorado no modo pr"
        required: false
        type: string
        default: ""
      verify_ref:
        description: "Ref/commit exato enviado ao CI reutilizável (SHA do evento ou alvo do rollback)"
        required: true
        type: string
      pr_number:
        description: "Número do PR (só modo pr)"
        required: false
        type: string
        default: ""
      pm_suffix:
        description: "Sufixo dos processos pm2 (dev, homolog, prod)"
        required: true
        type: string
      web_port:
        required: true
        type: string
      api_port:
        required: true
        type: string
      host:
        description: "Domínio canônico do ambiente"
        required: true
        type: string
      tls_enabled:
        description: "true somente depois de certbot, nginx -t e reload bem-sucedidos"
        required: false
        type: boolean
        default: false
        # Com true, o .env novo recebe:
        # DJANGO_SECURE_SSL_REDIRECT=true, DJANGO_SESSION_COOKIE_SECURE=true
        # e DJANGO_CSRF_COOKIE_SECURE=true.
      allowed_hosts_extra:
        description: "Sufixo extra de hosts, ex.: ',www.portal-noticias.com.br' (só PROD)"
        required: false
        type: string
        default: ""
      db_name:
        required: true
        type: string
      db_user:
        required: true
        type: string
      strict_validate:
        description: "true = falha se API/web não responderem (PROD); false = só avisa"
        required: false
        type: boolean
        default: false
      web_runtime:
        description: "standalone = runtime Next standalone com release atômica (padrão); npm = npm start, o caminho anterior, como escape"
        required: false
        type: string
        default: standalone
      celery_systemd:
        description: "true = instala/ativa as units do Celery do ambiente (padrão); false = não toca em systemd"
        required: false
        type: boolean
        default: true
      # D1: repassado ao `ci.yml` no job `verify`. `true` = o build de
      # VERIFICAÇÃO deste ambiente reprova quando a credencial do Sentry (ou os
      # `.map`) faltam. Só PROD liga: em dev/homolog o fail-open continua
      # correto, porque lá o build vem de push de branch e o projeto pode ainda
      # não ter conta configurada.
      sentry_exigido:
        description: "true = o verify reprova sem credencial do Sentry (só PROD); false = fail-open"
        required: false
        type: boolean
        default: false
    secrets:
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_PASSWORD:
        required: true
      VPS_PORT:
        required: true
      # C2.6 — chave dedicada e `known_hosts` pinado. AMBAS OPCIONAIS de
      # propósito: vazio = o caminho por senha, exatamente como antes. A chave
      # é o CONTEÚDO PEM da chave privada de um par de chaves criado só para a
      # esteira (`ssh-keygen -t ed25519 -N '' -C actions-deploy`), instalado no
      # `authorized_keys` do usuário da VPS. A impressão digital é a do
      # host key ED25519 no formato `SHA256:...` que o `ssh-keygen -lf` imprime;
      # quando ela não bate, a conexão FALHA (fail-closed) em vez de aceitar
      # qualquer host. Enquanto `VPS_PASSWORD` existir, as duas credenciais são
      # enviadas e qualquer uma das duas autentica — a ordem é do cliente SSH
      # da action (senha primeiro), não uma decisão deste workflow. A senha só
      # é removida depois de um deploy validado com a chave (ver CI-CD.md).
      VPS_SSH_KEY:
        required: false
      VPS_HOST_FINGERPRINT:
        required: false
      # Sentry (C2.4): repassados ao `verify` para o upload de source map da
      # release EXATA que vai ser implantada. PROD sai de uma tag, que não
      # dispara o CI por `push` — sem isto o mapa da release de produção nunca
      # seria enviado. Todos opcionais; o upload é fail-open.
      SENTRY_AUTH_TOKEN:
        required: false
      SENTRY_ORG:
        required: false
      SENTRY_PROJECT:
        required: false
      SENTRY_URL:
        required: false

# Impede que dois deploys do mesmo ambiente alterem o PM2 ao mesmo tempo. Um
# run já em andamento nunca é cancelado; uma atualização mais nova espera sua
# vez.
concurrency:
  group: portal-deploy-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  # Reutiliza a definição única de CI. Se qualquer um dos jobs internos
  # (pytest/check ou tsc/build) falhar, este called workflow não fica verde
  # e o job de provisionamento abaixo fica skipped automaticamente.
  verify:
    name: Verify ${{ inputs.env_label }} (${{ inputs.git_mode }})
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ inputs.verify_ref }}
      # D1: a política de source map é o MESMO passo nos dois caminhos, e o que
      # muda é este booleano. `true` (só PROD) transforma a ausência de
      # credencial em reprovação do verify — e, como `deploy` tem
      # `needs: verify`, em reprovação do deploy antes de qualquer SSH.
      sentry_exigido: ${{ inputs.sentry_exigido }}
    # O job verify NÃO recebe secret de VPS (quem provisiona é o job `deploy`,
    # com `environment:`). Repassa APENAS os do Sentry: o deploy de PROD sai de
    # uma tag, que não dispara o CI por `push`, então sem isto o source map da
    # release de produção nunca seria enviado. São secrets de baixo valor
    # (upload de mapa e DSN). Eles continuam declarados como OPCIONAIS no
    # `ci.yml` porque o fail-open é o comportamento de fork/PR; o que impede a
    # release de produção ir sem mapa em produção é o `sentry_exigido` acima,
    # não a obrigatoriedade da declaração.
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_URL: ${{ secrets.SENTRY_URL }}
    permissions:
      contents: read

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    steps:
      - name: Deploy to VPS (${{ inputs.env_label }})
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          # Vazio = a action ignora a entrada e usa o caminho por senha, que é
          # o comportamento de antes. Preenchido, a chave entra como método
          # alternativo; preenchida a impressão digital, a host key é conferida
          # e uma divergência derruba a conexão em vez de confiar no host.
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"; nvm use 20
            APP_DIR="${{ inputs.app_dir }}"; WEB_PORT=${{ inputs.web_port }}; API_PORT=${{ inputs.api_port }}
            HOST="${{ inputs.host }}"; DB_NAME="${{ inputs.db_name }}"; DB_USER="${{ inputs.db_user }}"
            SUF="${{ inputs.pm_suffix }}"; LABEL="${{ inputs.env_label }}"
            GIT_MODE="${{ inputs.git_mode }}"; GIT_REF="${{ inputs.git_ref }}"; VERIFY_REF="${{ inputs.verify_ref }}"
            DEPLOYED_SHA_FILE="$APP_DIR/.deployed-sha"
            PM2_MAX_ATTEMPTS=3
            PM2_RETRY_DELAY=3
            PM2_ONLINE_CHECKS=10
            PM2_ONLINE_DELAY=2
            PM2_ONLINE_CONFIRMATIONS=2
            WEB_RUNTIME="${{ inputs.web_runtime }}"
            CELERY_SYSTEMD="${{ inputs.celery_systemd }}"
            # Release atômica do tier web (C2.1/C2.2). `releases/` fica dentro
            # de `frontend/` porque o symlink `current` é relativo ao checkout
            # e o PM2 recebe um caminho estável: trocar o alvo do symlink troca a
            # versão servida sem reescrever caminho nenhum no dump do PM2.
            RELEASES_DIR="$APP_DIR/frontend/releases"
            CURRENT_LINK="$RELEASES_DIR/current"
            PREVIOUS_LINK="$RELEASES_DIR/previous"
            STANDALONE_RUNNER="$APP_DIR/infra/standalone/run-standalone.sh"
            # Preservação: quantas releases antigas ficam em disco. 3 = a
            # anterior, a anterior da anterior e uma margem. O corte nunca
            # remove `current` nem `previous` (ver podar_releases).
            RELEASES_TO_KEEP="${PORTAL_RELEASES_TO_KEEP:-3}"
            # 0.0.0.0 preserva o alcance de hoje (`npm start` escuta em todas as
            # interfaces) e o Nginx/validate falam com 127.0.0.1. Fica EXPLÍCITO
            # porque o Next standalone sem HOSTNAME escuta no hostname do host,
            # que nem sempre é o que o proxy espera.
            WEB_BIND_HOST=0.0.0.0
            TLS_ENABLED="${{ inputs.tls_enabled }}"
            TLS_ENABLED=$(printf '%s' "$TLS_ENABLED" | tr '[:upper:]' '[:lower:]')
            case "$TLS_ENABLED" in
              true|false) ;;
              *) echo "ERRO: tls_enabled deve ser true ou false"; exit 1 ;;
            esac
            case "$WEB_RUNTIME" in
              standalone|npm) ;;
              *) echo "ERRO: web_runtime inválido: $WEB_RUNTIME (use standalone ou npm)"; exit 1 ;;
            esac
            case "$CELERY_SYSTEMD" in
              true|false) ;;
              *) echo "ERRO: celery_systemd deve ser true ou false"; exit 1 ;;
            esac
            if ! printf '%s' "$RELEASES_TO_KEEP" | grep -Eq '^[1-9][0-9]*$'; then
              echo "ERRO: PORTAL_RELEASES_TO_KEEP deve ser um inteiro >= 1 (recebido: $RELEASES_TO_KEEP)"; exit 1
            fi
            case "$GIT_MODE" in
              branch|pr|tag|rollback) ;;
              *) echo "ERRO: git_mode inválido: $GIT_MODE"; exit 1 ;;
            esac
            if [ "$GIT_MODE" = "rollback" ] && { [ "${#VERIFY_REF}" -ne 40 ] || [ -n "$(printf '%s' "$VERIFY_REF" | tr -d '0-9a-fA-F')" ]; }; then
              echo "ERRO: rollback exige verify_ref com exatamente 40 caracteres hexadecimais"
              exit 1
            fi
            if [ -z "$VERIFY_REF" ]; then echo "ERRO: verify_ref obrigatório para impedir deploy de commit não verificado"; exit 1; fi
            # O marker só é promovido no job validate, depois dos dois probes.
            # Até lá, este valor é a referência de recuperação da VPS.
            write_deployed_sha() {
              local sha="$1"
              local marker_tmp="$DEPLOYED_SHA_FILE.tmp.$$"
              if ! (umask 077; printf '%s\n' "$sha" > "$marker_tmp"); then
                rm -f -- "$marker_tmp" || true
                return 1
              fi
              if ! chmod 600 -- "$marker_tmp" || ! mv -f -- "$marker_tmp" "$DEPLOYED_SHA_FILE"; then
                rm -f -- "$marker_tmp" || true
                return 1
              fi
            }
            # ---- release atômica do tier web (C2.1) ------------------------
            # Por que release do WEB e não do app inteiro: a promoção tem de
            # ser um symlink, e symlink só é seguro para o que NÃO tem estado
            # nem migration. O backend usa `git reset --hard` + migrate no lugar,
            # `.env` e `media/` são untracked e sobrevivem ao reset, e trocar o
            # diretório do backend exigiria mover as units systemd, os scripts
            # de backup e o `.venv` (centenas de MB por release) sem ganho. A
            # atomicidade do tier web é onde a troca de versão do frontend
            # acontece de verdade, e ela é a que mixava `.next/` embaixo do
            # processo em produção.
            #
            # `ln -sfn` NÃO é atômico (remove o antigo e cria o novo, com uma
            # janela em que `current` não existe). O par `ln -s` + `mv -T` usa
            # rename(2) sobre o symlink: quem lê o link em qualquer instante vê
            # a release antiga OU a nova, nunca um estado quebrado.
            apontar_symlink() {
              local link="$1" alvo="$2" tmp
              tmp="$link.tmp.$$"
              if [ ! -e "$alvo" ]; then
                echo "ERRO: alvo do symlink não existe: $alvo" >&2
                return 1
              fi
              rm -f -- "$tmp"
              if ! ln -s -- "$alvo" "$tmp"; then return 1; fi
              if ! mv -Tf -- "$tmp" "$link"; then
                rm -f -- "$tmp"
                return 1
              fi
            }
            # Copia a árvore standalone do build para uma pasta versionada. A
            # cópia é o que torna a release INDEPENDENTE do `.next/` que o
            # próximo deploy reescreve por cima: sem ela, a release "anterior"
            # deixaria de existir no meio da operação seguinte.
            preparar_release() {
              local standalone_src="$APP_DIR/frontend/.next/standalone"
              if [ ! -f "$standalone_src/server.js" ]; then
                echo "ERRO: $standalone_src/server.js não existe; o build não gerou a árvore standalone (confira output: \"standalone\" em frontend/next.config.js)"
                return 1
              fi
              if [ ! -x "$STANDALONE_RUNNER" ]; then
                echo "ERRO: $STANDALONE_RUNNER ausente ou sem permissão de execução (o arquivo é do próprio checkout)"
                return 1
              fi
              rm -rf -- "$RELEASE_DIR"
              mkdir -p -- "$RELEASE_DIR"
              if ! cp -a -- "$standalone_src/." "$RELEASE_DIR/standalone/"; then return 1; fi
              # SHA da release DENTRO dela: o rollback por symlink descobre o
              # commit sem depender do `.deployed-sha` global nem do git.
              if ! (umask 027; printf '%s\n' "$ACTUAL_COMMIT" > "$RELEASE_DIR/.deployed-sha"); then
                echo "ERRO: não foi possível gravar o SHA da release em $RELEASE_DIR/.deployed-sha" >&2
                return 1
              fi
              # `prepare` copia `public/` e `.next/static` para dentro da
              # árvore (mesmo padrão do frontend/Dockerfile). Sem o
              # `.next/static`, o smoke reprova a release — o portal subir sem
              # nenhum asset é o tipo de falha que parece sucesso.
              "$STANDALONE_RUNNER" prepare \
                --dir "$RELEASE_DIR/standalone" \
                --public "$APP_DIR/frontend/public" \
                --static "$APP_DIR/frontend/.next/static"
            }
            # O smoke roda na release, em porta livre, ANTES de qualquer troca
            # de symlink ou restart: enquanto ele não passa, o PM2 continua
            # servindo a release anterior e ninguém sente nada.
            smoke_release() {
              "$STANDALONE_RUNNER" smoke \
                --dir "$RELEASE_DIR/standalone" \
                --timeout 90
            }
            promover_release() {
              local anterior=""
              if [ -L "$CURRENT_LINK" ]; then anterior="$(readlink -f "$CURRENT_LINK" 2>/dev/null || true)"; fi
              if [ -n "$anterior" ] && [ -d "$anterior" ] && [ "$anterior" != "$RELEASE_DIR" ]; then
                if ! apontar_symlink "$PREVIOUS_LINK" "$anterior"; then
                  echo "ERRO: não foi possível preservar a release anterior em $PREVIOUS_LINK" >&2
                  return 1
                fi
                echo "release anterior preservada: $anterior"
              fi
              if ! apontar_symlink "$CURRENT_LINK" "$RELEASE_DIR"; then
                echo "ERRO: não foi possível apontar $CURRENT_LINK para $RELEASE_DIR" >&2
                return 1
              fi
              echo "current -> $RELEASE_DIR (promovido SÓ DEPOIS do smoke verde)"
            }
            voltar_release_anterior() {
              local alvo=""
              if [ ! -L "$PREVIOUS_LINK" ]; then
                echo "não há release anterior registrada em $PREVIOUS_LINK" >&2
                return 1
              fi
              alvo="$(readlink -f "$PREVIOUS_LINK" 2>/dev/null || true)"
              if [ -z "$alvo" ] || [ ! -f "$alvo/standalone/server.js" ]; then
                echo "a release anterior ($PREVIOUS_LINK) não tem árvore standalone utilizável" >&2
                return 1
              fi
              if ! apontar_symlink "$CURRENT_LINK" "$alvo"; then return 1; fi
              echo "current -> $alvo (release anterior)"
            }
            # Poda por data, PROTEGENDO o que `current` e `previous` apontam —
            # inclusive quando a release anterior ficou fora do recorte, o que
            # aconteceria com quatro deploys em sequência: sem essa proteção o
            # alvo do rollback sumiria e o retorno automático não teria para onde
            # ir. Nunca usa `rm -rf` em caminho construido por variável sem
            # `${...:?}`.
            podar_releases() {
              local nome cont=0 alvo_atual alvo_anterior dir
              alvo_atual="$(readlink -f "$CURRENT_LINK" 2>/dev/null || true)"
              alvo_anterior="$(readlink -f "$PREVIOUS_LINK" 2>/dev/null || true)"
              for nome in $(cd "$RELEASES_DIR" && ls -1dt */ 2>/dev/null | sed 's#/$##'); do
                [ -n "$nome" ] || continue
                case "$nome" in current|previous) continue ;; esac
                dir="$RELEASES_DIR/$nome"
                [ "$dir" = "$alvo_atual" ] && continue
                [ "$dir" = "$alvo_anterior" ] && continue
                cont=$((cont + 1))
                if [ "$cont" -le "$RELEASES_TO_KEEP" ]; then continue; fi
                if rm -rf -- "${dir:?}"; then
                  echo "release podada (fora do recorte de $RELEASES_TO_KEEP): $dir"
                else
                  echo "AVISO: não foi possível podar $dir"
                fi
              done
            }
            SSL_REDIRECT=false
            SESSION_COOKIE_SECURE=false
            CSRF_COOKIE_SECURE=false
            if [ "$TLS_ENABLED" = true ]; then
              SSL_REDIRECT=true
              SESSION_COOKIE_SECURE=true
              CSRF_COOKIE_SECURE=true
            fi
            if [ -z "$GIT_REF" ] && [ "$GIT_MODE" != "pr" ] && [ "$GIT_MODE" != "rollback" ]; then
              echo "ERRO: git_ref obrigatório para git_mode=$GIT_MODE"; exit 1
            fi
            # Origens públicas via Nginx (mesma origem do navegador — ver
            # infra/nginx/portal-{dev,homolog,prod}.conf): o frontend chama a
            # API pelo path /api/ do próprio domínio, então não há
            # mixed-content nem CORS — e o backend usa o mesmo host para CORS
            # e links de e-mail. NUNCA usar http://IP:porta aqui: é bloqueado
            # como mixed-content em página https e não está na allowlist de
            # A origem pública acompanha o estado real do edge: não grave
            # https no bundle enquanto o vhost ainda responde apenas em HTTP.
            if [ "$TLS_ENABLED" = true ]; then
              API_ORIGIN="https://$HOST"; WEB_ORIGIN="https://$HOST"
            else
              API_ORIGIN="http://$HOST"; WEB_ORIGIN="http://$HOST"
            fi
            echo "=== Deploy $LABEL portal-noticias ==="
            mkdir -p /home/apps
            if [ ! -d "$APP_DIR/.git" ]; then
              if [ "$GIT_MODE" = "pr" ] || [ "$GIT_MODE" = "rollback" ]; then
                git clone https://github.com/Alex-Buttielie/portal-noticias.git "$APP_DIR"
              else
                git clone -b "$GIT_REF" https://github.com/Alex-Buttielie/portal-noticias.git "$APP_DIR"
              fi
            fi
            cd "$APP_DIR"

            # Antes de trocar o checkout, conserva o SHA que o PM2 já executava.
            # O fallback para HEAD só é aceito quando pelo menos um processo do
            # ambiente existe; em uma primeira instalação não há referência
            # antiga e o marker só será criado após o smoke bem-sucedido.
            PREVIOUS_SHA=""
            if [ -f "$DEPLOYED_SHA_FILE" ]; then
              PREVIOUS_SHA="$(tr -d '[:space:]' < "$DEPLOYED_SHA_FILE" 2>/dev/null || true)"
            fi
            if ! printf '%s' "$PREVIOUS_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
              PREVIOUS_SHA=""
              if pm2 describe "portal-web-$SUF" >/dev/null 2>&1 || pm2 describe "portal-api-$SUF" >/dev/null 2>&1; then
                PREVIOUS_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
              fi
            fi
            if printf '%s' "$PREVIOUS_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
              echo "PM2: SHA anterior registrado: $PREVIOUS_SHA"
              if ! write_deployed_sha "$PREVIOUS_SHA"; then
                echo "ERRO: não foi possível registrar/preservar $DEPLOYED_SHA_FILE antes do deploy"
                exit 1
              fi
            else
              echo "PM2: nenhum SHA anterior encontrado; este será o primeiro marker após o smoke"
            fi

            if [ "$GIT_MODE" = "pr" ]; then
              # Fetch direto do ref do PR: funciona tanto para PR do mesmo
              # repo quanto de fork (origin/${head_ref} só existe no primeiro).
              git fetch origin "+refs/pull/${{ inputs.pr_number }}/head:pr-head"
              git reset --hard "$VERIFY_REF"
            elif [ "$GIT_MODE" = "tag" ]; then
              git fetch --all --tags --force; git reset --hard "origin/main"; git checkout "$GIT_REF"
              # A tag e o commit do evento podem divergir se a tag for movida;
              # o reset final mantém o código igual ao testado pelo verify.
              git reset --hard "$VERIFY_REF"
            elif [ "$GIT_MODE" = "rollback" ]; then
              echo "Rollback solicitado para o SHA verificado $VERIFY_REF"
              git fetch --all --tags --force
              if ! git cat-file -e "$VERIFY_REF^{commit}" 2>/dev/null; then
                if ! git fetch origin "$VERIFY_REF"; then
                  echo "ERRO: SHA de rollback $VERIFY_REF não pôde ser obtido do origin"
                  exit 1
                fi
              fi
              git reset --hard "$VERIFY_REF"
            else
              git fetch origin
              git reset --hard "$VERIFY_REF"
            fi
            ACTUAL_COMMIT="$(git rev-parse HEAD)"
            EXPECTED_COMMIT="$(git rev-parse "$VERIFY_REF^{commit}" 2>/dev/null || true)"
            if [ -z "$EXPECTED_COMMIT" ] || [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
              echo "ERRO: checkout ficou em $ACTUAL_COMMIT, mas o gate verificou $EXPECTED_COMMIT"
              exit 1
            fi
            if [ ! -f backend/.env ]; then
              SECRET=$(python3 -c "import secrets;print(secrets.token_urlsafe(50))")
              # O arquivo é criado uma única vez. tls_enabled=false é o
              # bootstrap seguro para uma VPS que ainda não tem certificado;
              # tls_enabled=true grava os três flags de TLS, mas nunca emite
              # o certificado — a emissão é um passo humano anterior.
              # Escreve fora do caminho final e publica por rename. Uma
              # interrupção no meio do printf nunca deixa backend/.env parcial.
              ENV_TMP="$APP_DIR/backend/.env.tmp.$$"
              (umask 077; : > "$ENV_TMP")
              if ! printf 'DJANGO_SECRET_KEY=%s\nDJANGO_DEBUG=false\nDJANGO_ALLOWED_HOSTS=%s%s,108.174.147.50,localhost,127.0.0.1\nDJANGO_SECURE_SSL_REDIRECT=%s\nDJANGO_SESSION_COOKIE_SECURE=%s\nDJANGO_CSRF_COOKIE_SECURE=%s\nDJANGO_DB_ENGINE=postgresql\nDJANGO_DB_NAME=%s\nDJANGO_DB_USER=%s\nDJANGO_DB_PASSWORD=troque-aqui\nDJANGO_DB_HOST=localhost\nDJANGO_DB_PORT=5432\nFRONTEND_BASE_URL=%s\n' \
                "$SECRET" "$HOST" "${{ inputs.allowed_hosts_extra }}" \
                "$SSL_REDIRECT" "$SESSION_COOKIE_SECURE" "$CSRF_COOKIE_SECURE" \
                "$DB_NAME" "$DB_USER" "$WEB_ORIGIN" > "$ENV_TMP"; then
                rm -f -- "$ENV_TMP" || true
                exit 1
              fi
              if ! chmod 600 "$ENV_TMP" || ! mv -f -- "$ENV_TMP" backend/.env; then
                rm -f -- "$ENV_TMP" || true
                echo "ERRO: não foi possível publicar atomicamente backend/.env"
                exit 1
              fi
            else
              # Não sobrescreve o .env nem faz downgrade automático. Se o
              # operador trocou tls_enabled, o arquivo precisa ser editado de
              # forma explícita antes do redeploy; caso contrário o deploy
              # falha antes de iniciar um processo com flags incoerentes.
              if [ "$TLS_ENABLED" = true ]; then EXPECTED_TLS=true; else EXPECTED_TLS=false; fi
              for setting in DJANGO_SECURE_SSL_REDIRECT DJANGO_SESSION_COOKIE_SECURE DJANGO_CSRF_COOKIE_SECURE; do
                if ! grep -Eq "^${setting}=${EXPECTED_TLS}$" backend/.env; then
                  echo "ERRO: $setting deve ser $EXPECTED_TLS em backend/.env para tls_enabled=$TLS_ENABLED; ajuste o arquivo e redeploy"
                  exit 1
                fi
              done
            fi
            cd "$APP_DIR/frontend"
            # P1-5 conservador: o build continua na VPS até existir um teste
            # real do artifact standalone. O cache vive no home do usuário
            # (fora do APP_DIR, preservado pelo git reset) e o heap fica
            # limitado para não disputar RAM com Postgres e as 3 stacks.
            export NPM_CONFIG_CACHE="$HOME/.npm"
            mkdir -p "$NPM_CONFIG_CACHE"
            npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline
            NODE_OPTIONS="--max-old-space-size=1536" \
              NEXT_PUBLIC_API_BASE_URL="$API_ORIGIN" NEXT_PUBLIC_SITE_URL="$WEB_ORIGIN" \
              npm run build
            # --- release do tier web: preparar e fumegar ANTES de qualquer
            # mudança visível (C2.1). Continua compilando NA VPS (heap 1536 MB,
            # três stacks na mesma máquina): a estratégia de build não muda, o
            # que muda é ONDE o build vira uma release versionada.
            if [ "$WEB_RUNTIME" = "standalone" ]; then
              # Id com timestamp UTC + SHA: ordenável por data e identificável
              # por human no `ls`, sem depender de `git describe`.
              RELEASE_ID="$(date -u +%Y%m%dT%H%M%SZ)-$(printf '%s' "$ACTUAL_COMMIT" | cut -c1-12)"
              RELEASE_DIR="$RELEASES_DIR/$RELEASE_ID"
              mkdir -p -- "$RELEASES_DIR"
              echo "=== release web $RELEASE_ID (commit $ACTUAL_COMMIT) ==="
              if ! preparar_release; then
                echo "ERRO: preparação da release falhou; o symlink current e o PM2 NÃO foram tocados (o portal segue na release anterior)"
                exit 1
              fi
              # FALHA AQUI = deploy abortado antes de tocar em `current`, no PM2,
              # no `.deployed-sha` e antes das migrations do backend. O smoke
              # aceita 503 na Home (estado documentado de feed indisponível) e
              # reprova 5xx e asset estático ausente.
              if ! smoke_release; then
                echo "ERRO: smoke da release $RELEASE_ID reprovou; o symlink current e o PM2 NÃO foram tocados (o portal segue na release anterior)"
                rm -rf -- "${RELEASE_DIR:?}"
                exit 1
              fi
              echo "=== release $RELEASE_ID aprovada no smoke ==="
            else
              echo "web_runtime=npm: build in-place e PM2 com \`npm start\` (caminho anterior, mantido como escape)"
            fi
            cd "$APP_DIR/backend"
            python3 -m venv .venv 2>/dev/null || true
            . .venv/bin/activate
            # O CI instalou e validou exatamente este lock; manter o mesmo
            # conjunto na VPS torna o deploy reproduzível. Atualizar uma
            # dependência exige regenerar requirements-lock.txt e rodar o CI.
            pip install -r requirements-lock.txt
            set -a; . ./.env; set +a
            if [ "${DJANGO_DB_PASSWORD:-troque-aqui}" = "troque-aqui" ]; then echo "ERRO: preencha DJANGO_DB_PASSWORD em $APP_DIR/backend/.env (Postgres da VPS — ver CI-CD.md)"; exit 1; fi
            python manage.py check
            python manage.py migrate
            python manage.py collectstatic --noinput
            # PM2 faz o restart no próprio processo: não há delete seguido de
            # start, portanto uma interrupção nessa janela não deixa os dois
            # serviços fora do daemon. Se o processo ainda não existir, start
            # é o caminho inicial. Cada comando é tentado até 3 vezes e só
            # volta a deployar o próximo processo depois de confirmar `online`.
            pm2_state() {
              local process_name="$1"
              local jlist_output
              if ! jlist_output="$(pm2 jlist 2>/dev/null)"; then
                echo "PM2: não foi possível consultar jlist para $process_name" >&2
                return 1
              fi
              if ! printf '%s' "$jlist_output" | python3 -c 'import json,sys; name=sys.argv[1]; data=json.load(sys.stdin); assert isinstance(data,list), "jlist root must be a list"; matches=[p for p in data if isinstance(p,dict) and p.get("name")==name]; print(((matches[0].get("pm2_env") or {}).get("status") or "unknown") if matches else "missing")' "$process_name" 2>/dev/null; then
                echo "PM2: jlist inválido ao consultar $process_name" >&2
                return 1
              fi
            }

            wait_for_pm2_online() {
              local process_name="$1"
              local attempt=1
              local state="unknown"
              local online_confirmations=0
              PM2_LAST_STATE="unknown"
              while [ "$attempt" -le "$PM2_ONLINE_CHECKS" ]; do
                if state="$(pm2_state "$process_name")"; then
                  if [ "$state" = "online" ]; then
                    online_confirmations=$((online_confirmations + 1))
                    if [ "$online_confirmations" -ge "$PM2_ONLINE_CONFIRMATIONS" ]; then
                      return 0
                    fi
                  else
                    online_confirmations=0
                  fi
                else
                  state="jlist-error"
                  online_confirmations=0
                fi
                PM2_LAST_STATE="$state"
                if [ "$attempt" -lt "$PM2_ONLINE_CHECKS" ]; then
                  sleep "$PM2_ONLINE_DELAY"
                fi
                attempt=$((attempt + 1))
              done
              echo "PM2: $process_name não ficou online após $PM2_ONLINE_CHECKS verificações (último estado: $PM2_LAST_STATE)" >&2
              return 1
            }

            # Aplica a DEFINICAO do processo, não apenas reinicia-lo.
            #
            # Por que delete+start e nunca `pm2 restart`: o restart reaproveita
            # os argumentos ja salvos pelo proprio PM2 e ignora os argumentos
            # novos passados aqui. Efeito observado em producao (2026-09-24):
            # o `--config gunicorn.conf.py` foi adicionado ao comando da API,
            # mas `pm2 restart` manteve `--workers 2` sem `--config` — o conf
            # NUNCA era carregado, o gunicorn ficava em workers `sync`
            # (1 thread por worker) com o timeout default de 30s, e o timeout
            # do `GUNICORN_TIMEOUT` (lido so pelo conf) ficava inerte. O
            # objetivo do P1-3 (gthread) nao estava em vigor em nenhum
            # ambiente. Confirmado via /proc/<pid>/status (Threads: 1).
            #
            # `delete` + `start` curto o servico, mas e o unico jeito de
            # garantir que o processo suba com os args desta run. O retry e o
            # wait_for_pm2_online abaixo mantem a mesma garantia de antes: so
            # retorna 0 com o processo online.
            restart_or_start() {
              local process_name="$1"
              shift
              local attempt=1
              local command_ok=1
              while [ "$attempt" -le "$PM2_MAX_ATTEMPTS" ]; do
                command_ok=1
                echo "PM2: tentativa $attempt/$PM2_MAX_ATTEMPTS para $process_name (delete+start)"
                pm2 delete "$process_name" >/dev/null 2>&1 || true
                if pm2 start "$@"; then
                  command_ok=0
                else
                  echo "PM2: start de $process_name falhou; será repetido" >&2
                fi
                if wait_for_pm2_online "$process_name"; then
                  if [ "$command_ok" -eq 0 ]; then
                    echo "PM2: $process_name confirmado online"
                    return 0
                  fi
                  echo "PM2: start de $process_name falhou apesar do estado online; será repetido" >&2
                fi
                if [ "$attempt" -lt "$PM2_MAX_ATTEMPTS" ]; then
                  sleep "$PM2_RETRY_DELAY"
                fi
                attempt=$((attempt + 1))
              done
              echo "ERRO: $process_name não está online após $PM2_MAX_ATTEMPTS tentativas (último estado: ${PM2_LAST_STATE:-unknown})" >&2
              if [ -n "$PREVIOUS_SHA" ]; then
                echo "Recuperação manual: rode o workflow 'Rollback manual do portal' com target_sha=$PREVIOUS_SHA; o marker antigo permanece em $DEPLOYED_SHA_FILE." >&2
              else
                echo "Recuperação manual: restaure o último checkout conhecido com o procedimento de rollback em CI-CD.md; não há marker anterior." >&2
              fi
              return 1
            }
            cd "$APP_DIR/frontend"
            # API_INTERNAL_URL (runtime, não bake): alimenta o rewrite /api/*
            # do next.config.js — proxy mesma-origem para acesso direto por
            # IP:porta (sem passar pelo Nginx).
            if [ "$WEB_RUNTIME" = "standalone" ]; then
              # A promoção acontece AQUI, e só aqui: o smoke já passou, então o
              # symlink `current` passa a apontar para a release nova e o PM2
              # entra com o caminho estável `current/standalone`. A release que
              # estava em `current` acabou de virar `previous`.
              if ! promover_release; then
                echo "ERRO: promoção do symlink current falhou; o PM2 NÃO foi reiniciado"
                exit 1
              fi
              CURRENT_STANDALONE="$CURRENT_LINK/standalone"
              if [ ! -f "$CURRENT_STANDALONE/server.js" ]; then
                echo "ERRO: $CURRENT_STANDALONE/server.js não existe após a promoção"
                exit 1
              fi
              # O standalone roda `node server.js` e o PM2 executa o binário
              # com o ambiente do daemon, que pode não ter o node do nvm no
              # PATH (o `npm start` resolvia o node por dentro do npm). Fixar o
              # PATH no start elimina essa diferença em vez de confiar nela.
              NODE_BIN="$(command -v node || true)"
              if [ -z "$NODE_BIN" ]; then
                echo "ERRO: node não encontrado no PATH depois de \`nvm use 20\`; o runtime standalone exige Node 20"
                exit 1
              fi
              echo "web: runtime standalone em $CURRENT_STANDALONE (node $NODE_BIN, bind $WEB_BIND_HOST:$WEB_PORT)"
              if PATH="$(dirname "$NODE_BIN"):$PATH" HOSTNAME="$WEB_BIND_HOST" PORT="$WEB_PORT" \
                   API_INTERNAL_URL="http://127.0.0.1:$API_PORT" \
                 restart_or_start "portal-web-$SUF" "$STANDALONE_RUNNER" start \
                   --dir "$CURRENT_STANDALONE" --host "$WEB_BIND_HOST" --port "$WEB_PORT"; then
                :
              else
                # O processo NÃO subiu, então a release nova não está no ar.
                # Devolver `current` para a release anterior e tentar de novo
                # nela é seguro aqui: o anterior já estava no ar antes deste
                # deploy, e o que está em jogo é a versão do frontend, não
                # dado nem migration. O marker NÃO é promovido (o job
                # validate só promove com `deploy.result == success`).
                if voltar_release_anterior; then
                  echo "PM2 não subiu na release nova; current devolvido para a release anterior. Subindo nela."
                  if PATH="$(dirname "$NODE_BIN"):$PATH" HOSTNAME="$WEB_BIND_HOST" PORT="$WEB_PORT" \
                       API_INTERNAL_URL="http://127.0.0.1:$API_PORT" \
                     restart_or_start "portal-web-$SUF" "$STANDALONE_RUNNER" start \
                       --dir "$PREVIOUS_LINK/standalone" --host "$WEB_BIND_HOST" --port "$WEB_PORT"; then
                    # Deploy ABORTADO de propósito mesmo com o portal de volta:
                    # um exit 0 aqui promoveria um SHA cuja release web não está
                    # no ar, e o marker é a fronteira de recuperação.
                    echo "ERRO: portal voltou para a release anterior, mas a release nova NÃO foi promovida; o marker .deployed-sha será preservado"
                  fi
                else
                  echo "AVISO: não há release anterior para voltar; o portal web pode estar fora do ar"
                fi
                echo "Recuperação: rode o workflow 'Rollback manual do portal' com o SHA de $RELEASE_DIR/.deployed-sha, ou web_runtime=npm no dispatch."
                exit 1
              fi
            else
              API_INTERNAL_URL="http://127.0.0.1:$API_PORT" PORT="$WEB_PORT" \
                restart_or_start "portal-web-$SUF" npm --name "portal-web-$SUF" -- start
            fi
            cd "$APP_DIR/backend"
            # Binário + args separados: pm2 não resolve string única citada
            # como executável. --interpreter explícito: o binário gunicorn não
            # tem extensão e o pm2 o executaria com node (SyntaxError).
            # O `cd "$APP_DIR/backend"` imediatamente acima é importante:
            # o PM2 captura esse cwd (pm_cwd) e, por isso, encontra o
            # conf local; não dependemos só do --chdir. --config absoluto
            # torna a garantia explícita mesmo se um PM2 futuro for iniciado
            # de outro diretório.
            # O default atual é 60s: o POST /api/admin/robos/executar/ só
            # pode passar a 45s depois que o commit 202+background for
            # ancestral do ref implantado (Nginx também deve ir a 45s).
            # Só o bind varia por ambiente ($API_PORT).
            GUNICORN_TIMEOUT=60 DJANGO_SETTINGS_MODULE=config.settings \
              restart_or_start "portal-api-$SUF" "$APP_DIR/backend/.venv/bin/gunicorn" \
              --interpreter "$APP_DIR/backend/.venv/bin/python" --name "portal-api-$SUF" -- \
              --config "$APP_DIR/backend/gunicorn.conf.py" config.wsgi:application \
              --bind "0.0.0.0:$API_PORT" --chdir "$APP_DIR/backend"
            pm2 save
            # --- Celery no systemd, por ambiente (C2.3) --------------------
            # As units são TEMPLATE (`celery-worker@.service`), e `%i` é o
            # ambiente: uma VPS com três diretórios precisa de três instâncias,
            # e o ambiente errado é a falha que faz backup de dev em produção.
            # NADA que o PM2 gerencia é tocado aqui — o worker e o beat não
            # existiam na topologia ativa (achado B4), então isto ADICIONA o
            # que faltava, sem remover caminho nenhum.
            #
            # Falha aqui NUNCA derruba o deploy: web e API já estão no ar, e o
            # estado do worker é degradação visível em `/health-detail` e no
            # alerta `PortalFilaCelery`. Um deploy que caísse por causa do
            # Celery seria pior que o Celery parado.
            ativar_celery_systemd() {
              local f src tmp unit deploy_user deploy_group tuning
              if [ "$CELERY_SYSTEMD" != "true" ]; then
                echo "Celery: celery_systemd=false; systemd não tocado"
                return 0
              fi
              if ! command -v systemctl >/dev/null 2>&1; then
                echo "Celery: systemctl ausente nesta máquina; units não instaladas"
                return 0
              fi
              if ! sudo -n true 2>/dev/null; then
                echo "Celery: sem sudo sem senha; units NÃO instaladas. Instale à mão (infra/DEPLOY.md, seção 9)"
                return 0
              fi
              deploy_user="$(id -un)"
              deploy_group="$(id -gn)"
              for f in celery-worker@.service celery-beat@.service \
                       celery-beat-heartbeat@.service celery-beat-heartbeat@.timer; do
                src="$APP_DIR/infra/systemd/$f"
                if [ ! -f "$src" ]; then
                  echo "Celery: $src ausente; pulei $f"
                  continue
                fi
                # Placeholder do template resolvido: `User`/`Group` são o dono do
                # app (o mesmo do PM2). O cabeçalho da unit proíbe root — o
                # worker tem o mesmo acesso a mídia e banco que a aplicação web.
                tmp="$(mktemp)"
                sed -e "s|^User=.*|User=$deploy_user|" -e "s|^Group=.*|Group=$deploy_group|" "$src" > "$tmp"
                if sudo install -m 0644 -o root -g root "$tmp" "/etc/systemd/system/$f"; then
                  echo "Celery: unit instalada $f (User=$deploy_user)"
                else
                  echo "Celery: FALHA ao instalar $f"
                fi
                rm -f -- "$tmp"
              done
              if ! sudo systemctl daemon-reload; then
                echo "Celery: FALHA no daemon-reload; unidades não ativas"
                return 0
              fi
              # `/etc/portal/celery-<env>.env`: os dois `EnvironmentFile` das
              # units NÃO têm o prefixo `-`, então sem este arquivo a unit não
              # sobe (fail-closed, de propósito). Criá-lo aqui é
              # PROVISIONAR o que a unit exige — com os mesmos valores que o
              # `docker-compose.yml` já usa para o `celery-worker`, não
              # inventados. Nunca sobrescreve: ajuste do operador é preservado.
              tuning="/etc/portal/celery-$SUF.env"
              if sudo test -f "$tuning"; then
                echo "Celery: $tuning já existe; preservado"
              else
                tmp="$(mktemp)"
                cat > "$tmp" <<EOF
            # Gerado pelo deploy (C2.3) e nunca sobrescrito por deploys seguintes.
            # CELERY_WORKER_CONCURRENCY / MAX_TASKS_PER_CHILD: mesmos valores do serviço
            # celery-worker do docker-compose.yml. A VPS tem 4 GB divididas entre as três
            # stacks, Postgres, Redis e o Nginx: meça o pico antes de aumentar.
            CELERY_WORKER_CONCURRENCY=2
            CELERY_WORKER_MAX_TASKS_PER_CHILD=100
            # Produtor e consumidor do heartbeat do beat (celery-beat-heartbeat@$SUF.timer e
            # backend/config/health.py::check_celery_beat).
            BEAT_HEARTBEAT_FILE=/var/lib/portal-observabilidade/beat-$SUF.heartbeat
            OBSERVABILITY_BEAT_HEARTBEAT_FILE=/var/lib/portal-observabilidade/beat-$SUF.heartbeat
            EOF
                # NÃO cria /var/lib/portal-observabilidade: a fonte única desse
                # diretório é `StateDirectory=` de celery-beat-heartbeat@.service
                # (ver o comentário da unit). Criar aqui também daria ao
                # diretório o dono do usuário do deploy, e o dono certo é o
                # `User=` da unit — coincidiriam hoje, divergiriam no primeiro
                # ajuste de `User=`, e o sintoma seria `touch` falhando por
                # permissão com o beat VIVO.
                if sudo install -m 0640 -o root -g "$deploy_group" "$tmp" "$tuning"; then
                  echo "Celery: criado $tuning (0640 root:$deploy_group)"
                else
                  echo "Celery: FALHA ao criar $tuning; as units vão recusar subir (fail-closed)"
                fi
                rm -f -- "$tmp"
              fi
              # --- o CONSUMIDOR do heartbeat (esta é a parte que faltava) -----
              # `/health-detail` é servido pelo gunicorn do PM2, e é ele que roda
              # `check_celery_beat`. O gunicorn sobe com `set -a; . ./.env`, ou
              # seja, SÓ `backend/.env` — ele NÃO lê `/etc/portal/celery-*.env`,
              # que é lido apenas pelas units systemd. Sem esta linha, o produtor
              # escreveria o arquivo e o check ficaria `not_configured` para
              # sempre: beat vivo, heartbeat sendo tocado a cada 5 min, e o
              # sinal invisível. Esse é o pior tipo de falha de observabilidade
              # — parece que está tudo certo porque nada acusa nada.
              #
              # Acrescenta ao `backend/.env` SEM reescrever o arquivo (o `.env` é
              # gerado uma vez e nunca sobrescrito, por invariante do projeto):
              # só acrescenta a linha se a chave ainda não existir. Se já
              # existir com OUTRO valor, avisa em vez de corrigir — mudar o
              # `.env` do operador em silêncio seria a pior das opções, porque
              # o check passaria a ler um arquivo que ninguém produz.
              beat_path="/var/lib/portal-observabilidade/beat-$SUF.heartbeat"
              app_env="$APP_DIR/backend/.env"
              if grep -qE '^OBSERVABILITY_BEAT_HEARTBEAT_FILE=' "$app_env" 2>/dev/null; then
                atual="$(grep -E '^OBSERVABILITY_BEAT_HEARTBEAT_FILE=' "$app_env" | tail -1)"
                if [ "$atual" = "OBSERVABILITY_BEAT_HEARTBEAT_FILE=$beat_path" ]; then
                  echo "Celery: $app_env já aponta o heartbeat para o caminho do ambiente"
                else
                  echo "AVISO: $app_env tem '$atual', diferente do caminho que este ambiente produz ('$beat_path')."
                  echo "  O check do beat vai ler um arquivo que a unit não escreve. Corrija a linha à mão (infra/DEPLOY.md, seção 9)."
                fi
              else
                env_tmp="$app_env.tmp.$$"
                if (umask 077; cp -p "$app_env" "$env_tmp" \
                    && printf '\n# C2.3: produtor = infra/systemd/celery-beat-heartbeat@%s.timer.\n# O gunicorn (que serve /health-detail) le SOMENTE este arquivo, nunca\n# /etc/portal/celery-%s.env — sem esta linha o check fica not_configured.\nOBSERVABILITY_BEAT_HEARTBEAT_FILE=%s\n' \
                       "$SUF" "$SUF" "$beat_path" >> "$env_tmp") \
                   && chmod --reference="$app_env" "$env_tmp" 2>/dev/null; then
                  if mv -f -- "$env_tmp" "$app_env"; then
                    echo "Celery: $app_env recebeu OBSERVABILITY_BEAT_HEARTBEAT_FILE=$beat_path"
                  else
                    rm -f -- "$env_tmp"
                    echo "AVISO: não foi possível atualizar $app_env atomicamente; o check do beat pode ficar not_configured"
                  fi
                else
                  rm -f -- "$env_tmp"
                  echo "AVISO: falha ao preparar $env_tmp; o check do beat pode ficar not_configured"
                fi
              fi
              for unit in "celery-worker@$SUF" "celery-beat@$SUF"; do
                if sudo systemctl enable --now "$unit.service" >/dev/null 2>&1; then
                  echo "Celery: $unit ativo e habilitado"
                else
                  echo "Celery: FALHA ao ativar $unit (o portal NÃO para por isso)"
                  sudo systemctl --no-pager --lines 15 status "$unit.service" 2>&1 | sed 's/^/    /' || true
                fi
              done
              if sudo systemctl is-active --quiet "celery-beat-heartbeat@$SUF.timer"; then
                echo "Celery: timer de heartbeat ativo (produtor de BEAT_HEARTBEAT_FILE)"
              else
                echo "Celery: timer de heartbeat NÃO ativo; o check do beat vai ficar degradado por idade"
              fi
            }
            if ! ativar_celery_systemd; then
              echo "AVISO: ativação do Celery terminou com erro; web e API estão no ar. Diagnose com \`systemctl status celery-worker@$SUF\`"
            fi
            if [ "$WEB_RUNTIME" = "standalone" ]; then
              if ! podar_releases; then
                echo "AVISO: poda das releases antigas falhou; disco pode encher (RELEASES_TO_KEEP=$RELEASES_TO_KEEP)"
              fi
            fi
            echo "=== $LABEL deployed $WEB_PORT(web) $API_PORT(api) ==="

  # Mesmo quando o deploy falha depois de um restart, o probe é executado para
  # deixar o estado da API/web explícito no run. `always` também cobre o caso
  # de verify/interrupção; em DEV/HOMOLOG o aviso é não bloqueante.
  validate:
    needs: [verify, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    steps:
      - name: Validate ${{ inputs.env_label }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"; nvm use 20
            APP_DIR="${{ inputs.app_dir }}"
            WEB_PORT="${{ inputs.web_port }}"
            API_PORT="${{ inputs.api_port }}"
            HOST="${{ inputs.host }}"
            STRICT="${{ inputs.strict_validate }}"
            TLS_ENABLED="${{ inputs.tls_enabled }}"
            EXPECTED_SHA="${{ inputs.verify_ref }}"
            DEPLOY_RESULT="${{ needs.deploy.result }}"
            DEPLOYED_SHA_FILE="$APP_DIR/.deployed-sha"
            API_OK=0
            WEB_OK=0
            API_CURL_RC=1
            WEB_CURL_RC=1
            API_HTTP_CODE=000
            WEB_HTTP_CODE=000
            write_deployed_sha() {
              local sha="$1"
              local marker_tmp="$DEPLOYED_SHA_FILE.tmp.$$"
              if ! (umask 077; printf '%s\n' "$sha" > "$marker_tmp"); then
                rm -f -- "$marker_tmp" || true
                return 1
              fi
              if ! chmod 600 -- "$marker_tmp" || ! mv -f -- "$marker_tmp" "$DEPLOYED_SHA_FILE"; then
                rm -f -- "$marker_tmp" || true
                return 1
              fi
            }
            probe_http() {
              local url="$1"
              local resolve_target="${2:-}"
              if [ -n "$resolve_target" ]; then
                curl -sS -o /dev/null -w "%{http_code}" --resolve "$resolve_target" "$url"
              else
                curl -sS -o /dev/null -w "%{http_code}" "$url"
              fi
            }
            sleep 5
            # O probe é local. Antes do TLS ele fala direto com o Gunicorn;
            # depois ele percorre o vhost HTTPS real, sem depender do DNS
            # externo nem enviar um header de proxy diretamente ao Gunicorn.
            # curl fica dentro de `if` para capturar o rc sem desligar `set -e`;
            # HTTP 200 com transferência incompleta (rc != 0) continua falhando.
            if [ "$TLS_ENABLED" = "true" ]; then
              if API_HTTP_CODE="$(probe_http "https://$HOST/healthz" "$HOST:443:127.0.0.1")"; then
                API_CURL_RC=0
              else
                API_CURL_RC=$?
              fi
            else
              if API_HTTP_CODE="$(probe_http "http://127.0.0.1:$API_PORT/healthz")"; then
                API_CURL_RC=0
              else
                API_CURL_RC=$?
              fi
            fi
            [ -n "$API_HTTP_CODE" ] || API_HTTP_CODE=000
            echo "${{ inputs.env_label }} api: curl_rc=$API_CURL_RC http_code=$API_HTTP_CODE"
            if [ "$API_CURL_RC" -eq 0 ] && [ "$API_HTTP_CODE" = "200" ]; then
              API_OK=1
              echo "${{ inputs.env_label }} api ok"
            elif [ "$STRICT" = "true" ]; then
              echo "${{ inputs.env_label }} api FAIL curl_rc=$API_CURL_RC http_code=$API_HTTP_CODE"
              pm2 logs "portal-api-${{ inputs.pm_suffix }}" --lines 30 --nostream 2>/dev/null || pm2 logs --lines 30 --nostream
              exit 1
            else
              echo "${{ inputs.env_label }} api warn curl_rc=$API_CURL_RC http_code=$API_HTTP_CODE"
            fi
            if WEB_HTTP_CODE="$(probe_http "http://127.0.0.1:$WEB_PORT/")"; then
              WEB_CURL_RC=0
            else
              WEB_CURL_RC=$?
            fi
            [ -n "$WEB_HTTP_CODE" ] || WEB_HTTP_CODE=000
            echo "${{ inputs.env_label }} web: curl_rc=$WEB_CURL_RC http_code=$WEB_HTTP_CODE"
            if [ "$WEB_CURL_RC" -eq 0 ] && [ "$WEB_HTTP_CODE" = "200" ]; then
              WEB_OK=1
              echo "${{ inputs.env_label }} web ok"
            elif [ "$STRICT" = "true" ]; then
              echo "${{ inputs.env_label }} web FAIL curl_rc=$WEB_CURL_RC http_code=$WEB_HTTP_CODE"
              exit 1
            else
              echo "${{ inputs.env_label }} web warn curl_rc=$WEB_CURL_RC http_code=$WEB_HTTP_CODE"
            fi

            # `.deployed-sha` é a fronteira de recuperação. Um probe verde
            # não é suficiente se o job SSH de deploy falhou, foi cancelado
            # ou se o checkout não é exatamente o SHA verificado.
            if [ "$API_OK" -eq 1 ] && [ "$WEB_OK" -eq 1 ]; then
              if [ "$DEPLOY_RESULT" != "success" ]; then
                echo "Marker preservado: deploy não terminou com sucesso (result=$DEPLOY_RESULT)."
              elif [ ! -d "$APP_DIR/.git" ]; then
                echo "Marker preservado: checkout $APP_DIR não existe após o deploy."
                [ "$STRICT" = "true" ] && exit 1
              else
                ACTUAL_SHA="$(git -C "$APP_DIR" rev-parse HEAD 2>/dev/null || true)"
                EXPECTED_COMMIT="$(git -C "$APP_DIR" rev-parse "$EXPECTED_SHA^{commit}" 2>/dev/null || true)"
                if [ -z "$ACTUAL_SHA" ] || [ "$ACTUAL_SHA" != "$EXPECTED_COMMIT" ]; then
                  echo "Marker preservado: smoke verde, mas checkout não é o SHA verificado ($ACTUAL_SHA != $EXPECTED_COMMIT)."
                  [ "$STRICT" = "true" ] && exit 1
                elif ! write_deployed_sha "$ACTUAL_SHA"; then
                  echo "ERRO: smoke verde, mas não foi possível promover $DEPLOYED_SHA_FILE."
                  [ "$STRICT" = "true" ] && exit 1
                else
                  echo "SHA Deploy registrado após smoke: $ACTUAL_SHA"
                fi
              fi
            else
              echo "Marker anterior preservado: pelo menos um probe não retornou rc=0 e HTTP 200; não promova um deploy parcial."
            fi
            # Diagnóstico de release no fim do probe: os probes acima dizem que
            # o web responde, mas NÃO dizem de qual release — e a resposta muda
            # a ação (release ruim = trocar o symlink; API ruim = olhar o
            # gunicorn). Imprimir o alvo do `current` e o `previous` torna a
            # informação disponível no run, sem custo e sem mudar o comportamento do probe.
            RELEASES_DIR="$APP_DIR/frontend/releases"
            if [ -d "$RELEASES_DIR" ]; then
              echo "release em andamento: current -> $(readlink -f "$RELEASES_DIR/current" 2>/dev/null || echo '(ausente)')"
              echo "release anterior:     previous -> $(readlink -f "$RELEASES_DIR/previous" 2>/dev/null || echo '(ausente)')"
              if [ -f "$RELEASES_DIR/current/.deployed-sha" ]; then
                echo "release servida: $(tr -d '[:space:]' < "$RELEASES_DIR/current/.deployed-sha") (esperado $EXPECTED_SHA)"
              fi
            fi
            pm2 status | grep portal || pm2 status
