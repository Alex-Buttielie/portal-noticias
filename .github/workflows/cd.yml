name: cd
on:
  push: { branches: [main] }
jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - run: docker build -t ghcr.io/${{ github.repository }}/web:${{ github.sha }} -f apps/web/Dockerfile .
      - run: docker build -t ghcr.io/${{ github.repository }}/api:${{ github.sha }} -f apps/api/Dockerfile .
      - run: docker push ghcr.io/${{ github.repository }}/web:${{ github.sha }}
      - run: docker push ghcr.io/${{ github.repository }}/api:${{ github.sha }}
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /srv/app
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            TAG=${{ github.sha }} docker compose -f infra/compose.prod.yml pull
            TAG=${{ github.sha }} docker compose -f infra/compose.prod.yml up -d --remove-orphans
            docker compose -f infra/compose.prod.yml exec -T api python manage.py migrate --noinput
            curl -sf http://localhost/api/health/ && echo "deploy ok"
