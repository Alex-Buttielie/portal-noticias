# Nova arquitetura de infra (análise 2026-09-03) — stack completo rodando
# numa única VPS via Docker Compose. Sem serviços gerenciados pagos (RDS,
# ElastiCache, S3): Postgres/Redis rodam em containers na própria VPS,
# custo adicional é só o que já é pago (a VPS), o que é o requisito nº1 do
# BRD seção 30 ("Custo de IA/infraestrutura" = risco Alto dado o ticket
# baixo de R$20-30/assinante).
#
# Uso: `docker compose --env-file .env.production up -d --build`
# Ver infra/DEPLOY.md para o passo a passo completo de provisionamento da VPS.

# Limite comum dos logs json-file para a variante Docker. Evita que stdout/stderr
# de containers que ficam 24/7 consumam o disco da VPS. Não afeta a topologia PM2.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DJANGO_DB_NAME:-brd_portal_noticias}
      POSTGRES_USER: ${DJANGO_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD:?defina DJANGO_DB_PASSWORD em .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DJANGO_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # Sem porta publicada para o host — só os outros serviços deste compose
    # (mesma rede `internal`) falam com o Redis; ele nunca fica exposto na
    # internet.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  web:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env.production
        required: false
    environment:
      DJANGO_DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DJANGO_CACHE_REDIS_URL: redis://redis:6379/2
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  celery-worker:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    # Mesma imagem do `web`, comando diferente — evita duplicar o
    # Dockerfile/lista de dependências entre API e worker (são o mesmo
    # código, só o processo de entrada muda).
    # Desativa o HEALTHCHECK do Dockerfile (curl :8000) — celery não expõe HTTP.
    #
    # Run 20260925-1020-observabilidade (achado B11): o healthcheck anterior era
    #   celery ... inspect ping --destination celery@$${HOSTNAME} | grep -q pong || exit 0
    # O `|| exit 0` garantia "healthy" com o worker MORTO ou com o broker fora
    # do ar — o pior tipo de healthcheck, porque transforma falha em cor verde.
    # Agora o código de saída É o resultado do ping, sem `grep` e sem parsing de
    # texto. O ping usa o app Celery do projeto (portanto o broker configurado
    # no ambiente) e `timeout=5` impede que o check vire um check de 30 s.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import sys, django; django.setup();
          from config.celery import app;
          resp = app.control.inspect(timeout=5).ping() or {};
          sys.stderr.write('celery-worker: %d worker(s) respondeu ao ping\n' % len(resp));
          sys.exit(0 if resp else 1)"
      interval: 30s
      timeout: 15s
      retries: 3
      # Um worker que está subindo importa as tasks e conecta no broker; antes
      # disso o ping é necessariamente negativo e `unhealthy` seria mentira.
      start_period: 90s
    entrypoint: []
    command: celery -A config worker --loglevel=info --concurrency=2 --max-tasks-per-child=100
    env_file:
      - path: .env.production
        required: false
    environment:
      DJANGO_DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DJANGO_CACHE_REDIS_URL: redis://redis:6379/2
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  celery-beat:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    # Desativa o HEALTHCHECK do Dockerfile — celery-beat não expõe HTTP.
    #
    # Run 20260925-1020-observabilidade (achado B11): o healthcheck anterior era
    #   celery ... inspect ping 2>&1 | head -1 | grep -q -v error || exit 0
    # dois problemas, um pior que o outro:
    #   * `|| exit 0` — verde garantido em qualquer falha;
    #   * `inspect ping` responde a partir dos WORKERS, não do beat. Este
    #     healthcheck media o serviço errado: o beat podia estar morto e o
    #     container ficar "healthy" porque outro processo (o worker) respondeu.
    #
    # O beat não tem introspecção confiável (mesma razão de
    # `check_celery_beat` no backend). O que este check afirma, e é tudo que ele
    # pode afirmar honestamente:
    #   1. o processo principal do container É o beat (é o PID 1, porque
    #      `entrypoint: []` deixa o `command` como PID 1) — logo não há beat
    #      morto com container "healthy";
    #   2. o arquivo de schedule avança: se existe e está mais velho que o
    #      limite, o agendador parou de gravar. Se ainda não existe, o check se
    #      apoia só no processo (o arquivo nasce no primeiro ciclo) — é
    #      deliberadamente leniente no boot para não produzir `unhealthy`
    #      falso.
    # O sinal DEFINITIVO de que o agendamento está acontecendo é outro e está em
    # `portal_celery_tasks_total` (alerta `PortalCelerySemExecucao`).
    #
    # Escrito em Python, e não em shell com variáveis: dentro de
    # `healthcheck.test` o Compose NÃO expande `$$` (ao contrário de `command`),
    # então um `$$(ls ...)` chega ao `/bin/sh` como PID seguido de parêntese —
    # erro de sintaxe garantido. Sem variável de shell, não há o que escapar.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os, sys, time, glob;
          cmdline = open('/proc/1/cmdline', 'rb').read().replace(bytes([0]), b' ').decode('utf-8', 'replace');
          sys.exit(1) if ' beat ' not in cmdline else None;
          arquivos = glob.glob(os.environ.get('BEAT_HEALTH_SCHEDULE_FILE', '/tmp/celerybeat-schedule*'));
          sys.exit(0) if not arquivos else None;
          idade = time.time() - max(os.path.getmtime(a) for a in arquivos);
          limite = float(os.environ.get('BEAT_HEALTH_MAX_AGE_SECONDS', '3600'));
          sys.stderr.write('celery-beat: schedule sem avanco ha %ds (limite %ds)\n' % (idade, limite)) and sys.exit(1) if idade > limite else sys.exit(0);"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    entrypoint: []
    # `--schedule` explícito: o default é `celerybeat-schedule` no diretório de
    # trabalho, e o healthcheck precisa de um caminho previsível. `/tmp` porque
    # o beat é o único consumidor e o container é recriável — a diretiva
    # `celery-beat@.service` do topology systemd é que faz o schedule
    # persistente (ver infra/systemd/celery-beat@.service).
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - path: .env.production
        required: false
    environment:
      DJANGO_DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DJANGO_CACHE_REDIS_URL: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?defina em .env.production}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?defina em .env.production}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - web
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env.production
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
    depends_on:
      - web
      - frontend
    networks:
      - internal

networks:
  # Rede isolada entre os containers deste projeto — só `caddy` publica
  # portas no host (80/443). Postgres/Redis/backend/worker nunca ficam
  # acessíveis diretamente pela internet, só por dentro dessa rede.
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  caddy_data:
  caddy_config:
