# Nova arquitetura de infra (análise 2026-09-03) — stack completo rodando
# numa única VPS via Docker Compose. Sem serviços gerenciados pagos (RDS,
# ElastiCache, S3): Postgres/Redis rodam em containers na própria VPS,
# custo adicional é só o que já é pago (a VPS), o que é o requisito nº1 do
# BRD seção 30 ("Custo de IA/infraestrutura" = risco Alto dado o ticket
# baixo de R$20-30/assinante).
#
# Uso: `docker compose --env-file .env.production up -d --build`
# Ver infra/DEPLOY.md para o passo a passo completo de provisionamento da VPS.

# Limite comum dos logs json-file para a variante Docker. Evita que stdout/stderr
# de containers que ficam 24/7 consumam o disco da VPS. Não afeta a topologia PM2.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DJANGO_DB_NAME:-brd_portal_noticias}
      POSTGRES_USER: ${DJANGO_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD:?defina DJANGO_DB_PASSWORD em .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DJANGO_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # Sem porta publicada para o host — só os outros serviços deste compose
    # (mesma rede `internal`) falam com o Redis; ele nunca fica exposto na
    # internet.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  web:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env.production
        required: false
    environment:
      DJANGO_DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DJANGO_CACHE_REDIS_URL: redis://redis:6379/2
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  celery-worker:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    # Mesma imagem do `web`, comando diferente — evita duplicar o
    # Dockerfile/lista de dependências entre API e worker (são o mesmo
    # código, só o processo de entrada muda).
    # Desativa o HEALTHCHECK do Dockerfile (curl :8000) — celery não expõe HTTP.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$${HOSTNAME} 2>&1 | grep -q pong || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    entrypoint: []
    command: celery -A config worker --loglevel=info --concurrency=2 --max-tasks-per-child=100
    env_file:
      - path: .env.production
        required: false
    environment:
      DJANGO_DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DJANGO_CACHE_REDIS_URL: redis://redis:6379/2
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  celery-beat:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    # Desativa o HEALTHCHECK do Dockerfile — celery-beat não expõe HTTP.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping 2>&1 | head -1 | grep -q -v error || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    entrypoint: []
    command: celery -A config beat --loglevel=info
    env_file:
      - path: .env.production
        required: false
    environment:
      DJANGO_DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DJANGO_CACHE_REDIS_URL: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?defina em .env.production}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?defina em .env.production}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - web
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env.production
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
    depends_on:
      - web
      - frontend
    networks:
      - internal

networks:
  # Rede isolada entre os containers deste projeto — só `caddy` publica
  # portas no host (80/443). Postgres/Redis/backend/worker nunca ficam
  # acessíveis diretamente pela internet, só por dentro dessa rede.
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  caddy_data:
  caddy_config:
