# Override de desenvolvimento (acompanha docker-compose.homolog.yml).
#
# Uso (na VPS ou local com Docker):
#   docker compose --env-file .env.dev -p brd-dev -f docker-compose.yml \
#     -f docker-compose.dev.yml up -d --build
#
# Copie `.env.production.example` para `.env.dev` e troque os domínios
# (ex.: dev-api.seu-dominio.com.br) + credenciais. NUNCA commitar o
# `.env.dev` real (ver .gitignore).
#
# O que este override muda em relação à produção:
# - publica 8081/8444 no host (convive com prod 80/443 e homolog 8080/8443
#   na mesma VPS);
# - reduz workers do Celery para 1.

services:
  caddy:
    ports:
      - "8081:80"
      - "8444:443"

  celery-worker:
    command: celery -A config worker --loglevel=info --concurrency=1 --max-tasks-per-child=100
