# Tuning conservador para o PostgreSQL nativo da VPS de 4 GB.
# Este arquivo NÃO é aplicado automaticamente. Copie-o para um include do
# cluster e valide os valores com SHOW antes/depois de reiniciar o serviço.
#
# Exemplo em Debian/Ubuntu (ajuste 16 para a versão instalada):
#   sudo install -m 0644 infra/postgres-tuning.conf \
#     /etc/postgresql/16/main/conf.d/portal-tuning.conf
#   sudo -u postgres psql -Atc 'SHOW config_file'
#   sudo -u postgres psql -Atc 'SELECT pg_reload_conf()'
#   sudo systemctl restart postgresql
#   sudo -u postgres psql -x -c 'SHOW shared_buffers' -c 'SHOW effective_cache_size' \
#     -c 'SHOW work_mem' -c 'SHOW maintenance_work_mem'

# Memória realmente alocada como cache de páginas. 1 GB deixa espaço para
# Django/Next, Redis, Nginx, PM2 e as demais stacks 24/7 desta VPS.
shared_buffers = 1GB

# Estimativa (não reserva de memória) da memória de cache disponível para o planner.
effective_cache_size = 3GB

# Limite por operação de sort/hash; evita o multiplicador perigoso de queries
# paralelas sobre o default de 4 MB sem também permitir centenas de MB por
# sessão. Não é um orçamento global: cada operação concorrente pode consumir
# seu próprio limite.
work_mem = 8MB

# Uso temporário durante VACUUM, CREATE INDEX e outras manutenções; não fica
# alocado o tempo inteiro.
maintenance_work_mem = 256MB
