# Rotação do log de acesso da borda (run 20260925-1020-observabilidade).
#
# O `log_format portal_acesso` (JSON, com `request_id` e `upstream_release`) é
# definido em `infra/nginx/http-cache.conf` e cada site escreve no seu arquivo:
#   /var/log/nginx/portal-dev.access.log
#   /var/log/nginx/portal-homolog.access.log
#   /var/log/nginx/portal-prod.access.log
# O glob abaixo cobre os três e qualquer ambiente novo, sem editar este arquivo.
#
# Instalar em /etc/logrotate.d/nginx-portal (modo 0644, owner root). Validar com
#   sudo logrotate -d /etc/logrotate.d/nginx-portal
# (modo debug: não rotaciona nada) e o modo real com
#   sudo logrotate -f /etc/logrotate.d/nginx-portal
# O log do Collector (Alloy) e o do watchdog de backup têm policies próprias.
/var/log/nginx/portal-*.access.log {
    daily
    rotate 30
    # Teto por arquivo: num pico de tráfego ou de incidente o volume diário
    # pode passar de `rotate` dias. Com 30 arquivos de 50 MB o pior caso fica
    # perto de 1,5 GB por ambiente — dimensione contra o disco antes de subir.
    maxsize 50M
    compress
    delaycompress
    missingok
    notifempty
    # `copytruncate` e não `postrotate ... nginx -s reopen`: o Nginx mantém o
    # descritor aberto no master e quem escreve nele são os workers. Com
    # `create`/`rename` o processo em produção continuaria escrevendo no
    # arquivo já rotacionado (e o próximo start perderia a permissão) — o
    # mesmo motivo pelo qual `infra/logrotate/pg-backup.conf` usa copytruncate.
    # Custo: uma janela mínima de perda em troca de nunca derrubar o acesso.
    copytruncate
    su root adm
    create 0640 www-data adm
}
