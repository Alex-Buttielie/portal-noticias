/var/log/pg_backup*.log {
    daily
    rotate 14
    maxsize 20M
    compress
    delaycompress
    missingok
    notifempty
    # O cron abre o arquivo a cada execução; copytruncate preserva owner e
    # modo do arquivo já criado pelo operador, evitando que a rotação deixe
    # o próximo backup sem permissão de append.
    copytruncate
    su root root
}
