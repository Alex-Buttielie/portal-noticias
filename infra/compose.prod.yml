services:
  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro", "/etc/letsencrypt:/etc/letsencrypt:ro"]
    depends_on: [web, api]
  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/web:${TAG:-latest}
    environment: { NODE_ENV: production }
  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/api:${TAG:-latest}
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
    volumes: ["/srv/app/media:/app/media"]
  redis:
    image: redis:7-alpine
    volumes: ["redis_data:/data"]
volumes: { redis_data: {} }
