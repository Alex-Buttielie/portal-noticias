# Nginx canônico — DEV (idêntico ao ativo na VPS em
# /etc/nginx/sites-available/portal-dev).
#
# HTTP puro (sem TLS): os domínios portal-noticias.com.br ainda não resolvem
# em DNS público, então não há como emitir certificado. Quando o DNS existir,
# evoluir para bloco 443 + certbot (ver seção TLS em infra/DEPLOY.md).
#
# Regras que o portal assume (se divergirem, o portal quebra):
# 1. `location /api/` preserva o path completo (`proxy_pass` SEM barra
#    final): o Django serve `/api/...` e o frontend chama `{ORIGEM}/api/...`.
# 2. `location /` vai para o Next.js.
# Aplicar na VPS: sudo cp infra/nginx/portal-dev.conf
#   /etc/nginx/sites-available/portal-dev && sudo nginx -t && sudo systemctl reload nginx
#
# P1-4 (run 20260923-1230): gzip + upstream/keepalive + proxy_cache
# feed/radar + estático/mídia direto + limit_req + read_timeout 45s.
# ATENÇÃO — zonas compartilhadas (`limit_req_zone`, `proxy_cache_path`)
# ficam no `http {}` GLOBAL do Nginx da VPS (/etc/nginx/nginx.conf), NÃO
# neste arquivo de site (nginx -t falha se declaradas aqui). Ver bloco
# comentado no topo de cada seção abaixo com o comando exato a adicionar
# uma vez no http {}.

# --- http {} global da VPS (adicionar UMA vez em /etc/nginx/nginx.conf) ---
# Chave do limit de escrita: só POST conta (GET de leitura — feed, radar —
# nunca é limitado aqui; crawler legítimo não toma 503). Chave vazia =
# limit_req não aplica (comportamento documentado do Nginx).
# map $request_method $limit_post { default ""; POST $binary_remote_addr; }
# limit_req_zone $limit_post zone=escrita_publica:10m rate=20r/m;
# limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
# proxy_cache_path /var/cache/nginx/feed levels=1:2 keys_zone=feed_cache:10m max_size=200m inactive=120s use_temp_path=off;

upstream portal_api_dev {
  server 127.0.0.1:5101;
  keepalive 32;
}

server {
  listen 80;
  server_name dev.portal-noticias.com.br;

  # Security headers — defesa em profundidade (sempre com `always` para cobrir 4xx/5xx).
  # X-Frame-Options DENY também é enviado pelo Django (X_FRAME_OPTIONS) quando
  # DEBUG=False; duplicar aqui com `always` é inofensivo e cobre respostas não-Django
  # (ex.: 50x do Nginx ou /healthz sem passar pelo Django).
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # HSTS: Django já envia SECURE_HSTS_SECONDS quando DEBUG=False e TLS existe;
  # não enviar aqui em HTTP puro. Quando houver bloco 443 + certbot, descomente:
  # add_header Strict-Transport-Security "max-age=2592000; includeSubDomains" always;

  # Compressão: API retorna JSON volumoso (feed paginado). Tipos curados —
  # sem imagens/vídeos (já comprimidos; gzip só gasta CPU).
  # brotli fica como comentário: exige ngx_brotli, ausente no nginx-core da VPS.
  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_vary on;
  gzip_proxied any;
  # brotli on; brotli_types text/plain text/css application/json application/javascript text/xml;

  # Estático do Django (collectstatic → backend/staticfiles; WhiteNoise
  # continua como fallback se o Nginx não tiver o volume montado).
  # NOTA `add_header`: diretiva em location SUBSTITUI todas as do server
  # (pegadinha clássica do Nginx) — por isso os security headers se repetem
  # aqui; sem isso o estático perderia X-Frame-Options etc.
  # Sem `expires` de propósito: ele emite `Cache-Control: max-age=...` que
  # duplicaria o header explícito abaixo. WhiteNoise continua como fallback.
  # Path real na VPS: /home/apps/portal-dev/backend/staticfiles.
  location /static/ {
    alias /home/apps/portal-dev/backend/staticfiles/;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    access_log off;
  }

  # Uploads (FileField credenciamento → backend/media/credenciamento/...;
  # servidos SÓ via endpoint autenticado FileResponse — credenciamento/
  # views.py — nunca via URL pública; o Nginx aqui é cinto duplo: nega
  # .py/.sh/.php para o caso de alguém depositar um executável).
  # Path real na VPS: /home/apps/portal-dev/backend/media.
  # Uploads sem hash no nome (nome original) — SEM `immutable`, max-age
  # curto; mesma regra do `add_header` acima (security headers repetidos).
  location /media/ {
    alias /home/apps/portal-dev/backend/media/;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control "public, max-age=604800" always;
    location ~* \.(py|sh|php|pl|cgi)$ {
      return 404;
    }
    access_log off;
  }

  location = /healthz {
    proxy_pass http://portal_api_dev;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
  }

  location /api/auth/ {
    limit_req zone=auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://portal_api_dev;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  # Cache de borda local (run 20260923-1230 P1-4): SOMENTE as listagens
  # públicas que não variam por usuário — exatamente as que o cache de app
  # cobre em `feed/views.py` (lista, urgentes, mais-lidas, home, destaques).
  # `exibir_publicidade` saiu do feed (vai via GET /api/gating/status).
  #
  # ALLOWLIST explícita, e não um `^/api/feed/` amplo: o regex amplo
  # capturaria `feed/busca/historico/` (padrão POR USUÁRIO/SESSÃO — vazaria
  # o histórico de busca entre visitantes, porque a chave de cache não tem
  # componente de usuário) e `feed/interacoes/` (POST público sem throttle
  # DRF — perderia o `limit_req` de `location /api/`, já que regex location
  # tem precedência sobre prefix location). Ambos ficam de fora do cache e
  # voltam a ser tratados por `location /api/`.
  #
  # Chave sem cookie/Authorization (método + host + URI); requisição
  # autenticada nunca serve do cache nem o popula (bypass + no_cache).
  # TTL 45s = mesmo do cache de app (FEED_CACHE_TTL_SEGUNDOS, run P1-A).
  location ~ ^/api/(feed/$|feed/(urgentes|mais-lidas|home|destaques|busca|busca/populares|busca/autocomplete)/$|radar/tendencias/$) {
    proxy_cache feed_cache;
    proxy_cache_methods GET;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 45s;
    proxy_cache_bypass $http_authorization$cookie_sessionid$cookie_csrftoken;
    proxy_no_cache $http_authorization$cookie_sessionid$cookie_csrftoken;
    # Thundering herd: 1 request popula, demais esperam (não N no Gunicorn).
    proxy_cache_lock on;
    # Upstream errou/lento: serve o stale em vez de 500/502/503/504.
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header X-Cache-Status $upstream_cache_status always;
    # Mesma regra do `add_header` de /static/: location com add_header
    # próprio perde os security headers do server — repetir aqui.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    proxy_pass http://portal_api_dev;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 45s;
    proxy_read_timeout 45s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  # Escrita pública (POST anônimo: cadastro, lista de espera, comunidade):
  # defesa em profundidade além do throttle DRF `escrita_publica` 20/min
  # (config/throttling.py) — mesma taxa aqui.
  location /api/ {
    limit_req zone=escrita_publica burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://portal_api_dev;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 45s;
    # 45s = timeout do gunicorn (backend/gunicorn.conf.py) — o Nginx
    # espera o máximo que o Gunicorn permite, sem cortar antes (502/504).
    # Sem caminho HTTP que precise de mais: POST
    # /api/admin/robos/executar/ responde 202 imediato (thread
    # background; ver catalogo_noticias/robos_views.py).
    proxy_read_timeout 45s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location / {
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }
}
