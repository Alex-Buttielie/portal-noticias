# Nginx canônico — DEV (idêntico ao ativo na VPS em
# /etc/nginx/sites-available/portal-dev).
#
# HTTP puro (sem TLS): os domínios portal-noticias.com.br ainda não resolvem
# em DNS público, então não há como emitir certificado. Quando o DNS existir,
# evoluir para bloco 443 + certbot (ver seção TLS em infra/DEPLOY.md).
#
# Regras que o portal assume (se divergirem, o portal quebra):
# 1. `location /api/` preserva o path completo (`proxy_pass` SEM barra
#    final): o Django serve `/api/...` e o frontend chama `{ORIGEM}/api/...`.
# 2. `location /` vai para o Next.js.
# Aplicar na VPS: sudo cp infra/nginx/portal-dev.conf
#   /etc/nginx/sites-available/portal-dev && sudo nginx -t && sudo systemctl reload nginx

server {
  listen 80;
  server_name dev.portal-noticias.com.br;

  # Security headers — defesa em profundidade (sempre com `always` para cobrir 4xx/5xx).
  # X-Frame-Options DENY também é enviado pelo Django (X_FRAME_OPTIONS) quando
  # DEBUG=False; duplicar aqui com `always` é inofensivo e cobre respostas não-Django
  # (ex.: 50x do Nginx ou /healthz sem passar pelo Django).
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # HSTS: Django já envia SECURE_HSTS_SECONDS quando DEBUG=False e TLS existe;
  # não enviar aqui em HTTP puro. Quando houver bloco 443 + certbot, descomente:
  # add_header Strict-Transport-Security "max-age=2592000; includeSubDomains" always;

  # Rate limiting: limit_req_zone deve ser definido no http {} global
  # (ex.: limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;).
  # Descomente `limit_req` em /api/auth/ quando a zona existir.

  location = /healthz {
    proxy_pass http://127.0.0.1:5101;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
  }

  location /api/auth/ {
    # limit_req zone=auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:5101;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /api/admin/robos/executar/ {
    proxy_pass http://127.0.0.1:5101;
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:5101;
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location / {
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }
}
