# Nginx canônico — DEV (idêntico ao ativo na VPS em
# /etc/nginx/sites-available/portal-dev).
#
# TLS parametrizado: antes de instalar este arquivo, substitua o marcador
# __DOMAIN_FRONTEND__ pelo hostname real de DEV. O certificado é de Certbot
# (Let's Encrypt) e o caminho deriva do nome do lineage. `DOMAIN_API`
# pertence à variante Docker/Caddy; na topologia PM2 o frontend e a API
# compartilham este host e `/api/`.
#
# Regras que o portal assume (se divergirem, o portal quebra):
# 1. `location /api/` preserva o path completo (`proxy_pass` SEM barra
#    final): o Django serve `/api/...` e o frontend chama `{ORIGEM}/api/...`.
# 2. `location /` vai para o Next.js.
# 3. TODO upstream recebe `X-Forwarded-For $proxy_add_x_forwarded_for` (D2). O
#    leitor do lado Django (`backend/config/proxies.py::identificar_cliente`) só
#    usa o ÚLTIMO elemento da cadeia e só confia no header quando quem abriu a
#    conexão é o loopback ou uma rede declarada; `$proxy_add_x_forwarded_for`
#    garante esse último elemento = `$remote_addr` (o cliente real deste salto)
#    aconteça o que acontecer com o header que o cliente enviou. Sem esta linha
#    o balde do rate limit volta a ser escolhido pelo próprio cliente (achado
#    MAJOR-1). NUNCA substitua por `$http_x_forwarded_for`: repassaria o header
#    do cliente sem tocá-lo. Se um CDN entrar na frente depois, isto NÃO basta
#    sozinho — veja a seção de XFF de `infra/DEPLOY.md` (módulo `realip` com
#    `set_real_ip_from` do prefixo do CDN), senão todo mundo aparece com o IP do
#    CDN. `scripts/observability/validar-infra.sh` falha se a diretiva sumir.
# Aplicar na VPS: sudo cp infra/nginx/portal-dev.conf
#   /etc/nginx/sites-available/portal-dev && sudo nginx -t && sudo systemctl reload nginx
#
# P1-4 (run 20260923-1230): gzip + upstream/keepalive + cache/rate opcionais
# de feed/radar + estático/mídia público + read_timeout 60s.
#
# `map`, `limit_req_zone` e `proxy_cache_path` não são válidos neste arquivo
# de site: eles ficam versionados em `infra/nginx/http-cache.conf` e devem
# ser incluídos uma vez dentro do `http {}` global da VPS. Os snippets de
# location (`portal-location-*.conf`) também são opcionais: enquanto não
# estiverem instalados, estes arquivos fazem `nginx -t` sem zones e deixam
# cache/rate desligados em vez de deixar o reload inválido. A ordem de
# instalação e os comandos estão em `infra/DEPLOY.md`.
#
# O conf é fail-closed para a mídia: `credenciamento/` nunca é servido pelo
# Nginx; documentos ficam somente no `DocumentoView` autenticado do Django.

upstream portal_api_dev {
  server 127.0.0.1:5101;
  keepalive 32;
}

# HTTP: ACME e o probe local de saúde são as únicas exceções ao redirect.
server {
  listen 80;
  server_name __DOMAIN_FRONTEND__;
  # Log de acesso da borda em JSON (run 20260925-1020-observabilidade). É o
  # que o Grafana Alloy faz tail e o que permite seguir um `request_id` do
  # browser até a linha do log do Django. O `log_format` e a
  # `$portal_request_id` vêm de `infra/nginx/http-cache.conf`, que por isso
  # deixou de ser opcional: sem aquele include, `nginx -t` falha e o
  # deploy-hook de certificado não recarrega nada.
  access_log /var/log/nginx/portal-dev.access.log portal_acesso;

  # HTTP-01 do Certbot precisa chegar em claro; este location tem precedência
  # sobre o redirect genérico abaixo. O webroot deve existir antes de pedir o
  # certificado (ver infra/DEPLOY.md, seção "Ativando TLS").
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  # O health check interno continua acessível em HTTP durante a migração. O
  # forwarded proto é https para que Django, já com SECURE_SSL_REDIRECT=true,
  # não redirecione o probe para fora da VPS. O acesso externo é negado.
  location = /healthz {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://portal_api_dev;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Request-ID $portal_request_id;
  }

  # Liveness e readiness por HTTP plano, só para probe local: o mesmo motivo do
  # `/healthz` acima (forwarded proto https para o Django não redirecionar o
  # probe com SECURE_SSL_REDIRECT=true) e o mesmo `allow/deny`. O check
  # externo é feito por HTTPS (server 443), não por aqui.
  location = /livez {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://portal_api_dev;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Request-ID $portal_request_id;
  }

  location = /readyz {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://portal_api_dev;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Request-ID $portal_request_id;
  }

  # `/health-detail` e `/metrics` NÃO ganham rota em HTTP plano: caem no
  # redirect genérico e, ao chegarem em HTTPS, passam pelo gate privado. Não há
  # nenhum caso legítimo de diagnóstico em claro.

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS: a aplicação e o proxy reverso só são ativados depois de o certificado
# existir e `nginx -t` passar. Não copie este arquivo com os marcadores.
server {
  listen 443 ssl;
  server_name __DOMAIN_FRONTEND__;
  # Log de acesso da borda em JSON (run 20260925-1020-observabilidade). É o
  # que o Grafana Alloy faz tail e o que permite seguir um `request_id` do
  # browser até a linha do log do Django. O `log_format` e a
  # `$portal_request_id` vêm de `infra/nginx/http-cache.conf`, que por isso
  # deixou de ser opcional: sem aquele include, `nginx -t` falha e o
  # deploy-hook de certificado não recarrega nada.
  access_log /var/log/nginx/portal-dev.access.log portal_acesso;

  ssl_certificate /etc/letsencrypt/live/__DOMAIN_FRONTEND__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMAIN_FRONTEND__/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Security headers — defesa em profundidade (sempre com `always` para cobrir 4xx/5xx).
  # X-Frame-Options DENY também é enviado pelo Django (X_FRAME_OPTIONS) quando
  # DEBUG=False; duplicar aqui com `always` é inofensivo e cobre respostas não-Django
  # (ex.: 50x do Nginx ou /healthz sem passar pelo Django).
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # HSTS: Django já envia SECURE_HSTS_SECONDS quando DEBUG=False e TLS existe;
  # não duplicar aqui por padrão. Se o operador quiser um header também no
  # Nginx, descomente somente depois de confirmar includeSubDomains:
  # add_header Strict-Transport-Security "max-age=2592000; includeSubDomains" always;

  # Compressão: API retorna JSON volumoso (feed paginado). Tipos curados —
  # sem imagens/vídeos (já comprimidos; gzip só gasta CPU).
  # brotli fica como comentário: exige ngx_brotli, ausente no nginx-core da VPS.
  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_vary on;
  gzip_proxied any;
  # brotli on; brotli_types text/plain text/css application/json application/javascript text/xml;

  # Estático do Django (collectstatic → backend/staticfiles; WhiteNoise
  # continua como fallback se o Nginx não tiver o volume montado).
  # NOTA `add_header`: diretiva em location SUBSTITUI todas as do server
  # (pegadinha clássica do Nginx) — por isso os security headers se repetem
  # aqui; sem isso o estático perderia X-Frame-Options etc.
  # Sem `expires` de propósito: ele emite `Cache-Control: max-age=...` que
  # duplicaria o header explícito abaixo. WhiteNoise continua como fallback.
  # Path real na VPS: /home/apps/portal-dev/backend/staticfiles.
  location /static/ {
    alias /home/apps/portal-dev/backend/staticfiles/;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    access_log off;
  }

  # MEDIA_ROOT contém uploads de FileField do app de credenciamento.
  # O grep dos models encontrou `foto` e `documento` sob a mesma árvore
  # `credenciamento/<user_id>/`; não é seguro inferir privacidade pela extensão.
  # Portanto NÃO existe alias do volume inteiro: esta subtree é negada e o
  # documento continua acessível apenas pelo DocumentoView autenticado.
  # O único subtree público futuro é `media/public/`; arquivos nele devem
  # ser revisados como públicos antes de serem depositados.
  location = /media {
    return 404;
  }

  location = /media/ {
    return 404;
  }

  location = /media/credenciamento {
    return 404;
  }

  location ^~ /media/credenciamento/ {
    return 404;
  }

  location /media/public/ {
    alias /home/apps/portal-dev/backend/media/public/;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control "public, max-age=604800" always;
    access_log off;
  }

  location = /healthz {
    proxy_pass http://portal_api_dev;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $portal_request_id;
  }

  # --- Observabilidade (run 20260925-1020-observabilidade) ----------------
  # `/livez` e `/readyz` são PÚBLICOS por contrato do backend
  # (backend/config/observability_views.py): o primeiro não toca banco, cache
  # nem Celery; o segundo responde só `{"status","ready"}` / 503, sem
  # `str(exc)`, sem host e sem o nome do check que falhou. Precisam de rota
  # própria aqui porque, sem estas locations, caem em `location /` (Next.js) e
  # o check externo do Better Stack recebe 404 de um portal saudável.
  #
  # Os security headers do server são repetidos porque `add_header` em location
  # SUBSTITUI o conjunto do server (mesma razão já documentada em /static/).
  location = /livez {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    proxy_pass http://portal_api_dev;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $portal_request_id;
  }

  location = /readyz {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    proxy_pass http://portal_api_dev;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $portal_request_id;
  }

  # Diagnóstico privado (`/health-detail`) e exposição Prometheus
  # (`/metrics`) num ÚNICO location, de propósito: são a mesma política de
  # acesso e, em locations separados, uma edição futura poderia esquecer um
  # dos dois. O gate tem duas camadas e nenhuma delas degrada em silêncio
  # (variáveis definidas em infra/nginx/http-cache.conf, obrigatórias):
  #   1. origem de rede — `$observability_origem_confiavel`, declarado no `geo`
  #      daquele arquivo (loopback; proxies extras entram como CIDR lá);
  #   2. origem do pedido — `Authorization: Bearer <token>` conferido contra
  #      `__OBS_TOKEN_ESPERADO__`, que o operador substitui ao instalar. Com o
  #      marcador no lugar, NENHUM bearer autoriza: o acesso externo fica
  #      fechado e o marcador não é uma credencial que abre a porta.
  #
  # Negado responde 404, o mesmo corpo de "rota inexistente" que o app devolve
  # em `observability_views._negado`: um 403 confirmaria que existe um
  # diagnóstico ali, e é a existência dele que não pode vazar. A defesa é em
  # camadas — o app repete as duas regras (loopback, redes declaradas, staff ou
  # token) com `compare_digest`, e por isso o token é o mesmo valor nos dois
  # lados (`OBSERVABILITY_METRICS_TOKEN` no ambiente da aplicação).
  location ~ ^/(health-detail|metrics)$ {
    if ($observability_acesso = 0) {
      return 404;
    }
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    proxy_pass http://portal_api_dev;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $portal_request_id;
  }

  # Cadastro é escrita pública (DRF 20/min), não login/recuperação
  # (auth sensível 10/min). A location exata tem precedência sobre /api/auth/.
  location = /api/auth/cadastro/ {
    include /etc/nginx/portal-location-write*.conf;
    proxy_pass http://portal_api_dev;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $portal_request_id;
  }

  location /api/auth/ {
    include /etc/nginx/portal-location-auth*.conf;
    proxy_pass http://portal_api_dev;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $portal_request_id;
  }

  # Interações é POST público (AllowAny). A location exata não pode ser
  # capturada pelo regex de cache; por isso usa explicitamente a mesma
  # proteção de escrita pública (20/min) do location /api/.
  location = /api/feed/interacoes/ {
    include /etc/nginx/portal-location-write*.conf;
    proxy_pass http://portal_api_dev;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $portal_request_id;
  }

  # Cache de borda local (run 20260923-1230 P1-4): SOMENTE as listagens
  # públicas que não variam por usuário — exatamente as que o cache de app
  # cobre em `feed/views.py` (lista, urgentes, mais-lidas, home, destaques).
  # `exibir_publicidade` saiu do feed (vai via GET /api/gating/status).
  #
  # ALLOWLIST explícita, e não um `^/api/feed/` amplo: o regex amplo
  # capturaria `feed/busca/historico/` (padrão POR USUÁRIO/SESSÃO — vazaria
  # o histórico de busca entre visitantes, porque a chave de cache não tem
  # componente de usuário) e `feed/interacoes/` (POST público sem throttle
  # DRF — perderia o `limit_req` de `location /api/`, já que regex location
  # tem precedência sobre prefix location). Ambos ficam de fora do cache e
  # voltam a ser tratados por `location /api/`.
  #
  # Chave sem cookie/Authorization (método + host + URI); requisição
  # autenticada nunca serve do cache nem o popula (bypass + no_cache).
  # TTL 45s = mesmo do cache de app (FEED_CACHE_TTL_SEGUNDOS, run P1-A).
  location ~ ^/api/(feed/$|feed/(urgentes|mais-lidas|home|destaques|busca|busca/populares|busca/autocomplete)/$|radar/tendencias/$) {
    # A allowlist de URI é exata; o cache fragment também limita a operação
    # a GET/HEAD. Se um método de escrita alcançar esta location por uma
    # futura rota, o map o impede de ser cacheado e o include de escrita
    # ainda aplica o limite público.
    include /etc/nginx/portal-location-cache*.conf;
    include /etc/nginx/portal-location-write*.conf;
    # Mesma regra do `add_header` de /static/: location com add_header
    # próprio perde os security headers do server — repetir aqui.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Release/estado também na resposta servida do CACHE de borda (critério 2).
    # O `add_header` acima já quebrou a herança do server, e quem consome a
    # borda (coletor, alerta de degradação, suporte) precisa ler o mesmo
    # release que o app gravou — inclusive quando a resposta veio do cache e
    # não do Django. O Nginx não inventa valor: com o header ausente do
    # upstream, o `add_header` de valor vazio simplesmente não é emitido
    # (header ausente é melhor que header errado) e o log técnico da borda
    # mostra o valor real em `upstream_release`.
    add_header X-Release $upstream_http_x_release always;
    add_header X-Environment $upstream_http_x_environment always;
    add_header X-Operational-State $upstream_http_x_operational_state always;
    proxy_pass http://portal_api_dev;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $portal_request_id;
  }

  # Escrita pública (POST anônimo: cadastro, lista de espera, comunidade):
  # defesa em profundidade além do throttle DRF `escrita_publica` 20/min
  # (config/throttling.py) — mesma taxa aqui.
  location /api/ {
    include /etc/nginx/portal-location-write*.conf;
    proxy_pass http://portal_api_dev;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    # 60s é o default seguro enquanto o endpoint 202+background não for
    # ancestral comprovado do ref implantado. Só depois desse commit o
    # par pode ser reduzido para 45s (Gunicorn + Nginx) na mesma mudança.
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $portal_request_id;
  }

  location / {
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    # Mesmo par do upstream da API, e pelo mesmo motivo (regra 3 do cabeçalho):
    # o Next.js também não pode receber um `X-Forwarded-For` que o cliente
    # escolheu. Sem o par, o header do cliente chega intacto a um processo que
    # não tem a leitura defensiva que o Django tem em `config/proxies.py`.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $portal_request_id;
  }
}
