# P1-4 — escrita pública: 20 req/min por IP, burst 20.
# A key global `$limit_post` é vazia para GET/HEAD e usa o IP para POST;
# a zone é declarada em http-cache.conf, no http {} global.
# Copie este arquivo para /etc/nginx/portal-location-write.conf somente
# depois da instalação global; o include glob no site é no-op sem ele.
limit_req zone=escrita_publica burst=20 nodelay;
limit_req_status 429;
