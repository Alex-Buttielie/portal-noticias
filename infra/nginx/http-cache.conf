# P1-4 — configuração global de cache/rate do Nginx.
# Run 20260925-1020-observabilidade: acresceu o bloco de observabilidade
# (correlação de `X-Request-ID`, gate dos endpoints privados e `log_format`
# JSON da borda), que é OBRIGATÓRIO para os sites desta run.
#
# INSTALE UMA VEZ dentro do bloco `http {}` da VPS, por exemplo:
#   http {
#       include /etc/nginx/http-cache.conf;
#       include /etc/nginx/sites-enabled/*;
#   }
#
# Este arquivo NÃO é um include de site: `map`, `geo`, `log_format`,
# `limit_req_zone` e `proxy_cache_path` só são válidos no contexto `http`. Os
# arquivos `portal-location-*.conf` são activados separadamente dentro dos
# locations; enquanto eles não forem instalados, os sites continuam válidos,
# mas cache/rate ficam deliberadamente inativos (fail-safe para o reload).
#
# `map` deixa a chave de escrita vazia para GET/HEAD; nesse caso a zone de
# escrita não aplica o limite. O cache só pode ser ativado depois deste
# arquivo estar instalado (e os snippets de location, depois deste include).
#
# ---------------------------------------------------------------------------
# Observabilidade (run 20260925-1020-observabilidade)
# ---------------------------------------------------------------------------
# ESTE ARQUIVO É OBRIGATÓRIO a partir desta run, não mais opcional: os sites
# `portal-{dev,homolog,prod}.conf` referenciam as variáveis defined aqui
# (`$portal_request_id`, `$observability_acesso`, `log_format portal_acesso`).
# Sem este include, `nginx -t` falha com "unknown variable" — falha ruidosa e
# na configuração certa, e o deploy-hook de certificado não recarrega nada.
# A ordem de instalação é a mesma já descrita em `infra/DEPLOY.md`:
#   http { include /etc/nginx/http-cache.conf; include /etc/nginx/sites-enabled/*; }
#
# Marcadores: `__OBS_TOKEN_ESPERADO__` precisa ser substituído pelo operador ao
# instalar (fora do repositório, o mesmo caminho do domínio). Enquanto ele
# estiver no lugar, nenhum `Authorization: Bearer` autoriza o acesso externo
# aos endpoints privados — o token que o app confere é o mesmo valor, mas o
# marcador em si nunca abre a porta. `scripts/observability/validar-infra.sh`
# acusa o marcador não substituído em configuração já instalada.

# --- Correlação de requisição (critérios 1 e 2) ----------------------------
# O backend aceita e normaliza o `X-Request-ID` do cliente
# (`config/middleware.py::normalizar_request_id`: até 64 caracteres
# imprimíveis; qualquer coisa fora disso vira UUID4 no app). O Nginx NÃO pode
# sobrescrever esse valor com o `$request_id` nativo: doing isso quebrava a
# correlação browser → nginx → Django já no primeiro salto, porque o app
# registrava no log o ID que ele mesmo tinha descartado.
#
# A mesma variável `$portal_request_id` alimenta o `proxy_set_header` E o
# `log_format` de acesso: log de borda e log do app passam a mostrar o mesmo
# ID, que é o que o operador pesquisa para seguir um 500 até a linha do
# traceback. Sem header válido (ausente, vazio, com caractere inválido) o
# Nginx gera o seu, e o app valida de novo e o substitui se necessário.
map $http_x_request_id $portal_request_id {
    default $request_id;
    "~^[A-Za-z0-9._:+@/-]{1,64}$" $http_x_request_id;
}

# --- Autorização dos endpoints privados (critérios 9 e 22) -----------------
# `geo` é a allowlist de origem de rede: loopback (o coletor e o `curl` do
# operador rodam na própria VPS) e, se o operador precisar, redes de proxy
# explícitas — acrescente a linha `<CIDR> 1;` neste bloco ao instalar. A lista
# é explícita e nunca "qualquer rede privada": atrás de proxy o tráfego
# público também chega com IP privado, e tratar isso como confiança publicaria
# o diagnóstico para a internet.
geo $observability_origem_confiavel {
    default 0;
    127.0.0.0/8 1;
    ::1/128 1;
}

# Token esperado no header `Authorization`. Marker único, sem valor real
# versionado: este repositório não guarda credencial, e a auditoria
# `__OBS_TOKEN_ESPERADO__` no `nginx -T` na VPS é a que acusa alguém que
# instalou o conf sem substituir.
map $host $observability_bearer_esperado {
    default "__OBS_TOKEN_ESPERADO__";
}

# 0 enquanto o valor for o marcador (ou for curto demais para ser um token).
# Consequência deliberada: o marcador NUNCA autoriza, mesmo que o cliente o
# envie no header — instalar o conf sem substituir não abre uma porta nova,
# apenas mantém o acesso externo fechado.
map $observability_bearer_esperado $observability_bearer_configurado {
    default 0;
    "~^__OBS_TOKEN" 0;
    "~^.{16,}$" 1;
}

# 1 quando o header traz exatamente o token configurado. Comparação por regex
# porque o valor do token vive em variável (o `map` acima): o `if` do site
# confere só o resultado, e o app continua fazendo o seu `compare_digest`.
map $http_authorization $observability_bearer_valido {
    default 0;
    "~*^Bearer[ ]+$observability_bearer_esperado$" 1;
}

# Decisão final, em UM map só para que o site precise de um único `if` plano
# (aninhar `if` é inválido no Nginx: "if directive is not allowed here").
#   $observability_origem_confiavel = 1               => liberado por origem de rede
#   origem 0 + token configurado 1 + bearer válido 1  => liberado por token
#   qualquer outra combinação                         => 0, e o site responde 404
map "$observability_origem_confiavel $observability_bearer_configurado $observability_bearer_valido" $observability_acesso {
    default 0;
    "~^1 " 1;
    "~^0 1 1$" 1;
}

# --- Log de acesso da borda (critérios 18 e 21) ---------------------------
# JSON: é o que o Grafana Alloy faz tail (`loki.source.file`) sem parse. Os
# campos de correlação vêm PRIMEIRO porque são os que o operador usa; a query
# string NÃO entra (o acesso pode carregar termo de busca, e o critério 28
# proíbe preservar query string em log técnico). `escape=json` é obrigatório:
# sem ele, um User-Agent com aspas quebraria uma linha por requisição.
#
# TODO valor é quoted de propósito, inclusive os numéricos: `$status` pode
# vir vazio em resposta gerada antes do rewrite, e `$upstream_response_time`
# vem vazio em erro de conexão e em cache HIT — JSON sem aspas quebraria a
# linha justamente nos casos que mais importam. No LogQL, `| json` + `unwrap`
# converte o que precisa ser número.
#
# O ambiente NÃO vai aqui: este arquivo é compartilhado pelos três sites. Ele
# entra como label estático do Loki, por arquivo, no `config.alloy`.
log_format portal_acesso escape=json
    '{'
    '"time":"$time_iso8601",'
    '"request_id":"$portal_request_id",'
    '"nginx_request_id":"$request_id",'
    '"service":"portal-edge",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":"$status",'
    '"bytes":"$body_bytes_sent",'
    '"request_time":"$request_time",'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status",'
    '"upstream_release":"$upstream_http_x_release",'
    '"upstream_operational_state":"$upstream_http_x_operational_state",'
    '"cache_status":"$upstream_cache_status",'
    '"remote_addr":"$remote_addr",'
    '"user_agent":"$http_user_agent",'
    '"referer":"$http_referer"'
    '}';

# --- Chave de escrita (inalterado desde P1-4) -----------------------------

map $request_method $limit_post {
    default "";
    POST   $binary_remote_addr;
}

# `1` para métodos que não são GET/HEAD; valor vazio para os dois métodos
# cacheáveis. O mapa é consumido pelos snippets de cache para que um POST
# que caia na location de cache nunca seja armazenado.
map $request_method $cache_method_bypass {
    default "1";
    GET    "";
    HEAD   "";
}

limit_req_zone $limit_post zone=escrita_publica:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
proxy_cache_path /var/cache/nginx/feed levels=1:2 keys_zone=feed_cache:10m max_size=200m inactive=120s use_temp_path=off;
