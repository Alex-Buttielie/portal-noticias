# P1-4 — configuração global de cache/rate do Nginx.
#
# INSTALE UMA VEZ dentro do bloco `http {}` da VPS, por exemplo:
#   http {
#       include /etc/nginx/http-cache.conf;
#       include /etc/nginx/sites-enabled/*;
#   }
#
# Este arquivo NÃO é um include de site: `map`, `limit_req_zone`,
# `proxy_cache_path` e `log_format` só são válidos no contexto `http`. Os
# arquivos `portal-location-*.conf` são activados separadamente dentro dos
# locations; enquanto eles não forem instalados, os sites continuam válidos,
# mas cache/rate ficam deliberadamente inativos (fail-safe para o reload).
#
# `map` deixa a chave de escrita vazia para GET/HEAD; nesse caso a zone de
# escrita não aplica o limite. O cache só pode ser ativado depois deste
# arquivo estar instalado (e os snippets de location, depois deste include).

map $request_method $limit_post {
    default "";
    POST   $binary_remote_addr;
}

# `1` para métodos que não são GET/HEAD; valor vazio para os dois métodos
# cacheáveis. O mapa é consumido pelos snippets de cache para que um POST
# que caia na location de cache nunca seja armazenado.
map $request_method $cache_method_bypass {
    default "1";
    GET    "";
    HEAD   "";
}

limit_req_zone $limit_post zone=escrita_publica:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
proxy_cache_path /var/cache/nginx/feed levels=1:2 keys_zone=feed_cache:10m max_size=200m inactive=120s use_temp_path=off;

# ---------------------------------------------------------------------------
# P2-01 — `log_format portal_acesso`: o access log em JSON.
# ---------------------------------------------------------------------------
# POR QUE ISTO EXISTE
# O coletor (`infra/observability/alloy/config.alloy`) lê a borda com
# `loki.source.file "edge"` e o `stage.json` só extrai campo se a LINHA for um
# objeto JSON. Com o `combined` padrão (texto livre) o Loki indexa a linha
# inteira como texto e nenhum campo sai: o painel de acesso fica vazio sem
# erro em lugar nenhum, que é o falso verde que este `log_format` fecha.
#
# `escape=json` NÃO É OPCIONAL. Sem ele o Nginx escreve o valor da variável
# como veio, e um `User-Agent` com aspas (`Mozilla/5.0 "Bot"`) fecha a string
# JSON no meio: a linha deixa de parsear e o `stage.json` a descarta em
# silêncio. Verificado: é a diferença entre a amostra de prova passar em
# `json.loads` e o coletor silenciosamente cego.
#
# TODOS OS VALORES SÃO QUOTED, inclusive os numéricos (`"status":"200"`, e
# não `"status":200`). Motivo: `$upstream_response_time` e `$upstream_addr`
# ficam VAZIOS quando não há upstream (o `location /` do Next.js, um 304, um
# `return 301` do bloco HTTP), e um valor vazio sem aspas produz
# `"upstream_addr":,` — JSON inválido. Quoted, o vazio vira `""` e a linha
# continua válida. O coletor compara status como TEXTO
# (`status >= "500"`, `config.alloy:216`) por causa disso.
#
# CAMPOS: estes são os que o painel e as queries do coletor leem de fato.
#   status       -> `stage.match` (5xx) e o filtro do painel de acesso
#   uri, method  -> `stage.json` do `config.alloy`
#   request_id   -> `stage.json`; é o que amarra a linha de borda à do backend
#   request_time -> latência de requisição (o que `portal_http_request_duration_*`
#                  não dá, porque não existe no backend)
#   bytes_sent   -> volume por rota
#   remote_addr, host, upstream_status -> contexto de incidente e de quem falhou
# `http_user_agent` NÃO entra: é controlado pelo cliente, de cardinalidade
# livre, e nenhuma query deste diretório o lê. Fica no `combined` para quem
# precisar depurar no dia.
log_format portal_acesso escape=json
  '{'
    '"time":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":"$status",'
    '"bytes_sent":"$body_bytes_sent",'
    '"request_time":"$request_time",'
    '"host":"$host",'
    '"remote_addr":"$remote_addr",'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"scheme":"$scheme"'
  '}';
