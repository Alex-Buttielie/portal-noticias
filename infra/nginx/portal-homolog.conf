# Nginx canônico — HOMOLOG (idêntico ao ativo na VPS em
# /etc/nginx/sites-available/portal-homolog).
#
# TLS parametrizado: antes de instalar este arquivo, substitua o marcador
# __DOMAIN_FRONTEND__ pelo hostname real de HOMOLOG. O certificado é de
# Certbot (Let's Encrypt) e o caminho deriva do nome do lineage. `DOMAIN_API`
# pertence à variante Docker/Caddy; na topologia PM2 o frontend e a API
# compartilham este host e `/api/`.
#
# Regras que o portal assume (se divergirem, o portal quebra):
# 1. `location /api/` preserva o path completo (`proxy_pass` SEM barra
#    final): o Django serve `/api/...` e o frontend chama `{ORIGEM}/api/...`.
# 2. `location /` vai para o Next.js.
# Aplicar na VPS: sudo cp infra/nginx/portal-homolog.conf
#   /etc/nginx/sites-available/portal-homolog && sudo nginx -t && sudo systemctl reload nginx
#
# P1-4 (run 20260923-1230): gzip + upstream/keepalive + cache/rate opcionais
# de feed/radar + estático/mídia público + read_timeout 60s.
#
# `map`, `limit_req_zone`, `proxy_cache_path` e `log_format` não são válidos
# neste arquivo de site: eles ficam versionados em
# `infra/nginx/http-cache.conf` e devem ser incluídos uma vez dentro do
# `http {}` global da VPS. O `access_log` que consome o `log_format
# portal_acesso` fica AQUI, no `server`, porque o `log_format` em si só
# existe no contexto `http`. Os snippets de
# location (`portal-location-*.conf`) também são opcionais: enquanto não
# estiverem instalados, estes arquivos fazem `nginx -t` sem zones e deixam
# cache/rate desligados em vez de deixar o reload inválido. A ordem de
# instalação e os comandos estão em `infra/DEPLOY.md`.
#
#
# MAJOR-1 (Onda 2) — `X-Forwarded-For` e a identidade do rate limit.
#
# Todo `proxy_pass` deste arquivo declara
#     proxy_set_header X-Forwarded-For $remote_addr;
# Sem isso, o Django recebia o cabeçalho VERBATIM do cliente. Medido na base
# `1dec732`: com `REST_FRAMEWORK["NUM_PROXIES"]` ausente, o `get_ident` do
# DRF devolvia o XFF cru (`rest_framework/throttling.py:33-40`), de modo que
# 12 valores de XFF com o mesmo `REMOTE_ADDR` abriram 12 baldes distintos e
# o limite de 10/min do login (`config/throttling.py:AuthSensivelAnonThrottle`,
# que existe contra brute force/credential stuffing) era "reiniciado" a cada
# cabeçalho novo. `grep -rl X_FORWARDED_FOR backend/` era vazio: nada no
# backend recusava o cabeçalho.
#
# POR QUE `$remote_addr` E NÃO `$proxy_add_x_forwarded_for`:
# `$proxy_add_x_forwarded_for` CONCATENA o XFF que o cliente enviou ao que o
# Nginx viu. O `get_ident` atual pega o ÚLTIMO elemento, então o balde
# estaria certo mesmo assim — mas o cabeçalho continuaria carregando bytes
# escolhidos pelo atacante na frente, prontos para enganar qualquer outro
# consumidor (log, auditoria, WAF) que o leia de forma diferente. Sobrescrever
# deixa o cabeçalho com UM único elemento, escrito só pelo Nginx.
#
# POR QUE ISSO NÃO RESOLVE SOZINHO (e o backend continua validando):
# reescrever funciona enquanto o Nginx é a borda. Se um dia houver balanceador
# ou CDN (ex.: a Cloudflare opcional de `infra/DEPLOY.md` seção 3) NA FRENTE
# do Nginx, `$remote_addr` passa a ser o IP do balanceador e o IP real do
# cliente se perde — o que, com o limite de 10/min no login, faria TODOS os
# usuários atrás daquele balanceador compartilharem um balde só (self-DoS).
# Por isso o backend NÃO confia no cabeçalho por conta própria: `get_ident` em
# `backend/config/proxies.py` só o lê quando o `REMOTE_ADDR` pertence ao
# conjunto declarado em `TRUSTED_PROXY_IPS`, e cai em `REMOTE_ADDR` em
# qualquer outro caso (fail-closed). As duas metades se protegem: o Nginx
# não repassa o que o cliente forjou, e o Django não acredita num cabeçalho
# de quem não foi declarado confiável.
#
# Se um balanceador for COLOCADO NA FRENTE deste Nginx, configure-o aqui com o
# módulo `real_ip` (`set_real_ip_from` + `real_ip_header X-Forwarded-For`)
# em vez de confiar na cadeia inteira — e declare os mesmos proxies em
# `TRUSTED_PROXY_IPS` no ambiente do Django.
#
# O conf é fail-closed para a mídia: `credenciamento/` nunca é servido pelo
# Nginx; documentos ficam somente no `DocumentoView` autenticado do Django.

upstream portal_api_homolog {
  server 127.0.0.1:5102;
  keepalive 32;
}

# HTTP: ACME e o probe local de saúde são as únicas exceções ao redirect.
server {
  listen 80;
  server_name __DOMAIN_FRONTEND__;

  # P2-01: acesso externo em JSON. O `log_format portal_acesso` é declarado no
  # `http {}` (infra/nginx/http-cache.conf) e o `access_log` aponta para ele
  # AQUI, no `server` — `log_format` não é válido neste contexto.
  # O caminho inclui o ambiente de propósito: `ALLOY_EDGE_LOG_GLOB` é uma
  # instância por ambiente e um arquivo único misturaria dev, homolog e prod
  # no mesmo índice do Loki.
  access_log /var/log/nginx/portal-homolog.access.log portal_acesso;

  # HTTP-01 do Certbot precisa chegar em claro; este location tem precedência
  # sobre o redirect genérico abaixo. O webroot deve existir antes de pedir o
  # certificado (ver infra/DEPLOY.md, seção "Ativando TLS").
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  # O health check interno continua acessível em HTTP durante a migração. O
  # forwarded proto é https para que Django, já com SECURE_SSL_REDIRECT=true,
  # não redirecione o probe para fora da VPS. O acesso externo é negado.
  location = /healthz {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://portal_api_homolog;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # `/metrics` e `/health-detail`: as DUAS rotas privadas do portal
  # (`backend/config/urls.py:26-27`), e aqui em HTTP o acesso externo já está
  # barrado. O que este bloco acrescenta é o PROXY: sem ele, `location /`
  # abaixo responderia 301 para o host de destino, e um scraper que não
  # seguisse o redirect perderia a rota. O `allow/deny` é o mesmo do
  # `/healthz` acima — mesmo padrão, sem exceção.
  location = /metrics {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://portal_api_homolog;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location = /health-detail {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://portal_api_homolog;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS: a aplicação e o proxy reverso só são ativados depois de o certificado
# existir e `nginx -t` passar. Não copie este arquivo com os marcadores.
server {
  listen 443 ssl;
  server_name __DOMAIN_FRONTEND__;

  # Mesmo `log_format` e mesmo caminho do bloco HTTP acima; o servidor TLS é
  # onde está o tráfego real. Declarar nos DOIS é redundância deliberada: o
  # `access_log` do `server` substitui o do `http`, e sem esta linha o HTTPS
  # cairia no log padrão (texto livre) e o painel de acesso perderia o grosso
  # do tráfego.
  access_log /var/log/nginx/portal-homolog.access.log portal_acesso;

  ssl_certificate /etc/letsencrypt/live/__DOMAIN_FRONTEND__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMAIN_FRONTEND__/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Security headers — defesa em profundidade (sempre com `always` para cobrir 4xx/5xx).
  # X-Frame-Options DENY também é enviado pelo Django (X_FRAME_OPTIONS) quando
  # DEBUG=False; duplicar aqui com `always` é inofensivo e cobre respostas não-Django
  # (ex.: 50x do Nginx ou /healthz sem passar pelo Django).
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # HSTS: Django já envia SECURE_HSTS_SECONDS quando DEBUG=False e TLS existe;
  # não duplicar aqui por padrão. Se o operador quiser um header também no
  # Nginx, descomente somente depois de confirmar includeSubDomains:
  # add_header Strict-Transport-Security "max-age=2592000; includeSubDomains" always;

  # Compressão: API retorna JSON volumoso (feed paginado). Tipos curados —
  # sem imagens/vídeos (já comprimidos; gzip só gasta CPU).
  # brotli fica como comentário: exige ngx_brotli, ausente no nginx-core da VPS.
  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_vary on;
  gzip_proxied any;
  # brotli on; brotli_types text/plain text/css application/json application/javascript text/xml;

  # Estático do Django (collectstatic → backend/staticfiles; WhiteNoise
  # continua como fallback se o Nginx não tiver o volume montado).
  # NOTA `add_header`: diretiva em location SUBSTITUI todas as do server
  # (pegadinha clássica do Nginx) — por isso os security headers se repetem
  # aqui; sem isso o estático perderia X-Frame-Options etc.
  # Sem `expires` de propósito: ele emite `Cache-Control: max-age=...` que
  # duplicaria o header explícito abaixo. WhiteNoise continua como fallback.
  # Path real na VPS: /home/apps/portal-homolog/backend/staticfiles.
  location /static/ {
    alias /home/apps/portal-homolog/backend/staticfiles/;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    access_log off;
  }

  # MEDIA_ROOT contém uploads de FileField do app de credenciamento.
  # O grep dos models encontrou `foto` e `documento` sob a mesma árvore
  # `credenciamento/<user_id>/`; não é seguro inferir privacidade pela extensão.
  # Portanto NÃO existe alias do volume inteiro: esta subtree é negada e o
  # documento continua acessível apenas pelo DocumentoView autenticado.
  # O único subtree público futuro é `media/public/`; arquivos nele devem
  # ser revisados como públicos antes de serem depositados.
  location = /media {
    return 404;
  }

  location = /media/ {
    return 404;
  }

  location = /media/credenciamento {
    return 404;
  }

  location ^~ /media/credenciamento/ {
    return 404;
  }

  location /media/public/ {
    alias /home/apps/portal-homolog/backend/media/public/;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control "public, max-age=604800" always;
    access_log off;
  }

  location = /healthz {
    proxy_pass http://portal_api_homolog;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # `/metrics` e `/health-detail`: as duas rotas privadas, agora com BARREIRA
  # DE BORDA (`location =`, o mesmo `=` exato do `/healthz` acima — não
  # `^~`: para path exato o `=` tem precedência máxima e não chega a avaliar
  # regex, enquanto `^~` continuaria subjecto aos `location ~` do arquivo).
  #
  # SEM o `allow/deny` estas duas rotas NÃO são públicas por acidente: elas não
  # têm route no Next.js, então caem em `location /` e o frontend responde 404.
  # Isso é uma barreira real, mas por acidente e frágil — basta o frontend
  # ganhar um catch-all, um rewrite ou um `trailingSlash` para a rota vaza. Com
  # `deny all` a barreira é do Nginx, que não depende do Next.js. Medido em
  # develop (origin/develop), `/metrics` e `/health-detail` respondiam 404 pelo
  # frontend em HTTPS; aqui respondem 403, e em loopback chegam ao Django.
  #
  # ESTE é o bloco que fecha o furo 2 (o comentário do `config.alloy` que
  # afirmava que esta camada não existia estava certo até este commit).
  location = /metrics {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://portal_api_homolog;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location = /health-detail {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://portal_api_homolog;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Cadastro é escrita pública (DRF 20/min), não login/recuperação
  # (auth sensível 10/min). A location exata tem precedência sobre /api/auth/.
  location = /api/auth/cadastro/ {
    include /etc/nginx/portal-location-write*.conf;
    proxy_pass http://portal_api_homolog;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /api/auth/ {
    include /etc/nginx/portal-location-auth*.conf;
    proxy_pass http://portal_api_homolog;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Interações é POST público (AllowAny). A location exata não pode ser
  # capturada pelo regex de cache; por isso usa explicitamente a mesma
  # proteção de escrita pública (20/min) do location /api/.
  location = /api/feed/interacoes/ {
    include /etc/nginx/portal-location-write*.conf;
    proxy_pass http://portal_api_homolog;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Cache de borda local (run 20260923-1230 P1-4): SOMENTE as listagens
  # públicas que não variam por usuário — exatamente as que o cache de app
  # cobre em `feed/views.py` (lista, urgentes, mais-lidas, home, destaques).
  # `exibir_publicidade` saiu do feed (vai via GET /api/gating/status).
  #
  # ALLOWLIST explícita, e não um `^/api/feed/` amplo: o regex amplo
  # capturaria `feed/busca/historico/` (padrão POR USUÁRIO/SESSÃO — vazaria
  # o histórico de busca entre visitantes, porque a chave de cache não tem
  # componente de usuário) e `feed/interacoes/` (POST público sem throttle
  # DRF — perderia o `limit_req` de `location /api/`, já que regex location
  # tem precedência sobre prefix location). Ambos ficam de fora do cache e
  # voltam a ser tratados por `location /api/`.
  #
  # Chave sem cookie/Authorization (método + host + URI); requisição
  # autenticada nunca serve do cache nem o popula (bypass + no_cache).
  # TTL 45s = mesmo do cache de app (FEED_CACHE_TTL_SEGUNDOS, run P1-A).
  location ~ ^/api/(feed/$|feed/(urgentes|mais-lidas|home|destaques|busca|busca/populares|busca/autocomplete)/$|radar/tendencias/$) {
    # A allowlist de URI é exata; o cache fragment também limita a operação
    # a GET/HEAD. Se um método de escrita alcançar esta location por uma
    # futura rota, o map o impede de ser cacheado e o include de escrita
    # ainda aplica o limite público.
    include /etc/nginx/portal-location-cache*.conf;
    include /etc/nginx/portal-location-write*.conf;
    # Mesma regra do `add_header` de /static/: location com add_header
    # próprio perde os security headers do server — repetir aqui.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    proxy_pass http://portal_api_homolog;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Escrita pública (POST anônimo: cadastro, lista de espera, comunidade):
  # defesa em profundidade além do throttle DRF `escrita_publica` 20/min
  # (config/throttling.py) — mesma taxa aqui.
  location /api/ {
    include /etc/nginx/portal-location-write*.conf;
    proxy_pass http://portal_api_homolog;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    # 60s é o default seguro enquanto o endpoint 202+background não for
    # ancestral comprovado do ref implantado. Só depois desse commit o
    # par pode ser reduzido para 45s (Gunicorn + Nginx) na mesma mudança.
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    proxy_pass http://127.0.0.1:3102;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
