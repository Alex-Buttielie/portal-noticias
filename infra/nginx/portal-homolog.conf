# Nginx canônico — HOMOLOG (idêntico ao ativo na VPS em
# /etc/nginx/sites-available/portal-homolog). Ver portal-dev.conf para as
# regras assumidas pelo portal e o caminho de evolução para TLS.

server {
  listen 80;
  server_name homolog.portal-noticias.com.br;

  # Security headers — ver portal-dev.conf (mesmo bloco, defesa em profundidade).
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # HSTS via Django quando TLS existir; ver nota em portal-dev.conf.

  # Rate limiting: ver comentário em portal-dev.conf.

  location = /healthz {
    proxy_pass http://127.0.0.1:5102;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
  }

  location /api/auth/ {
    # limit_req zone=auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:5102;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /api/admin/robos/executar/ {
    proxy_pass http://127.0.0.1:5102;
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:5102;
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location / {
    proxy_pass http://127.0.0.1:3102;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }
}
