# Nginx canônico — HOMOLOG (idêntico ao ativo na VPS em
# /etc/nginx/sites-available/portal-homolog). Ver portal-dev.conf para as
# regras assumidas pelo portal e o caminho de evolução para TLS.

server {
  listen 80;
  server_name homolog.portal-noticias.com.br;

  location /api/ {
    proxy_pass http://localhost:5102;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    proxy_pass http://localhost:3102;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
  }
}
