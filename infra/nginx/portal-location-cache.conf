# P1-4 — snippet de location para cache público (GET/HEAD).
# Copie para /etc/nginx/portal-location-cache.conf somente depois de
# instalar http-cache.conf no http {}. O include usa glob intencionalmente:
# se o arquivo ainda não existir, o site permanece sintaticamente válido,
# sem cache e sem rate limit.
proxy_cache feed_cache;
proxy_cache_methods GET HEAD;
proxy_cache_key "$scheme$request_method$host$request_uri";
proxy_cache_valid 200 45s;

# Nunca servir nem popular cache para credenciais, sessão ou métodos que
# não sejam GET/HEAD. O mapa $cache_method_bypass vem de http-cache.conf.
proxy_cache_bypass $cache_method_bypass$http_authorization$cookie_sessionid$cookie_csrftoken;
proxy_no_cache $cache_method_bypass$http_authorization$cookie_sessionid$cookie_csrftoken;

# Uma requisição preenche a entrada; as demais esperam. Em erro, stale é
# preferível a derrubar a API.
proxy_cache_lock on;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
add_header X-Cache-Status $upstream_cache_status always;
