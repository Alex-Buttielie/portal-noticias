# Nginx canônico — PROD (idêntico ao ativo na VPS em
# /etc/nginx/sites-available/portal-prod). Ver portal-dev.conf para as
# regras assumidas pelo portal e o caminho de evolução para TLS.

server {
  listen 80;
  server_name portal-noticias.com.br www.portal-noticias.com.br;

  # Security headers — ver portal-dev.conf (mesmo bloco, defesa em profundidade).
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # HSTS via Django quando TLS existir; ver nota em portal-dev.conf.

  # Rate limiting: limit_req_zone deve ser definido no http {} global
  # (ex.: limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;).
  # Descomente `limit_req` em /api/auth/ quando a zona existir. Sem a zona,
  # nginx -t falha — por isso fica comentado por padrão.

  location = /healthz {
    proxy_pass http://127.0.0.1:5103;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
  }

  # Auth — limite mais restritivo; ver comentário de limit_req acima.
  location /api/auth/ {
    # limit_req zone=auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:5103;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:5103;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location / {
    proxy_pass http://127.0.0.1:3103;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }
}
