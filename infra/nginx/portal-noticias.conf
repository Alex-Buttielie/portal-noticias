# Nginx canônico da VPS (PM2 + Nginx — caminho ativo, ver CI-CD.md).
#
# Cada ambiente tem DOIS processos PM2 (web 31xx + api 51xx) e UM server
# Nginx por domínio. Regras que o frontend/backend assumem e que precisam
# ser verdadeiras na VPS (se divergirem, o portal quebra):
#
# 1. `location /api/` faz proxy para a API **preservando o path completo**
#    (`proxy_pass http://localhost:51xx;` SEM barra final). O Django serve
#    `/api/...` e o frontend chama `{ORIGEM}/api/...` — se o Nginx cortar o
#    prefixo /api/, tudo vira 404; se o frontend usasse ORIGEM=https://host/api,
#    tudo viraria /api/api/... (404 também). Origem e proxy precisam casar
#    exatamente como está aqui.
# 2. `location /` faz proxy para o Next.js (31xx).
# 3. `FRONTEND_BASE_URL` no backend/.env de cada ambiente é `https://<host>`
#    — é essa a origem que o Django libera no CORS e usa nos links de e-mail.
#
# Como aplicar na VPS (uma vez; deploys seguintes não mexem aqui):
#   sudo cp infra/nginx/portal-noticias.conf /etc/nginx/sites-available/portal-noticias
#   sudo ln -s /etc/nginx/sites-available/portal-noticias /etc/nginx/sites-enabled/portal-noticias
#   sudo nginx -t && sudo systemctl reload nginx
# Certificados: certbot --nginx -d dev.portal-noticias.com.br -d homolog.portal-noticias.com.br -d portal-noticias.com.br -d www.portal-noticias.com.br

# Desvia http -> https (preserva host e path). O Django roda com
# DJANGO_SECURE_SSL_REDIRECT=false porque o TLS termina aqui.
server {
    listen 80;
    server_name dev.portal-noticias.com.br homolog.portal-noticias.com.br portal-noticias.com.br www.portal-noticias.com.br;
    return 301 https://$host$request_uri;
}

# ---------------- DEV (develop) — web 3101 / api 5101 ----------------
server {
    listen 443 ssl;
    server_name dev.portal-noticias.com.br;

    # ssl_certificate / ssl_certificate_key gerenciados pelo certbot.

    location /api/ {
        proxy_pass http://localhost:5101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://localhost:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

