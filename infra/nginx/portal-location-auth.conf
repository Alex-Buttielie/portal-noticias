# P1-4 — limite de autenticação sensível: 10 req/min por IP.
# A zone `auth` é declarada em http-cache.conf, no http {} global.
# Copie este arquivo para /etc/nginx/portal-location-auth.conf somente
# depois da instalação global; o include glob no site é no-op sem ele.
limit_req zone=auth burst=10 nodelay;
limit_req_status 429;
